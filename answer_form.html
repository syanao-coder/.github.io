<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>回答フォーム ─ 同時視聴コントローラー</title>

<!-- ============================================================================
     answer_form.html v2.0.0 ─ テストの回答用紙（開発基盤）

     🔴 ローカル専用。GitHub Pages には置かない。
     🔴 controller.html とは無関係な独立したファイル。本体は一切参照しない。

     ── v2.0.0 の設計方針（利用者の指摘を受けた作り直し）─────────────
     1. 🔴 項目のIDは手順書の見出し番号と完全に一致させる（T1 のテスト → T1 の欄）。
     2. 🔴 画面の並び順 ＝ 手順書の順 ＝ 出力の順。上から順に埋めれば終わる。
     3. 🔴 1テストにつき貼り付けは1箇所だけ。
     4. 🔴 合否の判断を利用者にさせない。「ログのどこを読め」と書かない。
        貼り付けられた出力を読んで判定するのは受け取り側の仕事である。
     5. 🔴 機械で観測できることはフォーム自身が自動で集めて出力へ埋め込む
        （下の runSelfCheck()）。人には聞かない。
     ─────────────────────────────────────────────

     使い方: この下の FORM_META と FORM_ITEMS を差し替えるだけ。
             HTML の構造・CSS・ページ末尾のスクリプトは毎回そのまま。
     ========================================================================= -->

<script>
/* ===========================================================================
   ▼▼▼ ここから: 毎回差し替える項目定義 ▼▼▼

   FORM_ITEMS の1項目
     id      … 🔴 手順書の見出し番号と同じにする（'T1' など）
     type    … 'suite' | 'paste' | 'radio' | 'check' | 'text' | 'shot'
     label   … 何を貼る／答えるか
     help    … 補足
     options … radio / check の選択肢（「未実施」「測れなかった」は自動で足される）
     secret  … true にすると値の入力欄を作らず「ある / ない」だけにする
     optional… true にすると未記入として数えない

   🔴 項目を足したくなったら、まず「debug_suite.js か自己診断で取れないか」を
      検討すること。フォームは最後の手段である。
   =========================================================================== */

var FORM_META = {
    defVersion: '2026-08-14.v275',
    work: 'v2.7.5 ─ メンバー限定アーカイブのチャット取得',
    base: '本体 v2.7.5 / debug_suite.js v1.4.2 / answer_form.html v2.0.0',
    note: '手順書の T1 → T8 の順に、上から埋めてください。'
        + '合否の判定は不要です。デバッグメニューの「📋 報告書用にコピー」を押して、そのまま貼ってください。'
        + '判定はすべてコードが出しています。ログを読んで良し悪しを判断する必要はありません。'
};

var FORM_ITEMS = [
    {
        id: 'T1', type: 'shot',
        label: '版数と測定環境のスクリーンショット（2枚）',
        help: '① about:debugging の当アドオンの版数が 2.7.5 になっている画面。'
            + '② about:support の「アプリケーション基本情報 → 名前」（Firefox か Floorp かの実体）。'
            + '🔴 Cookie の値・トークン・パスワードが写らない撮り方にしてください。'
            + '画像はこのフォームでは扱いません。ファイル名の日時で対応づけます。'
    },
    {
        id: 'T2', type: 'suite',
        label: '自動テスト一括（▶ すべて実行 → 💬 D-C 取得一括）の出力',
        help: 'デバッグメニューで「▶ すべて実行」→「💬 D-C 取得一括」の順に押し、'
            + '終わったら「📋 報告書用にコピー」を1回押して、ここに貼ってください。'
    },
    {
        id: 'T3', type: 'suite',
        label: 'コメント流し（🌊 D-C4 流し）の出力',
        help: '「🌊 D-C4 流し（盾オフ）」を押して最後まで進め、'
            + '「📋 報告書用にコピー」を押して、ここに貼ってください。'
            + '途中で盾の状態と、見えたかどうかを聞かれます。'
    },
    {
        id: 'T4', type: 'suite', optional: true,
        label: '所要時間の参考値（⏱ D-C11 参考値）の出力',
        help: '重いアーカイブを取得します。3〜10分かかります。'
            + '時間が取れないときは空欄のままでかまいません（この項目だけ任意です）。'
    },
    {
        id: 'T5', type: 'suite',
        label: '理由コードの人工再現（🧪 D-C9 人工再現）の出力',
        help: '手順書 T5 のパッチを取得タブへ当ててから「🧪 D-C9 人工再現」を押し、'
            + '「📋 報告書用にコピー」を押して、ここに貼ってください。'
            + '貼り終わったら、手順書 T5 の復元スニペットを必ず実行してください。'
    },
    {
        id: 'T6', type: 'suite',
        label: '非ログインでの回帰（🚪 D-C10 非ログイン）の出力',
        help: 'YouTube からログアウトしてから「🚪 D-C10 非ログイン」を押し、'
            + '「📋 報告書用にコピー」を押して、ここに貼ってください。'
            + '貼り終わったら、メンバー登録済みのアカウントへログインし直してください。'
    },
    {
        id: 'T7', type: 'radio', secret: true,
        label: '貼り付けた出力に、認証情報（Cookie の値・ハッシュ・トークン）が写っていましたか',
        help: 'コード側でも自動検査していますが、念のための確認です。'
            + '「ある」を選んだ場合は、その項目を貼らずに末尾の自由記入へ状況だけ書いてください。'
    },
    {
        id: 'T8', type: 'radio',
        label: '画面の見た目や操作で、気になったことはありましたか',
        options: ['特になし', 'あった（内容は末尾の自由記入へ）'],
        help: '数値で測れない崩れや使いにくさだけを聞いています。テストの合否は聞いていません。'
    }
];

/* ▲▲▲ ここまで: 毎回差し替える項目定義 ▲▲▲ */
</script>

<style>
:root {
    --bg: #0d0d12; --panel: #14141c; --line: #2c2c38;
    --fg: #dcdce4; --dim: #8a8a99; --accent: #00ffcc; --warn: #ff5555;
}
* { box-sizing: border-box; }
body {
    margin: 0; padding: 0 0 64px 0;
    background: var(--bg); color: var(--fg);
    font-family: "Segoe UI", "Yu Gothic UI", Meiryo, sans-serif;
    font-size: 14px; line-height: 1.6;
}
header {
    position: sticky; top: 0; z-index: 10;
    background: rgba(13,13,18,0.96); border-bottom: 1px solid var(--line);
    padding: 10px 16px; backdrop-filter: blur(8px);
}
header h1 { margin: 0 0 4px 0; font-size: 1.0rem; color: var(--accent); }
header .meta { font-size: 0.78rem; color: var(--dim); }
#blankCount { font-weight: bold; font-size: 0.86rem; margin-top: 6px; display: inline-block; }
#blankCount.ng { color: var(--warn); }
#blankCount.ok { color: var(--accent); }
main { max-width: 900px; margin: 0 auto; padding: 16px; }
.note {
    border: 1px solid var(--line); border-left: 3px solid var(--accent);
    background: var(--panel); padding: 8px 12px; margin-bottom: 18px;
    font-size: 0.82rem; color: var(--dim);
}
.item {
    border: 1px solid var(--line); border-radius: 5px;
    background: var(--panel); padding: 10px 12px; margin-bottom: 12px;
}
.item.blank { border-color: var(--warn); background: rgba(255,85,85,0.06); }
.item .id {
    display: inline-block; font-family: monospace; font-size: 0.78rem; font-weight: bold;
    color: #000; background: var(--accent); border-radius: 3px;
    padding: 0 7px; margin-right: 8px;
}
.item .label { font-weight: bold; }
.item .help { font-size: 0.78rem; color: var(--dim); margin: 4px 0 0 0; }
.item .secret-warn, .item .shot-warn { font-size: 0.78rem; color: #ffcc55; margin: 4px 0 0 0; }
.item label.choice { display: block; padding: 3px 2px; cursor: pointer; }
.item .choices { margin-top: 8px; }
.item input[type=text] {
    width: 100%; margin-top: 8px; padding: 6px 8px;
    background: #07070a; color: var(--fg);
    border: 1px solid var(--line); border-radius: 4px;
    font-family: inherit; font-size: 0.86rem;
}
/* 🔴 高さを固定してスクロールさせる。何万文字を貼ってもレイアウトを崩さない。 */
.item textarea.paste, textarea.paste {
    width: 100%; height: 160px; max-height: 160px;
    margin-top: 8px; padding: 6px 8px; resize: none; overflow: auto;
    background: #07070a; color: var(--fg);
    border: 1px solid var(--line); border-radius: 4px;
    font-family: monospace; font-size: 0.76rem; line-height: 1.4;
    white-space: pre; word-break: normal;
}
.item .len { font-size: 0.74rem; color: var(--dim); margin-top: 2px; }
#scratch { position: absolute; left: -9999px; top: 0; width: 600px; }
footer {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    background: rgba(13,13,18,0.96); border-top: 1px solid var(--line);
    padding: 8px 16px; text-align: right; backdrop-filter: blur(8px);
}
button {
    background: transparent; color: var(--accent);
    border: 1px solid var(--accent); border-radius: 4px;
    padding: 5px 12px; margin-left: 6px; cursor: pointer;
    font-family: inherit; font-size: 0.84rem;
}
button:hover { background: rgba(0,255,204,0.12); }
button.sub { color: var(--dim); border-color: var(--line); }
button.sub:hover { background: rgba(255,255,255,0.05); }
#status { font-size: 0.78rem; color: var(--dim); margin-right: 10px; }
</style>
</head>
<body>

<header>
    <h1 id="hTitle">回答フォーム</h1>
    <div class="meta" id="hMeta"></div>
    <div><span id="blankCount">未記入 －件</span></div>
</header>

<main>
    <div class="note" id="hNote"></div>
    <div id="form"></div>
</main>

<div id="scratch" aria-hidden="true"></div>

<footer>
    <span id="status"></span>
    <button type="button" class="sub" id="btnClear">🗑 下書きを消す</button>
    <button type="button" class="sub" id="btnDownload">⬇ .md を保存</button>
    <button type="button" id="btnCopy">📋 報告書用にコピー</button>
</footer>

<script>
(function () {
    'use strict';

    /* エンジンの版数。項目定義の版数（FORM_META.defVersion）とは別系統。 */
    var FORM_ENGINE_VERSION = '2.0.0';

    /* 選択肢に必ず足すもの。空欄と「答えられなかった」を区別するために要る。 */
    var EXTRA_CHOICES = ['未実施', '測れなかった（理由は自由記入へ）'];
    var SECRET_CHOICES = ['ある', 'ない'];

    var LS_KEY = 'answer_form_draft';

    var answers = {};
    var freeText = '';
    var restoredAt = '';     /* 下書きを復元した時刻（自己診断で使う） */

    /* ------------------------------------------------------------------ */
    /* 項目の正規化（純関数。自己診断からも呼ぶ）                          */
    /* ------------------------------------------------------------------ */

    function normalize(it) {
        var o = {
            id: String(it.id),
            type: String(it.type || 'text'),
            label: String(it.label || ''),
            help: it.help ? String(it.help) : '',
            secret: !!it.secret,
            optional: !!it.optional,
            options: (it.options || []).slice(),
            noSkip: !!it.noSkip
        };
        /* 🔴 secret は type が何であっても「ある / ない」の radio に落とす。
           値を書ける欄を一切作らないための強制である。 */
        if (o.secret) {
            o.type = 'radio';
            o.options = SECRET_CHOICES.slice();
            o.noSkip = true;
        }
        if ((o.type === 'radio' || o.type === 'check') && !o.noSkip) {
            EXTRA_CHOICES.forEach(function (c) {
                if (o.options.indexOf(c) < 0) o.options.push(c);
            });
        }
        return o;
    }

    var ITEMS = FORM_ITEMS.map(normalize);

    (function () {
        var seen = {}, dup = [];
        ITEMS.forEach(function (it) {
            if (seen[it.id]) dup.push(it.id);
            seen[it.id] = true;
        });
        if (dup.length) alert('項目定義に重複した id があります: ' + dup.join(', '));
    })();

    /* ------------------------------------------------------------------ */
    /* 未記入の判定                                                        */
    /* ------------------------------------------------------------------ */

    function ans(id) {
        if (!answers[id]) answers[id] = { choice: '', checks: [], text: '', done: false, memo: '' };
        return answers[id];
    }

    function isBlank(it) {
        if (it.optional) return false;
        var a = ans(it.id);
        switch (it.type) {
            case 'radio': return !a.choice;
            case 'check': return !(a.checks && a.checks.length);
            case 'shot':  return !a.done;
            default:      return !String(a.text || '').trim();
        }
    }

    function blankItems() { return ITEMS.filter(isBlank); }

    /* ------------------------------------------------------------------ */
    /* 描画（🔴 並び順は FORM_ITEMS のとおり。節でまとめ直さない）          */
    /* ------------------------------------------------------------------ */

    function el(tag, cls, text) {
        var e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text !== undefined) e.textContent = text;
        return e;
    }

    function render() {
        document.getElementById('hTitle').textContent = '回答フォーム ─ ' + FORM_META.work;
        document.getElementById('hMeta').textContent =
            'フォーム ' + FORM_ENGINE_VERSION + ' / 項目定義 ' + FORM_META.defVersion
            + ' / 基点: ' + FORM_META.base;
        document.getElementById('hNote').textContent = (FORM_META.note || '')
            + ' 入力は自動で保存されます。埋め終わったら「📋 報告書用にコピー」を押してください。';

        var host = document.getElementById('form');
        host.innerHTML = '';
        ITEMS.forEach(function (it) { host.appendChild(renderItem(it)); });

        /* 🔴 自由記入欄は必ず末尾に置く。
           用紙の枠に収まらない観察が捨てられるのが様式化の最大の危険である。 */
        var box = el('div', 'item');
        box.id = 'item_FREE';
        var h = el('div');
        h.appendChild(el('span', 'id', '自由'));
        h.appendChild(el('span', 'label', '枠に収まらなかった観察・気づいたこと・疑問'));
        box.appendChild(h);
        box.appendChild(el('p', 'help',
            '空でも構いません。「おかしいと思ったが項目が無かった」ことがあれば書いてください。'));
        var ta = el('textarea', 'paste');
        ta.style.height = '180px';
        ta.style.maxHeight = '180px';
        ta.style.whiteSpace = 'pre-wrap';
        ta.value = freeText;
        ta.addEventListener('input', function () { freeText = ta.value; save(); });
        box.appendChild(ta);
        host.appendChild(box);

        updateBlank();
    }

    function renderItem(it) {
        var wrap = el('div', 'item');
        wrap.id = 'item_' + it.id;
        wrap.setAttribute('data-type', it.type);

        var head = el('div');
        head.appendChild(el('span', 'id', it.id));
        head.appendChild(el('span', 'label', it.label));
        wrap.appendChild(head);

        if (it.help) wrap.appendChild(el('p', 'help', it.help));
        if (it.secret) {
            wrap.appendChild(el('p', 'secret-warn',
                '🔴 認証情報の項目です。値を書く欄はありません。'));
        }

        var a = ans(it.id);

        if (it.type === 'radio' || it.type === 'check') {
            var choices = el('div', 'choices');
            var gname = 'g_' + it.id;
            it.options.forEach(function (opt, i) {
                var l = el('label', 'choice');
                var inp = document.createElement('input');
                inp.type = (it.type === 'radio') ? 'radio' : 'checkbox';
                inp.name = gname; inp.value = opt; inp.id = gname + '_' + i;
                inp.checked = (it.type === 'radio')
                    ? (a.choice === opt) : (a.checks.indexOf(opt) >= 0);
                inp.addEventListener('change', function () {
                    if (it.type === 'radio') {
                        a.choice = inp.checked ? opt : '';
                    } else {
                        var k = a.checks.indexOf(opt);
                        if (inp.checked && k < 0) a.checks.push(opt);
                        if (!inp.checked && k >= 0) a.checks.splice(k, 1);
                    }
                    save(); updateBlank();
                });
                l.appendChild(inp);
                l.appendChild(document.createTextNode(' ' + opt));
                choices.appendChild(l);
            });
            wrap.appendChild(choices);

        } else if (it.type === 'text') {
            var inp2 = document.createElement('input');
            inp2.type = 'text';
            inp2.value = a.text || '';
            inp2.addEventListener('input', function () { a.text = inp2.value; save(); updateBlank(); });
            wrap.appendChild(inp2);

        } else if (it.type === 'paste' || it.type === 'suite') {
            var ta2 = el('textarea', 'paste');
            ta2.placeholder = (it.type === 'suite')
                ? '「📋 報告書用にコピー」の出力を、そのまま貼り付けてください。'
                : '長文をそのまま貼り付けてください（欄の高さは固定です）。';
            ta2.value = a.text || '';
            var len = el('p', 'len', '');
            var upd = function () {
                len.textContent = String(ta2.value.length).replace(/\B(?=(\d{3})+(?!\d))/g, ',') + ' 文字';
            };
            ta2.addEventListener('input', function () { a.text = ta2.value; upd(); save(); updateBlank(); });
            upd();
            wrap.appendChild(ta2);
            wrap.appendChild(len);

        } else if (it.type === 'shot') {
            /* 🔴 フォームは画像を一切扱わない。ファイル名の日時で対応づける。 */
            wrap.appendChild(el('p', 'shot-warn',
                '⚠️ Cookie の値・トークン・パスワードが写らない撮り方をしてください。'));
            var l3 = el('label', 'choice');
            var chk = document.createElement('input');
            chk.type = 'checkbox';
            chk.checked = !!a.done;
            chk.addEventListener('change', function () { a.done = chk.checked; save(); updateBlank(); });
            l3.appendChild(chk);
            l3.appendChild(document.createTextNode(' スクリーンショットを提出した'));
            wrap.appendChild(l3);

            var memo = document.createElement('input');
            memo.type = 'text';
            memo.placeholder = '補足があれば1行（省略可）';
            memo.value = a.memo || '';
            memo.addEventListener('input', function () { a.memo = memo.value; save(); });
            wrap.appendChild(memo);
        }

        return wrap;
    }

    function updateBlank() {
        var blanks = blankItems();
        ITEMS.forEach(function (it) {
            var e = document.getElementById('item_' + it.id);
            if (!e) return;
            if (isBlank(it)) e.classList.add('blank'); else e.classList.remove('blank');
        });
        var c = document.getElementById('blankCount');
        c.textContent = '未記入 ' + blanks.length + '件 / 全' + ITEMS.length + '項目';
        c.className = blanks.length ? 'ng' : 'ok';
    }

    /* ------------------------------------------------------------------ */
    /* 🔴 自己診断 ─ 機械で観測できることを自動で集める                    */
    /*    人に「確認してください」と聞かない。出力時に勝手に走る。          */
    /* ------------------------------------------------------------------ */

    function chk(list, name, actual, expected) {
        var ok = String(actual) === String(expected);
        list.push({ name: name, actual: String(actual), expected: String(expected), ok: ok });
    }

    function runSelfCheck(bodyText) {
        var r = [];

        /* 1. 定義から描画できているか */
        var rendered = document.querySelectorAll('#form .item[data-type]').length;
        chk(r, '項目定義の数だけ描画されている', rendered, ITEMS.length);

        /* 2. 宣言した種別ごとに、想定した入力要素が出ているか */
        var typeNg = [];
        ITEMS.forEach(function (it) {
            var e = document.getElementById('item_' + it.id);
            if (!e) { typeNg.push(it.id + ':描画なし'); return; }
            var ok;
            if (it.type === 'radio') ok = e.querySelectorAll('input[type=radio]').length >= 2;
            else if (it.type === 'check') ok = e.querySelectorAll('input[type=checkbox]').length >= 2;
            else if (it.type === 'text') ok = !!e.querySelector('input[type=text]');
            else if (it.type === 'paste' || it.type === 'suite') ok = !!e.querySelector('textarea.paste');
            else if (it.type === 'shot') ok = !!e.querySelector('input[type=checkbox]')
                && e.querySelectorAll('textarea').length === 0;
            else ok = false;
            if (!ok) typeNg.push(it.id + ':' + it.type);
        });
        chk(r, '宣言した種別どおりの入力欄が出ている',
            typeNg.length ? typeNg.join(' / ') : 'すべて一致', 'すべて一致');

        /* 3. 画像を扱う要素が無いこと */
        var imgish = document.querySelectorAll('#form input[type=file], #form img, #form canvas').length;
        chk(r, 'フォームに画像を扱う要素が無い', imgish, 0);

        /* 4. secret の強制（純関数で確認する。画面に secret 項目が無くても測れる） */
        var s = normalize({ id: 'X', type: 'paste', secret: true, label: 'x' });
        chk(r, 'secret 指定は「ある / ない」の radio に強制される',
            s.type + ':' + s.options.join(','), 'radio:ある,ない');

        /* 5. 選択肢の自動追加 */
        var n = normalize({ id: 'Y', type: 'radio', label: 'y', options: ['A'] });
        chk(r, '選択肢に「未実施」「測れなかった」が自動で足される',
            n.options.join(','), 'A,未実施,測れなかった（理由は自由記入へ）');

        /* 6. 長文で高さが変わらないこと（実際に1万文字を入れて測る） */
        var scratch = document.getElementById('scratch');
        var probe = document.createElement('textarea');
        probe.className = 'paste';
        scratch.appendChild(probe);
        var h0 = probe.offsetHeight;
        probe.value = new Array(10001).join('あ');
        var h1 = probe.offsetHeight;
        scratch.removeChild(probe);
        chk(r, '1万文字を入れても貼り付け欄の高さが変わらない', h1 + 'px', h0 + 'px');

        var maxH = 0, maxLen = 0;
        Array.prototype.forEach.call(document.querySelectorAll('#form textarea.paste'), function (t) {
            if (t.offsetHeight > maxH) maxH = t.offsetHeight;
            if (t.value.length > maxLen) maxLen = t.value.length;
        });
        r.push({ name: '画面上の貼り付け欄の最大の高さ / 最大の文字数',
                 actual: maxH + 'px / ' + maxLen + '文字', expected: '（参考値）', ok: null });
        r.push({ name: '横スクロールの有無（scrollWidth / clientWidth）',
                 actual: document.documentElement.scrollWidth + ' / '
                     + document.documentElement.clientWidth,
                 expected: '（参考値）', ok: null });

        /* 7. 未記入の検出と赤枠の一致 */
        var blanks = blankItems().length;
        var painted = document.querySelectorAll('#form .item.blank').length;
        chk(r, '未記入の件数と赤枠の数が一致する', painted, blanks);
        chk(r, '上部の件数表示が実際の未記入と一致する',
            document.getElementById('blankCount').textContent,
            '未記入 ' + blanks + '件 / 全' + ITEMS.length + '項目');

        /* 8. 下書きの往復 */
        var round = 'NG';
        try {
            var k = LS_KEY + ':probe';
            localStorage.setItem(k, 'ok');
            round = (localStorage.getItem(k) === 'ok') ? 'OK' : 'NG';
            localStorage.removeItem(k);
        } catch (e) { round = 'NG(' + (e && e.message) + ')'; }
        chk(r, '下書きの保存と読み直しができる', round, 'OK');
        r.push({ name: '下書きを復元して開いた記録',
                 actual: restoredAt || '（この画面では復元していない）',
                 expected: '（参考値）', ok: null });

        /* 9. 出力の構成（自分自身を参照しないよう、組み立て済みの本文を調べる） */
        chk(r, '出力に「テスト結果」の節がある', bodyText.indexOf('## 2. テスト結果') >= 0, true);
        chk(r, '出力の並びが項目定義の順と一致する', orderOk(bodyText), true);
        chk(r, '未記入は「（未記入）」と書かれる',
            blanks === 0 ? true : (bodyText.indexOf('（未記入）') >= 0), true);

        return r;
    }

    function orderOk(bodyText) {
        var pos = -1;
        for (var i = 0; i < ITEMS.length; i++) {
            var p = bodyText.indexOf('### ' + ITEMS[i].id + ' ');
            if (p < 0 || p < pos) return false;
            pos = p;
        }
        return true;
    }

    /* ------------------------------------------------------------------ */
    /* 下書き                                                              */
    /* ------------------------------------------------------------------ */

    function draftKey() { return LS_KEY + ':' + FORM_META.defVersion; }

    var saveTimer = null;
    function save() {
        if (saveTimer) clearTimeout(saveTimer);
        saveTimer = setTimeout(function () {
            try {
                localStorage.setItem(draftKey(), JSON.stringify({
                    engine: FORM_ENGINE_VERSION, def: FORM_META.defVersion,
                    at: new Date().toISOString(), answers: answers, freeText: freeText
                }));
                setStatus('下書き保存 ' + new Date().toLocaleTimeString());
            } catch (e) { setStatus('下書きの保存に失敗: ' + (e && e.message)); }
        }, 250);
    }

    function load() {
        var raw = null;
        try { raw = localStorage.getItem(draftKey()); } catch (e) { return; }
        if (!raw) return;
        var d = null;
        try { d = JSON.parse(raw); } catch (e) { return; }
        if (!d) return;
        answers = d.answers || {};
        freeText = String(d.freeText || '');
        restoredAt = String(d.at || '不明');
        setStatus('下書きを復元しました（' + restoredAt + '）');
    }

    function setStatus(s) { document.getElementById('status').textContent = s; }

    /* ------------------------------------------------------------------ */
    /* 出力                                                                */
    /* ------------------------------------------------------------------ */

    function valueText(it) {
        var a = ans(it.id);
        if (isBlank(it)) return '（未記入）';
        switch (it.type) {
            case 'radio': return a.choice;
            case 'check': return a.checks.join(' / ');
            case 'shot':  return 'スクショ提出済み（ファイル名の日時で対応）'
                + (a.memo ? ' ─ ' + a.memo : '');
            default: return a.text;
        }
    }

    function isLong(it) { return it.type === 'paste' || it.type === 'suite'; }

    /* 🔴 節2（テスト結果）を先に組み立てる。自己診断はこの本文を見て判定する。 */
    function buildBody() {
        var L = [];
        L.push('## 2. テスト結果（手順書の番号順）');
        L.push('');
        ITEMS.forEach(function (it) {
            L.push('### ' + it.id + ' ' + it.label);
            L.push('');
            if (isLong(it)) {
                if (isBlank(it)) {
                    L.push('（未記入）');
                } else {
                    /* 🔴 貼り付けた本文が ``` を含む（debug_suite の出力は ```json を持つ）。
                       囲みは本文中の最長の連続バッククォートより1つ長くする。 */
                    L.push(fence(ans(it.id).text));
                    L.push(ans(it.id).text);
                    L.push(fence(ans(it.id).text));
                }
            } else {
                L.push(valueText(it));
            }
            L.push('');
        });
        return L.join('\n');
    }

    function buildMarkdown() {
        var body = buildBody();
        var diag = runSelfCheck(body);
        var blanks = blankItems();

        var L = [];
        L.push('# 回答フォーム出力 ─ ' + FORM_META.work);
        L.push('');
        L.push('- フォーム: `' + FORM_ENGINE_VERSION + '` / 項目定義: `' + FORM_META.defVersion + '`');
        L.push('- 基点コード: ' + FORM_META.base);
        L.push('- 提出日時: ' + new Date().toISOString());
        L.push('- 画面: ' + window.innerWidth + ' x ' + window.innerHeight);
        L.push('- **未記入: ' + blanks.length + '件**'
            + (blanks.length ? '（' + blanks.map(function (b) { return b.id; }).join(', ') + '）' : ''));
        L.push('');
        L.push('## 1. フォームの自己診断（自動収集・人の入力なし）');
        L.push('');
        L.push('| 確認項目 | 実測 | 期待 | 判定 |');
        L.push('| :--- | :--- | :--- | :--: |');
        diag.forEach(function (d) {
            L.push('| ' + md(d.name) + ' | ' + md(d.actual) + ' | ' + md(d.expected) + ' | '
                + (d.ok === null ? '─' : (d.ok ? '⚪' : '❌')) + ' |');
        });
        L.push('');
        L.push(body);
        L.push('## 3. 自由記入（枠に収まらなかった観察）');
        L.push('');
        L.push(String(freeText).trim() ? String(freeText).trim() : '（記入なし）');
        L.push('');
        return L.join('\n');
    }

    function fence(text) {
        var m = String(text).match(/`{3,}/g) || [];
        var max = 2;
        m.forEach(function (x) { if (x.length > max) max = x.length; });
        return new Array(max + 2).join('`');
    }

    function md(s) { return String(s).replace(/\|/g, '\\|').replace(/\n/g, ' '); }

    /* 🔴 未記入があるときに黙って出さない。 */
    function confirmBlanks() {
        var blanks = blankItems();
        if (!blanks.length) return true;
        return window.confirm(
            '未記入が ' + blanks.length + '件あります。\n\n'
            + blanks.map(function (b) { return '  ' + b.id + '  ' + b.label; }).join('\n')
            + '\n\n出力には「（未記入）」と書かれます。\n'
            + '実施していないものは、その欄に「未実施」と書くか、選択肢の「未実施」を選んでください。\n\n'
            + 'このまま出力しますか？');
    }

    function copyText(text) {
        var done = function (ok) {
            setStatus(ok ? 'クリップボードへコピーしました。' : 'コピーに失敗しました。');
            if (!ok) alert('コピーに失敗しました。「⬇ .md を保存」を使ってください。');
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(function () { done(true); },
                function () { done(fallbackCopy(text)); });
        } else { done(fallbackCopy(text)); }
    }

    /* display:none にすると選択できずコピーに失敗する。画面外へ逃がす。 */
    function fallbackCopy(text) {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed'; ta.style.left = '-9999px'; ta.style.top = '0';
        document.body.appendChild(ta);
        ta.focus(); ta.select();
        var ok = false;
        try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
        document.body.removeChild(ta);
        return ok;
    }

    function download(text) {
        var blob = new Blob([text], { type: 'text/markdown;charset=utf-8' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'answer_' + FORM_META.defVersion + '_'
            + new Date().toISOString().replace(/[:.]/g, '-') + '.md';
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
        setStatus('.md を保存しました。');
    }

    /* ------------------------------------------------------------------ */

    document.getElementById('btnCopy').addEventListener('click', function () {
        if (!confirmBlanks()) return;
        copyText(buildMarkdown());
    });
    document.getElementById('btnDownload').addEventListener('click', function () {
        if (!confirmBlanks()) return;
        download(buildMarkdown());
    });
    document.getElementById('btnClear').addEventListener('click', function () {
        if (!window.confirm('下書きを消して、すべての回答を空にします。よろしいですか？')) return;
        try { localStorage.removeItem(draftKey()); } catch (e) { }
        answers = {}; freeText = ''; restoredAt = '';
        render();
        setStatus('下書きを消しました。');
    });

    load();
    var had = Object.keys(answers).length > 0 || !!freeText;
    render();
    if (!had) setStatus('フォーム ' + FORM_ENGINE_VERSION + ' / 項目定義 ' + FORM_META.defVersion);
})();
</script>
</body>
</html>
