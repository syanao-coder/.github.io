<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>統合テスト用紙 ─ v2.8.12</title>
<!--
  統合テスト用紙（エンジン v3.0.0）
  🔴 ローカル専用。controller.html とは別のポートに置くこと
     （同一オリジンだと本体の「全設定・保存URLをリセット」で下書きが巻き添えで消える）。
  使い方: FORM_META と STEPS を差し替えるだけ。骨組み（CSS・描画・自己診断・
  コピー・下書き保存・3つの照合）は毎回そのまま。
-->
<script>
/* ============================================================
   ここから下が「この回の中身」。骨組みは触らない。
   ============================================================ */
var FORM_META = {
    defVersion: '2026-10-02.v2812r',
    work: 'v2.8.12 再測 ─ 畳んだときの残骸と、上端で出ない件',
    base: 'index.html v2.8.12 / manifest.json 2.8.7（入れ直さない）/ debug_suite.js v1.14.1',
    expectApp: '2.8.12',
    expectSuite: '1.14.1',
    note: '🔴 アドオンは入れ直さないでください。判定はすべて自動で出ます。'
};

var IDS_ALL = ['D-X1', 'D-X2', 'D-V1', 'D-V2', 'D-U1', 'D-U2', 'D-A1', 'D-A2', 'D-H1', 'D-H2', 'D-H3', 'D-H4', 'D-H5',
    'D-N1', 'D-N2', 'D-N3', 'D-N4', 'D-N5', 'D-N6', 'D-R1', 'D-M2', 'D-M7', 'D-E1'];

var STEPS = [

{ sec: '1. 準備', html:
    '前回の目視の2件を直しました。<br>'
    + '① 畳んだとき上端に残っていたのは、閉じた設定パネルの下端でした（ふだんは上部メニューの裏に隠れていた）。閉じたパネルを画面の外まで逃がしました。<br>'
    + '② 上端に寄せても出ないのは、マウスを速く上へ動かすと上端の帯で検知できずにブラウザのツールバーへ抜けていたためです。帯を広げ、ページの上から外へ抜けたときも出すようにしました。' },

{ ttl: 'T1. 開く',
  rows: [
    ['<code>https://syanao-coder.github.io/?debug=1</code> を開き、<b>Ctrl+Shift+R</b> で読み込み直す', '新しいファイルを読ませる']
  ],
  ans: [ { id: 'T1', type: 'check', label: '開いて読み込み直した' } ] },

{ sec: '2. 自動測定', html: '「▶ すべて実行」は前回すべて合格したので今回は不要です。' },

{ ttl: 'R2. 🎯 この版の回帰（D-T1 → D-T2 → D-Y1 → D-Y12 → D-S1）',
  rows: [
    ['🐞 パネルの <b>🗑 ログを消す</b> を押す', '前回の記録を消す'],
    ['<b>🎯 この版の回帰（v2.8.12: D-T1 → D-T2 → D-Y1 → D-Y12 → D-S1）</b> を押す', 'D-T1 は上部メニューを畳んで出し入れし、最後に元へ戻す'],
    ['ログに <code>D-T1</code> の開始行が出ることを確認する', '🔴 押し忘れを防ぐ'],
    ['🔴 測定中はマウスを動かさない', 'D-T1 は合成のマウス移動で上端に寄せる。本物のマウスが混ざると出し入れがずれる'],
    ['終了表示が出たら <b>📋 報告書用にコピー</b> を押し、下の欄へ貼り付ける', '']
  ],
  ans: [
    { id: 'R2a', type: 'check', label: '押したあと、ログに D-T1 の開始行が出た' },
    { id: 'R2', type: 'suite', label: '📋 報告書用にコピー の中身をここへ貼り付けてください', expectIds: ['D-T1', 'D-T2', 'D-Y1', 'D-Y12', 'D-S1'] }
  ] },

{ sec: '3. 目視（本物のマウスで）', html: '🐞 パネルを閉じてから行ってください。' },

{ ttl: 'R3. 畳む・出す・戻す',
  rows: [
    ['上部メニューの右端の <b>▲</b> を押す', 'メニューが上へ隠れ、枠が上へ広がる。上端の中央に「▼ メニュー」が出るはず'],
    ['マウスを画面の<b>上端</b>へ寄せる', 'メニューが枠の上に重なって出る。🔴 枠の大きさは変わらないはず'],
    ['マウスを下へ離す', '約1秒で隠れるはず'],
    ['もう一度上端に寄せて <b>💬 コメント設定</b> を開き、パネルを開いたままマウスを下へ離す', '🔴 パネルを開いている間は隠れないはず'],
    ['💬 を押して閉じ、マウスを下へ離す', '隠れるはず'],
    ['上端に寄せて、右端の <b>📌</b> を押す', '元の固定表示に戻り、枠が元の大きさに戻るはず']
  ],
  ans: [
    { id: 'R3', type: 'radio', label: '▲ で畳んだとき',
      options: ['隠れて枠が広がった', '隠れなかった・枠が広がらなかった'] },
    { id: 'R3b', type: 'radio', label: '上端に寄せたとき',
      options: ['枠の上に重なって出た（枠は動かない）', '出たが枠が伸び縮みした', '出なかった'] },
    { id: 'R3c', type: 'radio', label: 'パネルを開いたまま離れたとき',
      options: ['隠れなかった', '隠れてしまった'] },
    { id: 'R3d', type: 'radio', label: '📌',
      options: ['固定表示に戻った', '戻らなかった'] },
    { id: 'R3e', type: 'radio', label: '上部メニューの大きさ（縮小後）',
      options: ['ちょうどよい', 'まだ大きい', '小さすぎる'] }
  ] },

{ ans: { id: 'FREE', type: 'text', label: '自由記入（無ければ「なし」）' } }

];
/* ============================================================
   ここまでが「この回の中身」。
   ============================================================ */
</script>

<style>
:root { --bg:#14141a; --fg:#e6e6ea; --line:#2e2e3a; --acc:#00ffcc; --ng:#ff5a5a; --warn:#ffb020; }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font-family: "Segoe UI", Meiryo, sans-serif;
       font-size:14px; line-height:1.7; }
header { position:sticky; top:0; z-index:5; background:#1b1b24; border-bottom:1px solid var(--line);
         padding:10px 16px; }
header h1 { margin:0 0 4px; font-size:1.05rem; color:var(--acc); }
.meta { font-size:.78rem; color:#9a9aa8; }
.hstat { margin-top:6px; font-size:.82rem; }
.hstat b { color:var(--warn); }
main { max-width:1000px; margin:0 auto; padding:16px; }
.sec { margin:26px 0 10px; padding:10px 12px; border-left:4px solid var(--acc); background:#1a1a23; }
.sec h2 { margin:0 0 4px; font-size:.98rem; color:var(--acc); }
.sec p { margin:0; font-size:.86rem; color:#b9b9c6; }
.item { border:1px solid var(--line); border-radius:6px; margin:14px 0; background:#171720; }
.item > h3 { margin:0; padding:8px 12px; font-size:.92rem; background:#20202b;
             border-bottom:1px solid var(--line); border-radius:6px 6px 0 0; }
.body { padding:10px 12px; }
table.steps { width:100%; border-collapse:collapse; margin-bottom:8px; font-size:.86rem; }
table.steps th, table.steps td { border:1px solid var(--line); padding:5px 8px; vertical-align:top; }
table.steps th { background:#20202b; color:#b9b9c6; font-weight:normal; text-align:left; }
table.steps td:first-child { width:58%; }
table.steps td:last-child { color:#9a9aa8; }
.note { font-size:.82rem; color:var(--warn); margin:6px 0 8px; }
.ans { border-top:1px dashed var(--line); margin-top:10px; padding-top:8px; }
.ans .lbl { font-size:.86rem; color:#cfcfda; margin-bottom:4px; }
.ans .lbl .aid { color:var(--acc); font-weight:bold; margin-right:6px; }
label.opt { display:block; padding:2px 0; font-size:.86rem; cursor:pointer; }
input[type=radio], input[type=checkbox] { margin-right:6px; }
textarea { width:100%; background:#0f0f15; color:var(--fg); border:1px solid var(--line);
           border-radius:4px; padding:6px 8px; font-family: Consolas, monospace; font-size:.8rem; }
textarea.paste { height:180px; max-height:180px; resize:none; overflow:auto; white-space:pre; }
textarea.free { height:90px; max-height:90px; resize:none; }
input[type=text] { width:100%; background:#0f0f15; color:var(--fg); border:1px solid var(--line);
                   border-radius:4px; padding:5px 8px; font-size:.86rem; }
.blank { border-color:var(--ng) !important; box-shadow:0 0 0 1px var(--ng) inset; }
.chkbox { border:1px solid transparent; border-radius:4px; padding:2px 4px; }
.verify { margin-top:6px; font-size:.82rem; border-radius:4px; padding:6px 8px; }
.verify.ok { background:rgba(0,255,204,.08); color:#8ff3df; }
.verify.ng { background:rgba(255,90,90,.12); color:#ffb3b3; }
.verify.warn { background:rgba(255,176,32,.12); color:#ffd98f; }
.bar { position:sticky; bottom:0; background:#1b1b24; border-top:1px solid var(--line);
       padding:10px 16px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
button { background:#20202b; color:var(--fg); border:1px solid var(--line); border-radius:4px;
         padding:6px 12px; cursor:pointer; font-size:.86rem; }
button.primary { background:var(--acc); color:#000; font-weight:bold; border-color:var(--acc); }
#status { font-size:.82rem; color:#9a9aa8; }
code { background:#0f0f15; padding:1px 4px; border-radius:3px; font-size:.82rem; }
</style>
</head>
<body>
<header>
  <h1 id="hTitle">統合テスト用紙</h1>
  <div class="meta" id="hMeta"></div>
  <div class="meta" id="hNote"></div>
  <div class="hstat" id="hStat"></div>
</header>
<main id="form"></main>
<div class="bar">
  <button class="primary" id="btnCopy">📋 報告書用にコピー</button>
  <button id="btnDl">⬇ .md で保存</button>
  <button id="btnClear">🗑 下書きを消す</button>
  <span id="status"></span>
</div>

<script>
(function () {
    'use strict';

    var FORM_ENGINE_VERSION = '3.0.0';
    var LS_KEY = 'test_form_draft';
    var EXTRA_CHOICES = ['該当なし', '測れなかった（理由は自由記入へ）', '未実施'];
    var RUNAT_MAX_H = 24;          /* 照合③のしきい値（時間） */

    /* ---------------------------------------------------------------
       項目の正規化
       --------------------------------------------------------------- */
    function normalize(a) {
        var it = {
            id: a.id, type: a.type || 'text', label: a.label || '',
            options: a.options ? a.options.slice() : null,
            expectIds: a.expectIds ? a.expectIds.slice() : null,
            secret: !!a.secret, optional: !!a.optional
        };
        /* 🔴 認証情報は「ある / ない」の radio に強制する。値の入力欄を作らない。 */
        if (it.secret) { it.type = 'radio'; it.options = ['ある', 'ない']; }
        if (it.type === 'radio') {
            it.options = it.options || [];
            EXTRA_CHOICES.forEach(function (c) {
                if (it.options.indexOf(c) < 0) it.options.push(c);
            });
        }
        return it;
    }

    /* STEPS を「描画順の並び」と「回答項目の並び」に分ける。 */
    var ITEMS = [];
    var BLOCKS = [];
    (function build() {
        STEPS.forEach(function (s, i) {
            if (s.sec) { BLOCKS.push({ kind: 'sec', sec: s.sec, html: s.html || '' }); return; }
            var list = [];
            if (s.ans) list = (Object.prototype.toString.call(s.ans) === '[object Array]') ? s.ans : [s.ans];
            var norm = list.map(normalize);
            norm.forEach(function (n) { ITEMS.push(n); });
            BLOCKS.push({ kind: s.ttl ? 'step' : 'ansonly', ttl: s.ttl || '', rows: s.rows || [],
                          note: s.note || '', items: norm, idx: i });
        });
        var seen = {};
        ITEMS.forEach(function (it) {
            if (!it.id) throw new Error('id の無い回答欄があります');
            if (seen[it.id]) throw new Error('id が重複しています: ' + it.id);
            seen[it.id] = 1;
        });
    })();

    var answers = {};
    ITEMS.forEach(function (it) { answers[it.id] = { choice: '', text: '', done: false }; });

    function ans(id) { return answers[id]; }
    function isBlank(it) {
        if (it.optional) return false;
        var a = ans(it.id);
        if (it.type === 'radio') return !a.choice;
        if (it.type === 'check') return !a.done;
        return !(a.text && a.text.trim());
    }
    function blankItems() { return ITEMS.filter(isBlank); }

    /* ---------------------------------------------------------------
       3つの照合（/get-debug-suite 9-3節）
       --------------------------------------------------------------- */
    /* 🔴 テストIDは出力の一覧表の行頭から取る。ログの文言からは拾わない。 */
    function extractIds(text) {
        var out = [], re = /^\|\s*(D-[A-Z]+\d+)\b/gm, m;
        while ((m = re.exec(text || ''))) { if (out.indexOf(m[1]) < 0) out.push(m[1]); }
        return out;
    }
    function extractVersions(text) {
        var t = text || '';
        var d = /debug_suite:\s*`([^`]*)`/.exec(t);
        var a = /APP_VERSION:\s*`([^`]*)`/.exec(t);
        var b = /版数バッジ:\s*`([^`]*)`/.exec(t);
        return { suite: d ? d[1] : null, app: a ? a[1] : null, badge: b ? b[1] : null };
    }
    function extractRunAt(text) {
        var m = /実行日時:\s*([0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z)/.exec(text || '');
        return m ? m[1] : null;
    }
    /* 戻り値: { level:'ok'|'warn'|'ng', msg:'...' } の配列 */
    function verifyPaste(it, text) {
        var out = [];
        if (!text || !text.trim()) return out;

        /* 照合① 要求したテストIDが揃っているか */
        if (it.expectIds) {
            var got = extractIds(text);
            var miss = it.expectIds.filter(function (x) { return got.indexOf(x) < 0; });
            var extra = got.filter(function (x) { return it.expectIds.indexOf(x) < 0; });
            if (got.length === 0) {
                out.push({ level: 'ng', msg: '照合① テストIDを1つも読み取れません。'
                    + '「📋 報告書用にコピー」の中身をそのまま貼っているか確認してください。' });
            } else if (miss.length) {
                out.push({ level: 'ng', msg: '照合① 欠けているテストID: ' + miss.join(', ')
                    + '（ボタンの押し忘れ、または測定が途中で止まっています）' });
            } else {
                out.push({ level: 'ok', msg: '照合① 要求した ' + it.expectIds.length + '件のIDが揃っています。' });
            }
            if (extra.length) {
                out.push({ level: 'warn', msg: '照合① この回で要求していないIDも入っています: '
                    + extra.join(', ') + '（⚠️ 欠落ではありません。'
                    + '「🗑 ログを消す」を押さずに2回目を回すと前回の記録が残ります）' });
            }
        }
        /* 照合② 版数 */
        var v = extractVersions(text);
        if (v.suite === null && v.app === null) {
            out.push({ level: 'warn', msg: '照合② 版数の行を読み取れませんでした。' });
        } else {
            var bad = [];
            if (v.suite !== FORM_META.expectSuite) bad.push('debug_suite = ' + v.suite + '（期待 ' + FORM_META.expectSuite + '）');
            if (v.app !== FORM_META.expectApp) bad.push('APP_VERSION = ' + v.app + '（期待 ' + FORM_META.expectApp + '）');
            if (v.badge && /warn|ng|未検出|⇔|権限なし/.test(v.badge)) bad.push('版数バッジ = ' + v.badge);
            if (bad.length) out.push({ level: 'ng', msg: '照合② 版数が期待と違います: ' + bad.join(' / ') });
            else out.push({ level: 'ok', msg: '照合② 版数は期待どおりです（suite ' + v.suite + ' / app ' + v.app + '）。' });
        }
        /* 照合③ 実行日時 */
        var at = extractRunAt(text);
        if (!at) {
            out.push({ level: 'warn', msg: '照合③ 実行日時を読み取れませんでした。' });
        } else {
            var h = (Date.now() - new Date(at).getTime()) / 3600000;
            if (!isFinite(h)) out.push({ level: 'warn', msg: '照合③ 実行日時を解釈できません: ' + at });
            else if (h > RUNAT_MAX_H) out.push({ level: 'ng', msg: '照合③ 出力が古すぎます（'
                + h.toFixed(1) + '時間前）。前のラウンドの出力を貼っていませんか。' });
            else out.push({ level: 'ok', msg: '照合③ 実行日時は ' + h.toFixed(1) + '時間前です。' });
        }
        return out;
    }

    /* ---------------------------------------------------------------
       描画（🔴 画面の並び ＝ 手順の順 ＝ 出力の順。節でまとめ直さない）
       --------------------------------------------------------------- */
    function el(tag, cls, text) {
        var e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text !== undefined && text !== null) e.textContent = text;
        return e;
    }

    function render() {
        document.getElementById('hTitle').textContent = '統合テスト用紙 ─ ' + FORM_META.work;
        document.getElementById('hMeta').textContent =
            'エンジン ' + FORM_ENGINE_VERSION + ' / 項目定義 ' + FORM_META.defVersion
            + ' / 基点: ' + FORM_META.base
            + ' / 期待版数: app ' + FORM_META.expectApp + ' ・ suite ' + FORM_META.expectSuite;
        document.getElementById('hNote').textContent = FORM_META.note || '';
        var host = document.getElementById('form');
        host.textContent = '';
        BLOCKS.forEach(function (b) {
            if (b.kind === 'sec') {
                var s = el('div', 'sec');
                s.appendChild(el('h2', null, b.sec));
                var p = el('p'); p.innerHTML = b.html; s.appendChild(p);
                host.appendChild(s);
                return;
            }
            var box = el('div', 'item');
            if (b.ttl) box.appendChild(el('h3', null, b.ttl));
            var body = el('div', 'body');
            if (b.rows && b.rows.length) {
                var t = el('table', 'steps');
                var hr = document.createElement('tr');
                hr.appendChild(el('th', null, 'やること'));
                hr.appendChild(el('th', null, 'これで何をしたいか'));
                t.appendChild(hr);
                b.rows.forEach(function (r) {
                    var tr = document.createElement('tr');
                    var td1 = document.createElement('td'); td1.innerHTML = r[0];
                    var td2 = document.createElement('td'); td2.innerHTML = r[1] || '';
                    tr.appendChild(td1); tr.appendChild(td2); t.appendChild(tr);
                });
                body.appendChild(t);
            }
            if (b.note) body.appendChild(el('div', 'note', b.note));
            b.items.forEach(function (it) { body.appendChild(renderAns(it)); });
            box.appendChild(body);
            host.appendChild(box);
        });
        updateBlank();
    }

    function renderAns(it) {
        var wrap = el('div', 'ans');
        wrap.id = 'ans_' + it.id;
        var lbl = el('div', 'lbl');
        var aid = el('span', 'aid', it.id); lbl.appendChild(aid);
        lbl.appendChild(document.createTextNode(it.label));
        wrap.appendChild(lbl);
        var a = ans(it.id);

        if (it.type === 'radio') {
            it.options.forEach(function (opt, i) {
                var lab = el('label', 'opt');
                var inp = document.createElement('input');
                inp.type = 'radio'; inp.name = 'r_' + it.id; inp.value = opt;
                inp.addEventListener('change', function () { a.choice = opt; save(); updateBlank(); });
                lab.appendChild(inp);
                lab.appendChild(document.createTextNode(opt));
                wrap.appendChild(lab);
            });
        } else if (it.type === 'check') {
            var lab2 = el('label', 'opt');
            var chk = document.createElement('input');
            chk.type = 'checkbox'; chk.id = 'c_' + it.id;
            chk.addEventListener('change', function () { a.done = chk.checked; save(); updateBlank(); });
            lab2.appendChild(chk);
            lab2.appendChild(document.createTextNode(' 確認した'));
            wrap.appendChild(lab2);
        } else if (it.type === 'suite' || it.type === 'paste') {
            var ta = document.createElement('textarea');
            ta.className = 'paste'; ta.id = 't_' + it.id;
            ta.placeholder = 'ここへ貼り付けてください';
            var vbox = el('div');
            ta.addEventListener('input', function () {
                a.text = ta.value; save(); updateBlank(); drawVerify(it, vbox, ta.value);
            });
            wrap.appendChild(ta);
            wrap.appendChild(vbox);
        } else {
            var ta2 = document.createElement('textarea');
            ta2.className = 'free'; ta2.id = 't_' + it.id;
            ta2.addEventListener('input', function () { a.text = ta2.value; save(); updateBlank(); });
            wrap.appendChild(ta2);
        }
        return wrap;
    }

    function drawVerify(it, host, text) {
        host.textContent = '';
        verifyPaste(it, text).forEach(function (v) {
            host.appendChild(el('div', 'verify ' + v.level, v.msg));
        });
    }

    function updateBlank() {
        ITEMS.forEach(function (it) {
            var bad = isBlank(it);
            var w = document.getElementById('ans_' + it.id);
            if (!w) return;
            var f = w.querySelector('textarea') || w.querySelector('input[type=checkbox]');
            if (f) { if (bad) f.classList.add('blank'); else f.classList.remove('blank'); }
            if (it.type === 'radio') {
                if (bad) w.classList.add('blank'); else w.classList.remove('blank');
            }
        });
        var b = blankItems();
        document.getElementById('hStat').innerHTML = b.length
            ? ('未記入 <b>' + b.length + '件</b>（' + b.map(function (x) { return x.id; }).join(', ') + '）')
            : '未記入はありません。';
    }

    /* ---------------------------------------------------------------
       下書き（localStorage / 回が変われば混ざらない）
       --------------------------------------------------------------- */
    function draftKey() { return LS_KEY + ':' + FORM_META.defVersion; }
    var saveTimer = null;
    function save() {
        if (saveTimer) clearTimeout(saveTimer);
        saveTimer = setTimeout(function () {
            try {
                localStorage.setItem(draftKey(), JSON.stringify({
                    engine: FORM_ENGINE_VERSION, def: FORM_META.defVersion,
                    at: Date.now(), answers: answers
                }));
                setStatus('下書きを保存しました（' + new Date().toLocaleTimeString() + '）');
            } catch (e) { setStatus('⚠ 下書きを保存できません: ' + (e && e.message)); }
        }, 250);
    }
    function load() {
        var raw = null;
        try { raw = localStorage.getItem(draftKey()); } catch (e) { }
        if (!raw) return false;
        try {
            var o = JSON.parse(raw);
            if (!o || o.def !== FORM_META.defVersion) return false;
            Object.keys(o.answers || {}).forEach(function (k) {
                if (answers[k]) answers[k] = o.answers[k];
            });
            return true;
        } catch (e) { return false; }
    }
    function applyToDom() {
        ITEMS.forEach(function (it) {
            var a = ans(it.id);
            if (it.type === 'radio') {
                var list = document.getElementsByName('r_' + it.id);
                for (var i = 0; i < list.length; i++) list[i].checked = (list[i].value === a.choice);
            } else if (it.type === 'check') {
                var c = document.getElementById('c_' + it.id); if (c) c.checked = !!a.done;
            } else {
                var t = document.getElementById('t_' + it.id); if (t) t.value = a.text || '';
                if (it.type === 'suite' || it.type === 'paste') {
                    var w = document.getElementById('ans_' + it.id);
                    if (w) drawVerify(it, w.lastChild, a.text || '');
                }
            }
        });
        updateBlank();
    }
    function setStatus(s) { document.getElementById('status').textContent = s; }

    /* ---------------------------------------------------------------
       出力
       --------------------------------------------------------------- */
    function valueText(it) {
        var a = ans(it.id);
        if (it.type === 'radio') return a.choice || '（未記入）';
        if (it.type === 'check') return a.done ? '確認した' : '（未記入）';
        return (a.text && a.text.trim()) ? a.text : '（未記入）';
    }
    function isLong(it) { return it.type === 'suite' || it.type === 'paste'; }

    function fence(body) {
        var m = body.match(/`+/g) || [];
        var max = 0;
        m.forEach(function (s) { if (s.length > max) max = s.length; });
        var n = Math.max(3, max + 1), f = '';
        for (var i = 0; i < n; i++) f += '`';
        return f;
    }

    function buildBody() {
        var L = [];
        ITEMS.forEach(function (it) {
            L.push('### ' + it.id + ' ' + it.label);
            if (isLong(it)) {
                var v = valueText(it);
                var f = fence(v);
                L.push(f);
                L.push(v);
                L.push(f);
                verifyPaste(it, ans(it.id).text).forEach(function (x) {
                    L.push('- ' + (x.level === 'ok' ? '⚪ ' : (x.level === 'ng' ? '❌ ' : '⚠ ')) + x.msg);
                });
            } else {
                L.push(valueText(it));
            }
            L.push('');
        });
        return L.join('\n');
    }

    /* ---------------------------------------------------------------
       自己診断（🔴 本文を先に組み立ててから、その文字列を検査する）
       --------------------------------------------------------------- */
    function chk(list, name, actual, expected) {
        var ok = String(actual) === String(expected);
        list.push({ ok: ok, name: name, actual: String(actual), expected: String(expected) });
        return ok;
    }

    function runSelfCheck(bodyText) {
        var L = [];

        /* 項目数と種別 */
        chk(L, '描画された回答欄の数が定義と一致',
            document.querySelectorAll('#form .ans').length, ITEMS.length);
        var kinds = {};
        ITEMS.forEach(function (it) { kinds[it.type] = (kinds[it.type] || 0) + 1; });
        chk(L, 'suite 欄が1つ以上ある', (kinds.suite || 0) > 0, true);
        chk(L, 'radio 欄が1つ以上ある', (kinds.radio || 0) > 0, true);
        chk(L, 'check 欄が1つ以上ある', (kinds.check || 0) > 0, true);
        chk(L, 'text 欄が1つ以上ある', (kinds.text || 0) > 0, true);
        ITEMS.forEach(function (it) {
            if (!document.getElementById('ans_' + it.id)) {
                L.push({ ok: false, name: '描画されていない回答欄', actual: it.id, expected: '描画済み' });
            }
        });

        /* 🔴 画像を扱わないこと */
        chk(L, '画像・ファイル入力の要素が無い',
            document.querySelectorAll('img, canvas, svg, input[type=file]').length, 0);

        /* secret の強制（この回には secret 項目が無いので正規化関数で確かめる） */
        var s = normalize({ id: '__pc_secret__', type: 'text', secret: true });
        chk(L, 'PC: secret を付けると radio「ある / ない」に強制される',
            s.type + ':' + s.options.slice(0, 2).join('/'), 'radio:ある/ない');

        /* 選択肢の自動追加 */
        var okExtra = true;
        ITEMS.forEach(function (it) {
            if (it.type !== 'radio') return;
            EXTRA_CHOICES.forEach(function (c) { if (it.options.indexOf(c) < 0) okExtra = false; });
        });
        chk(L, 'すべての radio に「該当なし / 測れなかった / 未実施」が足されている', okExtra, true);

        /* 1万文字を入れても欄の高さが変わらない */
        (function () {
            var ta = document.querySelector('textarea.paste');
            if (!ta) { L.push({ ok: false, name: '貼り付け欄が見つからない', actual: 'なし', expected: 'あり' }); return; }
            var h0 = ta.offsetHeight, keep = ta.value, big = new Array(10001).join('x');
            ta.value = big;
            var h1 = ta.offsetHeight;
            ta.value = keep;
            chk(L, '1万文字を入れても貼り付け欄の高さが変わらない', h1, h0);
        })();

        /* 未記入と赤枠の一致 */
        (function () {
            var reds = 0;
            ITEMS.forEach(function (it) {
                var w = document.getElementById('ans_' + it.id);
                if (!w) return;
                var f = w.querySelector('textarea') || w.querySelector('input[type=checkbox]');
                if ((f && f.classList.contains('blank')) || w.classList.contains('blank')) reds++;
            });
            chk(L, '赤枠の数と未記入の数が一致', reds, blankItems().length);
        })();

        /* 「（未記入）」の表記 */
        chk(L, '未記入があるとき出力に「（未記入）」が入る',
            blankItems().length > 0 ? (bodyText.indexOf('（未記入）') >= 0) : true, true);

        /* 出力の並び順 ＝ 画面の並び順 */
        (function () {
            var pos = -1, ok = true;
            ITEMS.forEach(function (it) {
                var p = bodyText.indexOf('### ' + it.id + ' ');
                if (p < 0 || p < pos) ok = false;
                pos = p;
            });
            chk(L, '出力の並び順が画面の並び順と一致', ok, true);
        })();

        /* 下書きの往復 */
        (function () {
            var keep = JSON.stringify(answers);
            save();
            var raw = null;
            try {
                localStorage.setItem(draftKey(), JSON.stringify({
                    engine: FORM_ENGINE_VERSION, def: FORM_META.defVersion, at: Date.now(), answers: answers
                }));
                raw = localStorage.getItem(draftKey());
            } catch (e) { }
            var ok = false;
            try { ok = (JSON.stringify(JSON.parse(raw).answers) === keep); } catch (e) { }
            chk(L, '下書きの保存と読み出しが往復する', ok, true);
        })();

        /* 🔴 照合そのものの positive control（鉄則 #22） */
        (function () {
            var fake = '| D-Z9 にせもの | ⚪ | 1/1 | |\n- debug_suite: `0.0.0` / APP_VERSION: `0.0.0`\n'
                + '- 版数バッジ: `v0.0.0 / アドオン未検出`\n- 実行日時: 2000-01-01T00:00:00.000Z';
            var r = verifyPaste({ id: '__pc__', type: 'suite', expectIds: ['D-Y1'] }, fake);
            var txt = r.map(function (x) { return x.level + ':' + x.msg; }).join(' | ');
            chk(L, 'PC: 偽のIDを与えると照合①が「欠けている」と言う',
                /ng.*照合①/.test(txt), true);
            chk(L, 'PC: 偽の版数を与えると照合②が落ちる', /ng.*照合②/.test(txt), true);
            chk(L, 'PC: 古い日時を与えると照合③が落ちる', /ng.*照合③/.test(txt), true);
            chk(L, 'PC: 要求していないIDがあると照合①が警告する', /warn.*照合①/.test(txt), true);
            var good = '| D-Y1 ほんもの | ⚪ | 1/1 | |\n- debug_suite: `' + FORM_META.expectSuite
                + '` / APP_VERSION: `' + FORM_META.expectApp + '`\n- 版数バッジ: `v'
                + FORM_META.expectApp + '`\n- 実行日時: ' + new Date().toISOString();
            var r2 = verifyPaste({ id: '__pc2__', type: 'suite', expectIds: ['D-Y1'] }, good);
            var ng2 = r2.filter(function (x) { return x.level !== 'ok'; }).length;
            chk(L, 'PC: 正しい出力では3つの照合がすべて ⚪', ng2, 0);
        })();

        /* 各 suite 欄の照合結果 */
        ITEMS.forEach(function (it) {
            if (it.type !== 'suite') return;
            var r = verifyPaste(it, ans(it.id).text);
            var ng = r.filter(function (x) { return x.level === 'ng'; }).length;
            var wn = r.filter(function (x) { return x.level === 'warn'; }).length;
            L.push({ ok: ng === 0, name: '照合の結果（' + it.id + '）',
                actual: 'NG ' + ng + ' / 警告 ' + wn, expected: 'NG 0' });
        });

        return L;
    }

    function buildMarkdown() {
        var body = buildBody();
        var diag = runSelfCheck(body);
        var L = [];
        var blanks = blankItems();
        L.push('# 統合テスト用紙 出力 ─ ' + FORM_META.work);
        L.push('');
        L.push('## 0. この用紙について');
        L.push('');
        L.push('- エンジン: `' + FORM_ENGINE_VERSION + '` / 項目定義: `' + FORM_META.defVersion + '`');
        L.push('- 基点コード: ' + FORM_META.base);
        L.push('- 期待版数: app `' + FORM_META.expectApp + '` / suite `' + FORM_META.expectSuite + '`');
        L.push('- 提出日時: ' + new Date().toISOString());
        L.push('- 未記入: ' + blanks.length + '件'
            + (blanks.length ? '（' + blanks.map(function (b) { return b.id; }).join(', ') + '）' : ''));
        L.push('');
        L.push('### 用紙の自己診断');
        L.push('');
        L.push('| 検査 | 結果 | 実測 | 期待 |');
        L.push('| :--- | :--: | :--- | :--- |');
        diag.forEach(function (d) {
            L.push('| ' + d.name + ' | ' + (d.ok ? '⚪' : '❌') + ' | ' + d.actual + ' | ' + d.expected + ' |');
        });
        var ng = diag.filter(function (d) { return !d.ok; }).length;
        L.push('');
        L.push('❌ の件数: **' + ng + '**');
        L.push('');
        L.push('## 1. 回答');
        L.push('');
        L.push(body);
        return L.join('\n');
    }

    /* ---------------------------------------------------------------
       操作
       --------------------------------------------------------------- */
    function copyOut() {
        var md = buildMarkdown();
        var done = function () { setStatus('コピーしました（' + md.length + '文字）'); };
        var fail = function () {
            /* 退路: 画面外テキストエリア + execCommand。display:none にすると選択できず失敗する。 */
            var ta = document.createElement('textarea');
            ta.style.position = 'fixed'; ta.style.left = '-9999px'; ta.style.top = '0';
            ta.value = md; document.body.appendChild(ta); ta.select();
            var ok = false;
            try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
            document.body.removeChild(ta);
            setStatus(ok ? 'コピーしました（退路 / ' + md.length + '文字）'
                : '⚠ コピーできませんでした。「⬇ .md で保存」を使ってください。');
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(md).then(done, fail);
        } else { fail(); }
    }
    function download() {
        var md = buildMarkdown();
        var b = new Blob([md], { type: 'text/markdown;charset=utf-8' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(b);
        a.download = 'test_' + FORM_META.defVersion.replace(/[^0-9a-zA-Z.]/g, '_') + '.md';
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setStatus('.md を保存しました。');
    }

    render();
    var had = load();
    applyToDom();
    setStatus(had ? '前回の下書きを読み込みました。' : '新しい用紙です。');

    document.getElementById('btnCopy').addEventListener('click', copyOut);
    document.getElementById('btnDl').addEventListener('click', download);
    document.getElementById('btnClear').addEventListener('click', function () {
        if (!window.confirm('この回の下書きを消します。よろしいですか。')) return;
        try { localStorage.removeItem(draftKey()); } catch (e) { }
        ITEMS.forEach(function (it) { answers[it.id] = { choice: '', text: '', done: false }; });
        applyToDom();
        setStatus('下書きを消しました。');
    });
})();
</script>
