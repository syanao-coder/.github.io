{ sec: '1. 準備', html:

t.indexOf('{', from);\n        if (start &lt; 0) return null;\n        var depth = 0, inStr = false, esc = false;\n        for (var i = start; i &lt; text.length; i++) {\n            var c = text[i];\n            if (inStr) { if (esc) esc = false; else if (c === '\\\\') esc = true; else if (c === '\"') inStr = false; continue; }\n            if (c === '\"') inStr = true;\n            else if (c === '{') depth++;\n            else if (c === '}') { depth--; if (depth === 0) return text.slice(start, i + 1); }\n        }\n        return null;\n    }\n    function initialData(html) {\n        var marker = 'ytInitialData', idx = html.indexOf(marker);\n        while (idx &gt;= 0) {\n            var json = sliceBalancedJson(html, idx);\n            if (json) { try { var d = JSON.parse(json); if (d &amp;&amp; (d.contents || d.continuationContents)) return d; } catch (e) { } }\n            idx = html.indexOf(marker, idx + marker.length);\n        }\n        return null;\n    }\n    function cfg() {\n        var y = window.ytcfg &amp;&amp; window.ytcfg.get ? window.ytcfg : null;\n        var g = function (k) { try { return y ? y.get(k) : undefined; } catch (e) { return undefined; } };\n        return {\n            key: g('INNERTUBE_API_KEY'), ctx: g('INNERTUBE_CONTEXT'),\n            clientName: g('INNERTUBE_CONTEXT_CLIENT_NAME'), clientVersion: g('INNERTUBE_CONTEXT_CLIENT_VERSION'),\n            sessionIndex: g('SESSION_INDEX'), delegated: g('DELEGATED_SESSION_ID'), loggedIn: g('LOGGED_IN')\n        };\n    }\n    function pickAuthCookie() {\n        var parts = String(document.cookie || '').split(';');\n        for (var n = 0; n &lt; AUTH_COOKIE_NAMES.length; n++) {\n            for (var i = 0; i &lt; parts.length; i++) {\n                var p = parts[i], j = p.indexOf('=');\n                if (j &lt; 0 || p.slice(0, j).trim() !== AUTH_COOKIE_NAMES[n]) continue;\n                var v = p.slice(j + 1).trim();\n                if (v) return { name: AUTH_COOKIE_NAMES[n], value: v };\n            }\n        }\n        return null;\n    }\n    async function sha1Hex(text) {\n        var d = new Uint8Array(await crypto.subtle.digest('SHA-1', new TextEncoder().encode(text)));\n        var s = '';\n        for (var i = 0; i &lt; d.length; i++) s += (d[i] &lt; 16 ? '0' : '') + d[i].toString(16);\n        return s;\n    }\n    /* 取得エンジン（chat_fetcher_main.js の buildAuthHeaders）と同じ作り方。値は返すが出力には載せない */\n    async function headers(c) {\n        var h = { 'content-type': 'application/json' };\n        var hit = pickAuthCookie();\n        var info = { cookie: hit ? hit.name : '(なし)', authUser: '0', pageId: false, client: false };\n        if (hit) {\n            var sec = Math.floor(Date.now() / 1000);\n            h['Authorization'] = 'SAPISIDHASH ' + sec + '_' + (await sha1Hex(sec + ' ' + hit.value + ' ' + ORIGIN));\n            h['X-Origin'] = ORIGIN;\n            info.authUser = (c.sessionIndex !== undefined &amp;&amp; c.sessionIndex !== null) ? String(c.sessionIndex) : '0';\n            h['X-Goog-AuthUser'] = info.authUser;\n            if (c.delegated) { h['X-Goog-PageId'] = String(c.delegated); info.pageId = true; }\n        }\n        if (c.clientName &amp;&amp; c.clientVersion) { h['X-Youtube-Client-Name'] = String(c.clientName); h['X-Youtube-Client-Version'] = String(c.clientVersion); info.client = true; }\n        return { h: h, info: info };\n    }\n    function keysOf(o) { return (o &amp;&amp; typeof o === 'object') ? Object.keys(o).join(',') : '(なし)'; }\n    function textOf(t) {\n        if (!t) return '';\n        if (t.simpleText) return t.simpleText;\n        if (t.runs) return t.runs.map(function (r) { return r.text || (r.emoji &amp;&amp; r.emoji.shortcuts ? r.emoji.shortcuts[0] : ''); }).join('');\n        return '';\n    }\n    function firstCont(lcr) {\n        var cs = (lcr &amp;&amp; lcr.continuations) || [];\n        for (var i = 0; i &lt; cs.length; i++) {\n            var c = cs[i], d = c.invalidationContinuationData || c.timedContinuationData || c.reloadContinuationData || c.liveChatReplayContinuationData;\n            if (d &amp;&amp; d.continuation) return d.continuation;\n        }\n        return null;\n    }\n    async function getLiveChat(c, continuation) {\n        var hh = await headers(c);\n        var res = await fetch('/youtubei/v1/live_chat/get_live_chat?key=' + encodeURIComponent(c.key) + '&amp;prettyPrint=false',\n            { method: 'POST', credentials: 'include', headers: hh.h, body: JSON.stringify({ context: c.ctx, continuation: continuation }) });\n        if (!res.ok) return { status: res.status, body: null };\n        return { status: res.status, body: await res.json() };\n    }\n    function chatTexts(body) {\n        var lc = body &amp;&amp; body.continuationContents &amp;&amp; body.continuationContents.liveChatContinuation;\n        var out = [];\n        ((lc &amp;&amp; lc.actions) || []).forEach(function (a) {\n            var it = a.addChatItemAction &amp;&amp; a.addChatItemAction.item;\n            var r = it &amp;&amp; (it.liveChatTextMessageRenderer || it.liveChatPaidMessageRenderer);\n            if (r) out.push(textOf(r.message));\n        });\n        var next = null;\n        ((lc &amp;&amp; lc.continuations) || []).forEach(function (cc) {\n            var d = cc.invalidationContinuationData || cc.timedContinuationData || cc.reloadContinuationData;\n            if (!next &amp;&amp; d &amp;&amp; d.continuation) next = d.continuation;\n        });\n        return { texts: out, next: next, lc: lc };\n    }\n\n    /* ---------- D-P1: 調べる（送らない） ---------- */\n    async function probe(input) {\n        var r = { id: 'D-P1', name: '投稿の準備（🔴 送らない・読むだけ）', results: [], pcs: [], notes: [] };\n        var vid = videoIdOf(input);\n        var c = cfg();\n        r.pcs.push({ name: 'ここは www.youtube.com のページ（実行先が Top）', ok: true, value: location.origin + location.pathname });\n        r.pcs.push({ name: '動画 ID を読めた', ok: !!vid, value: vid || '(読めない: ' + String(input).slice(0, 40) + ')' });\n        if (!vid) { r.verdict = '判定不能'; return r; }\n\n        var html = '';\n        try { var res = await fetch('/live_chat?is_popout=1&amp;v=' + vid, { credentials: 'include' }); html = res.ok ? await res.text() : ''; r.notes.push({ name: '/live_chat ページの HTTP', value: String(res.status) }); }\n        catch (e) { r.notes.push({ name: '/live_chat ページの取得', value: '失敗: ' + (e &amp;&amp; e.message) }); }\n        var d = html ? initialData(html) : null;\n        var lcr = d &amp;&amp; d.contents &amp;&amp; d.contents.liveChatRenderer;\n        r.pcs.push({ name: '🔴 /live_chat ページから liveChatRenderer を取れた（配信中でチャットがある）', ok: !!lcr, value: lcr ? 'あり' : (d ? 'ytInitialData はあるが liveChatRenderer が無い（' + keysOf(d.contents) + '）' : 'ytInitialData が無い') });\n        if (!c.key || !c.ctx) {\n            var km = html.match(/\"INNERTUBE_API_KEY\"\\s*:\\s*\"([^\"]+)\"/), ci = html.indexOf('\"INNERTUBE_CONTEXT\"');\n            if (km &amp;&amp; ci &gt;= 0) { try { c.key = km[1]; c.ctx = JSON.parse(sliceBalancedJson(html, ci + 19)); r.notes.push({ name: 'キーと文脈の出どころ', value: 'HTML（このページの ytcfg に無かった）' }); } catch (e) { } }\n        } else r.notes.push({ name: 'キーと文脈の出どころ', value: 'このページの ytcfg' });\n        if (!lcr) { r.verdict = '判定不能'; return r; }\n\n        var hit = pickAuthCookie();\n        r.results.push({ name: '🔴 ログイン済み（認証用の Cookie がある）', ok: !!hit, actual: hit ? 'あり（' + hit.name + '）' : 'なし', expected: 'あり' });\n        var hh = null;\n        try { hh = await headers(c); } catch (e) { }\n        r.results.push({ name: '🔴 認証ヘッダを組み立てられる（SAPISIDHASH）', ok: !!(hh &amp;&amp; hh.h['Authorization']), actual: hh &amp;&amp; hh.h['Authorization'] ? 'ok' : '作れない', expected: 'ok' });\n        r.results.push({ name: 'キーと文脈（INNERTUBE_API_KEY / CONTEXT）がある', ok: !!(c.key &amp;&amp; c.ctx), actual: (c.key &amp;&amp; c.ctx) ? 'ok' : '無い', expected: 'ok' });\n        r.notes.push({ name: 'X-Goog-AuthUser / X-Goog-PageId（ブランドアカウント）/ クライアント名のヘッダ', value: (hh ? hh.info.authUser + ' / ' + (hh.info.pageId ? '付けた' : '無し') + ' / ' + (hh.info.client ? '付けた' : '無し') : '-') + '（ytcfg LOGGED_IN=' + String(c.loggedIn) + '）' });\n\n        var ap = lcr.actionPanel || null;\n        var inputR = ap &amp;&amp; ap.liveChatMessageInputRenderer;\n        var params = null;\n        try { params = inputR.sendButton.buttonRenderer.serviceEndpoint.sendLiveChatMessageEndpoint.params; } catch (e) { params = null; }\n        r.results.push({ name: '🔴 投稿欄がある（actionPanel が liveChatMessageInputRenderer）', ok: !!inputR, actual: ap ? keysOf(ap) : 'actionPanel なし', expected: 'liveChatMessageInputRenderer' });\n        r.results.push({ name: '🔴 送るための params がある（sendLiveChatMessageEndpoint）', ok: !!params, actual: params ? 'あり（' + params.length + '文字）' : 'なし', expected: 'あり' });\n        if (ap &amp;&amp; !inputR) {\n            var restr = ap[Object.keys(ap)[0]] || {};\n            r.notes.push({ name: '投稿できない理由の文言（actionPanel の中）', value: (textOf(restr.message) || textOf(restr.text) || keysOf(restr)).slice(0, 120) });\n        }\n        if (inputR) {\n            r.notes.push({ name: '投稿欄の子の名前', value: keysOf(inputR) });\n            r.notes.push({ name: '投稿者の名前・アイコンが入っているか（中身は載せない）', value: (inputR.authorName ? '名前あり' : '名前なし') + ' / ' + (inputR.authorPhoto ? 'アイコンあり' : 'アイコンなし') });\n            var ph = inputR.inputField &amp;&amp; inputR.inputField.liveChatTextInputFieldRenderer;\n            if (ph) r.notes.push({ name: '入力欄の案内文・文字数の上限', value: (textOf(ph.placeholder) || '-').slice(0, 60) + ' / ' + (ph.maxCharacterLength || '-') });\n        }\n\n        /* 今の取得エンジンだけで params を得られるか（watch ページ・get_live_chat の応答） */\n        try {\n            var wres = await fetch('/watch?v=' + vid, { credentials: 'include' });\n            var wd = wres.ok ? initialData(await wres.text()) : null;\n            var wl = wd &amp;&amp; wd.contents &amp;&amp; wd.contents.twoColumnWatchNextResults &amp;&amp; wd.contents.twoColumnWatchNextResults.conversationBar &amp;&amp; wd.contents.twoColumnWatchNextResults.conversationBar.liveChatRenderer;\n            r.notes.push({ name: 'watch ページの liveChatRenderer に actionPanel があるか', value: wl ? (wl.actionPanel ? 'ある（' + keysOf(wl.actionPanel) + '）' : 'ない') : 'liveChatRenderer が無い' });\n        } catch (e) { r.notes.push({ name: 'watch ページの liveChatRenderer に actionPanel があるか', value: '取得失敗' }); }\n        var cont = firstCont(lcr);\n        if (cont &amp;&amp; c.key &amp;&amp; c.ctx) {\n            try {\n                var g = await getLiveChat(c, cont);\n                var lc = g.body &amp;&amp; g.body.continuationContents &amp;&amp; g.body.continuationContents.liveChatContinuation;\n                r.notes.push({ name: 'get_live_chat の応答に actionPanel があるか', value: 'HTTP ' + g.status + ' / ' + (lc ? (lc.actionPanel ? 'ある（' + keysOf(lc.actionPanel) + '）' : 'ない') : '応答に liveChatContinuation が無い') });\n            } catch (e) { r.notes.push({ name: 'get_live_chat の応答に actionPanel があるか', value: '失敗: ' + (e &amp;&amp; e.message) }); }\n        }\n\n        S.prep = (inputR &amp;&amp; params &amp;&amp; c.key &amp;&amp; c.ctx) ? { vid: vid, params: params, cfg: c, cont: cont } : null;\n        var pass = r.results.filter(function (x) { return x.ok; }).length;\n        r.pass = pass;\n        r.verdict = pass === r.results.length ? '合格' : '不合格';\n        return r;\n    }\n\n    /* ---------- D-P2: 送る（確認つき・1回） ---------- */\n    async function send(text) {\n        var r = { id: 'D-P2', name: '投稿（🔴 確認の窓で OK したときだけ1回送る）', results: [], pcs: [], notes: [] };\n        var p = S.prep;\n        text = String(text || '').trim();\n        r.pcs.push({ name: '先に ▶ C1 調べる が合格している（params がある）', ok: !!p, value: p ? '動画 ' + p.vid : 'まだ / 不合格' });\n        r.pcs.push({ name: '本文がある（' + MAX_LEN + '字まで）', ok: !!text &amp;&amp; text.length &lt;= MAX_LEN, value: text.length + '字' });\n        var wait = COOLDOWN_MS - (Date.now() - S.lastSendAt);\n        r.pcs.push({ name: '前回の送信から15秒たった（二重送信の防止）', ok: tton', '▶ C1 調べる（送らない）', 'margin:2px 0;padding:2px 6px;cursor:pointer;');\n    var inText = mk('input', '', 'width:100%;box-sizing:border-box;margin:6px 0 2px;padding:3px;color:#000;');\n    inText.placeholder = '投稿する本文（200字まで）'; inText.maxLength = MAX_LEN;\n    var bSend = mk('button', '▶ C2 送る（確認あり・1回）', 'margin:2px 0;padding:2px 6px;cursor:pointer;');\n    var bCopy = mk('button', '📋 コピー', 'margin:2px;padding:2px 6px;cursor:pointer;');\n    var bClose = mk('button', '×', 'margin:2px;padding:2px 6px;cursor:pointer;');\n    panel.appendChild(mk('div', 'スパイク C1（' + SNIP_VERSION + '）', 'color:#0fc;font-weight:bold;'));\n    panel.appendChild(status); panel.appendChild(inVid); panel.appendChild(bProbe);\n    panel.appendChild(inText); panel.appendChild(bSend);\n    panel.appendChild(mk('div', '', 'height:4px;')); panel.appendChild(bCopy); panel.appendChild(bClose);\n    document.body.appendChild(panel);\n    S.panel = panel;\n    function setStatus(t, hot) { status.textContent = t; status.style.color = hot ? '#ff0' : '#fff'; }\n    setStatus('動画を入れて ▶ C1 調べる');\n\n    async function run(fn) {\n        if (S.running) return;\n        S.running = true; bProbe.disabled = bSend.disabled = true;\n        try {\n            var r = await fn();\n            S.reports = S.reports.filter(function (x) { return x.id !== r.id; });\n            S.reports.push(r);\n            setStatus(r.id + ': ' + r.verdict + '（' + (r.pass || 0) + '/' + r.results.length + '）。📋 で結果をコピー', r.verdict !== '合格');\n        } catch (e) {\n            setStatus('⚠ 失敗: ' + (e &amp;&amp; e.message ? e.message : e), true);\n        } finally {\n            S.running = false; bProbe.disabled = bSend.disabled = false;\n        }\n    }\n    bProbe.onclick = function () { setStatus('調べています…（送りません）'); run(function () { return probe(inVid.value); }); };\n    bSend.onclick = function () { setStatus('送っています…'); run(function () { return send(inText.value); }); };\n    bCopy.onclick = function () {\n        var md = <script>
(function () {
    'use strict';

    var FORM_ENGINE_VERSION = '3.0.0';

    var RUNAT_MAX_H = 24;          /* 照合③のしきい値（時間） */

    /* ---------------------------------------------------------------

    function normalize(a) {
        var it = {
            id: a.id, type: a.type || 'text', label: a.label || '',

            expectIds: a.expectIds ? a.expectIds.slice() : null,
            secret: !!a.secret, optional: !!a.optional

        /* 🔴 認証情報は「ある / ない」の radio に強制する。値の入力欄を作らない。 */
        if (it.secret) { it.type = 'radio'; it.options = ['ある', 'ない']; }
        if (it.type === 'radio') {
            it.options = it.options || [];
            EXTRA_CHOICES.forEach(function (c) {
                if (it.options.indexOf(c) < 0) it.options.push(c);

        }
        return it;
    }

    /* STEPS を「描画順の並び」と「回答項目の並び」に分ける。 */
    var ITEMS = [];
    var BLOCKS = [];
    (function build() {
        STEPS.forEach(function (s, i) {
            if (s.sec) { BLOCKS.push({ kind: 'sec', sec: s.sec, html: s.html || '' }); return; }

            if (s.ans) list = (Object.prototype.toString.call(s.ans) === '[object Array]') ? s.ans : [s.ans];

            BLOCKS.push({ kind: s.ttl ? 'step' : 'ansonly', ttl: s.ttl || '', rows: s.rows || [],
                          note: s.note || '', items: norm, idx: i });
        });
        var seen = {};
        ITEMS.forEach(function (it) {
            if (!it.id) throw new Error('id の無い回答欄があります');
            if (seen[it.id]) throw new Error('id が重複しています: ' + it.id);
            seen[it.id] = 1;
        });
    })();

    var answers = {};
    ITEMS.forEach(function (it) { answers[it.id] = { choice: '', text: '', done: false }; });

    function ans(id) { return answers[id]; }
    function isBlank(it) {
        if (it.optional) return false;
        var a = ans(it.id);

    /* ---------------------------------------------------------------
       3つの照合（/get-debug-suite 9-3節）

    /* 🔴 テストIDは出力の一覧表の行頭から取る。ログの文言からは拾わない。 */
    function extractIds(text) {

        while ((m = re.exec(text || ''))) { if (out.indexOf(m[1]) < 0) out.push(m[1]); }

    }
    function extractVersions(text) {

        var d = /debug_suite:\s*`([^`]*)`/.exec(t);
        var a = /APP_VERSION:\s*`([^`]*)`/.exec(t);
        var b = /版数バッジ:\s*`([^`]*)`/.exec(t);
        return { suite: d ? d[1] : null, app: a ? a[1] : null, badge: b ? b[1] : null };
    }
    function extractRunAt(text) {
        var m = /実行日時:\s*([0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z)/.exec(text || '');
        return m ? m[1] : null;
    }
    /* 戻り値: { level:'ok'|'warn'|'ng', msg:'...' } の配列 */
    function verifyPaste(it, text) {
        var out = [];
        if (!text || !text.trim()) return out;

        /* 照合① 要求したテストIDが揃っているか */
        if (it.expectIds) {
            var got = extractIds(text);
            var miss = it.expectIds.filter(function (x) { return got.indexOf(x) < 0; });
            var extra = got.filter(function (x) { return it.expectIds.indexOf(x) < 0; });
            if (got.length === 0) {
                out.push({ level: 'ng', msg: '照合① テストIDを1つも読み取れません。'
                    + '「📋 報告書用にコピー」の中身をそのまま貼っているか確認してください。' });
            } else if (miss.length) {
                out.push({ level: 'ng', msg: '照合① 欠けているテストID: ' + miss.join(', ')
                    + '（ボタンの押し忘れ、または測定が途中で止まっています）' });
            } else {
                out.push({ level: 'ok', msg: '照合① 要求した ' + it.expectIds.length + '件のIDが揃っています。' });
            }
            if (extra.length) {
                out.push({ level: 'warn', msg: '照合① この回で要求していないIDも入っています: '
                    + extra.join(', ') + '（⚠️ 欠落ではありません。'
                    + '「🗑 ログを消す」を押さずに2回目を回すと前回の記録が残ります）' });
            }
        }
        /* 照合② 版数 */
        var v = extractVersions(text);
        if (v.suite === null && v.app === null) {
            out.push({ level: 'warn', msg: '照合② 版数の行を読み取れませんでした。' });
        } else {
            var bad = [];
            if (v.suite !== FORM_META.expectSuite) bad.push('debug_suite = ' + v.suite + '（期待 ' + FORM_META.expectSuite + '）');
            if (v.app !== FORM_META.expectApp) bad.push('APP_VERSION = ' + v.app + '（期待 ' + FORM_META.expectApp + '）');
            if (v.badge && /warn|ng|未検出|⇔|権限なし/.test(v.badge)) bad.push('版数バッジ = ' + v.badge);
            if (bad.length) out.push({ level: 'ng', msg: '照合② 版数が期待と違います: ' + bad.join(' / ') });
            else out.push({ level: 'ok', msg: '照合② 版数は期待どおりです（suite ' + v.suite + ' / app ' + v.app + '）。' });
        }
        /* 照合③ 実行日時 */
        var at = extractRunAt(text);
        if (!at) {
            out.push({ level: 'warn', msg: '照合③ 実行日時を読み取れませんでした。' });
        } else {
            var h = (Date.now() - new Date(at).getTime()) / 3600000;
            if (!isFinite(h)) out.push({ level: 'warn', msg: '照合③ 実行日時を解釈できません: ' + at });
            else if (h > RUNAT_MAX_H) out.push({ level: 'ng', msg: '照合③ 出力が古すぎます（'
                + h.toFixed(1) + '時間前）。前のラウンドの出力を貼っていませんか。' });
            else out.push({ level: 'ok', msg: '照合③ 実行日時は ' + h.toFixed(1) + '時間前です。' });
        }
        return out;
    }

    /* ---------------------------------------------------------------
       描画（🔴 画面の並び ＝ 手順の順 ＝ 出力の順。節でまとめ直さない）
       --------------------------------------------------------------- */
    function el(tag, cls, text) {
        var e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text !== undefined && text !== null) e.textContent = text;
        return e;
    }

    function render() {
        document.getElementById('hTitle').textContent = '統合テスト用紙 ─ ' + FORM_META.work;
        document.getElementById('hMeta').textContent =
            'エンジン ' + FORM_ENGINE_VERSION + ' / 項目定義 ' + FORM_META.defVersion
            + ' / 基点: ' + FORM_META.base
            + ' / 期待版数: app ' + FORM_META.expectApp + ' ・ suite ' + FORM_META.expectSuite;
        document.getElementById('hNote').textContent = FORM_META.note || '';
        var host = document.getElementById('form');
        host.textContent = '';
        BLOCKS.forEach(function (b) {
            if (b.kind === 'sec') {
                var s = el('div', 'sec');
                s.appendChild(el('h2', null, b.sec));
                var p = el('p'); p.innerHTML = b.html; s.appendChild(p);
                host.appendChild(s);
                return;
            }
            var box = el('div', 'item');
            if (b.ttl) box.appendChild(el('h3', null, b.ttl));
            var body = el('div', 'body');
            if (b.rows && b.rows.length) {
                var t = el('table', 'steps');
                var hr = document.createElement('tr');
                hr.appendChild(el('th', null, 'やること'));
                hr.appendChild(el('th', null, 'これで何をしたいか'));
                t.appendChild(hr);
                b.rows.forEach(function (r) {
                    var tr = document.createElement('tr');
                    var td1 = document.createElement('td'); td1.innerHTML = r[0];
                    var td2 = document.createElement('td'); td2.innerHTML = r[1] || '';
                    tr.appendChild(td1); tr.appendChild(td2); t.appendChild(tr);
                });
                body.appendChild(t);
            }
            if (b.note) body.appendChild(el('div', 'note', b.note));
            b.items.forEach(function (it) { body.appendChild(renderAns(it)); });
            box.appendChild(body);
            host.appendChild(box);
        });
        updateBlank();
    }

    function renderAns(it) {
        var wrap = el('div', 'ans');
        wrap.id = 'ans_' + it.id;
        var lbl = el('div', 'lbl');
        var aid = el('span', 'aid', it.id); lbl.appendChild(aid);
        lbl.appendChild(document.createTextNode(it.label));
        wrap.appendChild(lbl);
        var a = ans(it.id);

        if (it.type === 'radio') {
            it.options.forEach(function (opt, i) {
                var lab = el('label', 'opt');
                var inp = document.createElement('input');
                inp.type = 'radio'; inp.name = 'r_' + it.id; inp.value = opt;
                inp.addEventListener('change', function () { a.choice = opt; save(); updateBlank(); });
                lab.appendChild(inp);
                lab.appendChild(document.createTextNode(opt));
                wrap.appendChild(lab);
            });
        } else if (it.type === 'check') {
            var lab2 = el('label', 'opt');
            var chk = document.createElement('input');
            chk.type = 'checkbox'; chk.id = 'c_' + it.id;
            chk.addEventListener('change', function () { a.done = chk.checked; save(); updateBlank(); });
            lab2.appendChild(chk);
            lab2.appendChild(document.createTextNode(' 確認した'));
            wrap.appendChild(lab2);
        } else if (it.type === 'suite' || it.type === 'paste') {
            var ta = document.createElement('textarea');
            ta.className = 'paste'; ta.id = 't_' + it.id;
            ta.placeholder = 'ここへ貼り付けてください';
            var vbox = el('div');
            ta.addEventListener('input', function () {
                a.text = ta.value; save(); updateBlank(); drawVerify(it, vbox, ta.value);
            });
            wrap.appendChild(ta);
            wrap.appendChild(vbox);
        } else {
            var ta2 = document.createElement('textarea');
            ta2.className = 'free'; ta2.id = 't_' + it.id;
            ta2.addEventListener('input', function () { a.text = ta2.value; save(); updateBlank(); });
            wrap.appendChild(ta2);
        }
        return wrap;
    }

    function drawVerify(it, host, text) {
        host.textContent = '';
        verifyPaste(it, text).forEach(function (v) {
            host.appendChild(el('div', 'verify ' + v.level, v.msg));
        });
    }

    function updateBlank() {
        ITEMS.forEach(function (it) {
            var bad = isBlank(it);
            var w = document.getElementById('ans_' + it.id);
            if (!w) return;
            var f = w.querySelector('textarea') || w.querySelector('input[type=checkbox]');
            if (f) { if (bad) f.classList.add('blank'); else f.classList.remove('blank'); }
            if (it.type === 'radio') {
                if (bad) w.classList.add('blank'); else w.classList.remove('blank');
            }
        });
        var b = blankItems();
        document.getElementById('hStat').innerHTML = b.length
            ? ('未記入 <b>' + b.length + '件</b>（' + b.map(function (x) { return x.id; }).join(', ') + '）')
            : '未記入はありません。';
    }

    /* ---------------------------------------------------------------
       下書き（localStorage / 回が変われば混ざらない）
       --------------------------------------------------------------- */
    function draftKey() { return LS_KEY + ':' + FORM_META.defVersion; }
    var saveTimer = null;
    function save() {
        if (saveTimer) clearTimeout(saveTimer);
        saveTimer = setTimeout(function () {
            try {
                localStorage.setItem(draftKey(), JSON.stringify({
                    engine: FORM_ENGINE_VERSION, def: FORM_META.defVersion,
                    at: Date.now(), answers: answers
                }));
                setStatus('下書きを保存しました（' + new Date().toLocaleTimeString() + '）');
            } catch (e) { setStatus('⚠ 下書きを保存できません: ' + (e && e.message)); }
        }, 250);
    }
    function load() {
        var raw = null;
        try { raw = localStorage.getItem(draftKey()); } catch (e) { }
        if (!raw) return false;
        try {
            var o = JSON.parse(raw);
            if (!o || o.def !== FORM_META.defVersion) return false;
            Object.keys(o.answers || {}).forEach(function (k) {
                if (answers[k]) answers[k] = o.answers[k];
            });
            return true;
        } catch (e) { return false; }
    }
    function applyToDom() {
        ITEMS.forEach(function (it) {
            var a = ans(it.id);
            if (it.type === 'radio') {
                var list = document.getElementsByName('r_' + it.id);
                for (var i = 0; i < list.length; i++) list[i].checked = (list[i].value === a.choice);
            } else if (it.type === 'check') {
                var c = document.getElementById('c_' + it.id); if (c) c.checked = !!a.done;
            } else {
                var t = document.getElementById('t_' + it.id); if (t) t.value = a.text || '';
                if (it.type === 'suite' || it.type === 'paste') {
                    var w = document.getElementById('ans_' + it.id);
                    if (w) drawVerify(it, w.lastChild, a.text || '');
                }
            }
        });
        updateBlank();
    }
    function setStatus(s) { document.getElementById('status').textContent = s; }

    /* ---------------------------------------------------------------
       出力
       --------------------------------------------------------------- */
    function valueText(it) {
        var a = ans(it.id);
        if (it.type === 'radio') return a.choice || '（未記入）';
        if (it.type === 'check') return a.done ? '確認した' : '（未記入）';
        return (a.text && a.text.trim()) ? a.text : '（未記入）';
    }
    function isLong(it) { return it.type === 'suite' || it.type === 'paste'; }

    function fence(body) {
        var m = body.match(/`+/g) || [];
        var max = 0;
        m.forEach(function (s) { if (s.length > max) max = s.length; });
        var n = Math.max(3, max + 1), f = '';
        for (var i = 0; i < n; i++) f += '`';
        return f;
    }

    function buildBody() {
        var L = [];
        ITEMS.forEach(function (it) {
            L.push('### ' + it.id + ' ' + it.label);
            if (isLong(it)) {
                var v = valueText(it);
                var f = fence(v);
                L.push(f);
                L.push(v);
                L.push(f);
                verifyPaste(it, ans(it.id).text).forEach(function (x) {
                    L.push('- ' + (x.level === 'ok' ? '⚪ ' : (x.level === 'ng' ? '❌ ' : '⚠ ')) + x.msg);
                });
            } else {
                L.push(valueText(it));
            }
            L.push('');
        });
        return L.join('\n');
    }

    /* ---------------------------------------------------------------
       自己診断（🔴 本文を先に組み立ててから、その文字列を検査する）
       --------------------------------------------------------------- */
    function chk(list, name, actual, expected) {
        var ok = String(actual) === String(expected);
        list.push({ ok: ok, name: name, actual: String(actual), expected: String(expected) });
        return ok;
    }

    function runSelfCheck(bodyText) {
        var L = [];

        /* 項目数と種別 */
        chk(L, '描画された回答欄の数が定義と一致',
            document.querySelectorAll('#form .ans').length, ITEMS.length);
        var kinds = {};
        ITEMS.forEach(function (it) { kinds[it.type] = (kinds[it.type] || 0) + 1; });
        chk(L, 'suite 欄が1つ以上ある', (kinds.suite || 0) > 0, true);
        chk(L, 'radio 欄が1つ以上ある', (kinds.radio || 0) > 0, true);
        chk(L, 'check 欄が1つ以上ある', (kinds.check || 0) > 0, true);
        chk(L, 'text 欄が1つ以上ある', (kinds.text || 0) > 0, true);
        ITEMS.forEach(function (it) {
            if (!document.getElementById('ans_' + it.id)) {
                L.push({ ok: false, name: '描画されていない回答欄', actual: it.id, expected: '描画済み' });
            }
        });

        /* 🔴 画像を扱わないこと */
        chk(L, '画像・ファイル入力の要素が無い',
            document.querySelectorAll('img, canvas, svg, input[type=file]').length, 0);

        /* secret の強制（この回には secret 項目が無いので正規化関数で確かめる） */
        var s = normalize({ id: '__pc_secret__', type: 'text', secret: true });
        chk(L, 'PC: secret を付けると radio「ある / ない」に強制される',
            s.type + ':' + s.options.slice(0, 2).join('/'), 'radio:ある/ない');

        /* 選択肢の自動追加 */
        var okExtra = true;
        ITEMS.forEach(function (it) {
            if (it.type !== 'radio') return;
            EXTRA_CHOICES.forEach(function (c) { if (it.options.indexOf(c) < 0) okExtra = false; });
        });
        chk(L, 'すべての radio に「該当なし / 測れなかった / 未実施」が足されている', okExtra, true);

        /* 1万文字を入れても欄の高さが変わらない */
        (function () {
            var ta = document.querySelector('textarea.paste');
            if (!ta) { L.push({ ok: false, name: '貼り付け欄が見つからない', actual: 'なし', expected: 'あり' }); return; }
            var h0 = ta.offsetHeight, keep = ta.value, big = new Array(10001).join('x');
            ta.value = big;
            var h1 = ta.offsetHeight;
            ta.value = keep;
            chk(L, '1万文字を入れても貼り付け欄の高さが変わらない', h1, h0);
        })();

        /* 未記入と赤枠の一致 */
        (function () {
            var reds = 0;
            ITEMS.forEach(function (it) {
                var w = document.getElementById('ans_' + it.id);
                if (!w) return;
                var f = w.querySelector('textarea') || w.querySelector('input[type=checkbox]');
                if ((f && f.classList.contains('blank')) || w.classList.contains('blank')) reds++;
            });
            chk(L, '赤枠の数と未記入の数が一致', reds, blankItems().length);
        })();

        /* 「（未記入）」の表記 */
        chk(L, '未記入があるとき出力に「（未記入）」が入る',
            blankItems().length > 0 ? (bodyText.indexOf('（未記入）') >= 0) : true, true);

        /* 出力の並び順 ＝ 画面の並び順 */
        (function () {
            var pos = -1, ok = true;
            ITEMS.forEach(function (it) {
                var p = bodyText.indexOf('### ' + it.id + ' ');
                if (p < 0 || p < pos) ok = false;
                pos = p;
            });
            chk(L, '出力の並び順が画面の並び順と一致', ok, true);
        })();

        /* 下書きの往復 */
        (function () {
            var keep = JSON.stringify(answers);
            save();
            var raw = null;
            try {
                localStorage.setItem(draftKey(), JSON.stringify({
                    engine: FORM_ENGINE_VERSION, def: FORM_META.defVersion, at: Date.now(), answers: answers
                }));
                raw = localStorage.getItem(draftKey());
            } catch (e) { }
            var ok = false;
            try { ok = (JSON.stringify(JSON.parse(raw).answers) === keep); } catch (e) { }
            chk(L, '下書きの保存と読み出しが往復する', ok, true);
        })();

        /* 🔴 照合そのものの positive control（鉄則 #22） */
        (function () {
            var fake = '| D-Z9 にせもの | ⚪ | 1/1 | |\n- debug_suite: `0.0.0` / APP_VERSION: `0.0.0`\n'
                + '- 版数バッジ: `v0.0.0 / アドオン未検出`\n- 実行日時: 2000-01-01T00:00:00.000Z';
            var r = verifyPaste({ id: '__pc__', type: 'suite', expectIds: ['D-Y1'] }, fake);
            var txt = r.map(function (x) { return x.level + ':' + x.msg; }).join(' | ');
            chk(L, 'PC: 偽のIDを与えると照合①が「欠けている」と言う',
                /ng.*照合①/.test(txt), true);
            chk(L, 'PC: 偽の版数を与えると照合②が落ちる', /ng.*照合②/.test(txt), true);
            chk(L, 'PC: 古い日時を与えると照合③が落ちる', /ng.*照合③/.test(txt), true);
            chk(L, 'PC: 要求していないIDがあると照合①が警告する', /warn.*照合①/.test(txt), true);
            var good = '| D-Y1 ほんもの | ⚪ | 1/1 | |\n- debug_suite: `' + FORM_META.expectSuite
                + '` / APP_VERSION: `' + FORM_META.expectApp + '`\n- 版数バッジ: `v'
                + FORM_META.expectApp + '`\n- 実行日時: ' + new Date().toISOString();
            var r2 = verifyPaste({ id: '__pc2__', type: 'suite', expectIds: ['D-Y1'] }, good);
            var ng2 = r2.filter(function (x) { return x.level !== 'ok'; }).length;
            chk(L, 'PC: 正しい出力では3つの照合がすべて ⚪', ng2, 0);
        })();

        /* 各 suite 欄の照合結果 */
        ITEMS.forEach(function (it) {
            if (it.type !== 'suite') return;
            var r = verifyPaste(it, ans(it.id).text);
            var ng = r.filter(function (x) { return x.level === 'ng'; }).length;
            var wn = r.filter(function (x) { return x.level === 'warn'; }).length;
            L.push({ ok: ng === 0, name: '照合の結果（' + it.id + '）',
                actual: 'NG ' + ng + ' / 警告 ' + wn, expected: 'NG 0' });
        });

        return L;
    }

    function buildMarkdown() {
        var body = buildBody();
        var diag = runSelfCheck(body);
        var L = [];
        var blanks = blankItems();
        L.push('# 統合テスト用紙 出力 ─ ' + FORM_META.work);
        L.push('');
        L.push('## 0. この用紙について');
        L.push('');
        L.push('- エンジン: `' + FORM_ENGINE_VERSION + '` / 項目定義: `' + FORM_META.defVersion + '`');
        L.push('- 基点コード: ' + FORM_META.base);
        L.push('- 期待版数: app `' + FORM_META.expectApp + '` / suite `' + FORM_META.expectSuite + '`');
        L.push('- 提出日時: ' + new Date().toISOString());
        L.push('- 未記入: ' + blanks.length + '件'
            + (blanks.length ? '（' + blanks.map(function (b) { return b.id; }).join(', ') + '）' : ''));
        L.push('');
        L.push('### 用紙の自己診断');
        L.push('');
        L.push('| 検査 | 結果 | 実測 | 期待 |');
        L.push('| :--- | :--: | :--- | :--- |');
        diag.forEach(function (d) {
            L.push('| ' + d.name + ' | ' + (d.ok ? '⚪' : '❌') + ' | ' + d.actual + ' | ' + d.expected + ' |');
        });
        var ng = diag.filter(function (d) { return !d.ok; }).length;
        L.push('');
        L.push('❌ の件数: **' + ng + '**');
        L.push('');
        L.push('## 1. 回答');
        L.push('');
        L.push(body);
        return L.join('\n');
    }

    /* ---------------------------------------------------------------
       操作
       --------------------------------------------------------------- */
    function copyOut() {
        var md = buildMarkdown();
        var done = function () { setStatus('コピーしました（' + md.length + '文字）'); };
        var fail = function () {
            /* 退路: 画面外テキストエリア + execCommand。display:none にすると選択できず失敗する。 */
            var ta = document.createElement('textarea');
            ta.style.position = 'fixed'; ta.style.left = '-9999px'; ta.style.top = '0';
            ta.value = md; document.body.appendChild(ta); ta.select();
            var ok = false;
            try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
            document.body.removeChild(ta);
            setStatus(ok ? 'コピーしました（退路 / ' + md.length + '文字）'
                : '⚠ コピーできませんでした。「⬇ .md で保存」を使ってください。');
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(md).then(done, fail);
        } else { fail(); }
    }
    function download() {
        var md = buildMarkdown();
        var b = new Blob([md], { type: 'text/markdown;charset=utf-8' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(b);
        a.download = 'test_' + FORM_META.defVersion.replace(/[^0-9a-zA-Z.]/g, '_') + '.md';
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setStatus('.md を保存しました。');
    }

    render();
    var had = load();
    applyToDom();
    setStatus(had ? '前回の下書きを読み込みました。' : '新しい用紙です。');

    document.getElementById('btnCopy').addEventListener('click', copyOut);
    document.getElementById('btnDl').addEventListener('click', download);
    document.getElementById('btnClear').addEventListener('click', function () {
        if (!window.confirm('この回の下書きを消します。よろしいですか。')) return;
        try { localStorage.removeItem(draftKey()); } catch (e) { }
        ITEMS.forEach(function (it) { answers[it.id] = { choice: '', text: '', done: false }; });
        applyToDom();
        setStatus('下書きを消しました。');
    });
})();
</script>
