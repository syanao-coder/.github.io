        function updateLayout() {
            const grid = document.getElementById('playersGrid');
            const cards = Array.from(grid.children);
            const N = cards.length;
            if (N === 0) return;
            if (N === 1) {
                grid.style.gridTemplateColumns = 'minmax(0, 1fr)'; grid.style.gridTemplateRows = 'minmax(0, 1fr)';
                cards[0].style.gridColumn = 'span 1'; cards[0].style.gridRow = 'span 1'; return;
            }
            const hasPin = cards.some(c => c.classList.contains('is-main'));
            let colSetting = document.getElementById('layoutCols') ? document.getElementById('layoutCols').value : 'auto';
            if (N === 2) {
                const dir = document.getElementById('layout2Dir').value;
                if (dir === 'vertical') {
                    grid.style.gridTemplateColumns = 'minmax(0, 1fr)'; grid.style.gridTemplateRows = hasPin ? 'minmax(0, 2fr) minmax(0, 1fr)' : 'minmax(0, 1fr) minmax(0, 1fr)';
                } else { 
                    if (hasPin) { grid.style.gridTemplateColumns = 'minmax(0, 1fr)'; grid.style.gridTemplateRows = 'minmax(0, 2fr) minmax(0, 1fr)'; } 
                    else { grid.style.gridTemplateColumns = 'minmax(0, 1fr) minmax(0, 1fr)'; grid.style.gridTemplateRows = 'minmax(0, 1fr)'; }
                }
                cards.forEach(c => { c.style.gridColumn = 'span 1'; c.style.gridRow = 'span 1'; }); return;
            }
            const logicalCount = hasPin ? N + 3 : N;
            const parsedCols = parseInt(colSetting, 10);
            let cols;
            if (colSetting !== 'auto' && Number.isInteger(parsedCols) && parsedCols >= 1 && parsedCols <= 4) {
                // 手動指定（1〜4列）が有効な場合のみそれを使用
                cols = parsedCols;
            } else {
                // 'auto'、または不正な値（空文字列・NaN等）の場合は自動計算にフォールバック
                // ※以前はここでNaNになりgrid-template-columnsが無効化され、縦1列に積まれるバグがあった
                if (logicalCount <= 4) cols = 2;
                else if (logicalCount <= 6) cols = 3;
                else if (logicalCount <= 9) cols = 3;
                else cols = 4;
            }
            const rows = Math.ceil(logicalCount / cols);
            grid.style.gridTemplateColumns = 'repeat(' + cols + ', minmax(0, 1fr))';
            grid.style.gridTemplateRows = 'repeat(' + rows + ', minmax(0, 1fr))';
            cards.forEach(c => {
                if (c.classList.contains('is-main')) {
                    const spanCol = Math.min(2, cols);
                    c.style.gridColumn = 'span ' + spanCol; c.style.gridRow = 'span 2';
                } else { c.style.gridColumn = 'span 1'; c.style.gridRow = 'span 1'; }
            });
        }
        /* ============================================================
           チャット欄（YouTubeアーカイブ/ライブチャット埋め込み）
           ============================================================

           ■ 仕組み
           YouTubeの live_chat ページを iframe で直接埋め込む。
           アドオン（B側）は一切関与しない ＝ この機能はA側だけで完結する。

           ■ embed_domain が必須
           live_chat は「親ページのドメイン」を embed_domain パラメータで
           明示しないと X-Frame-Options で拒否される。
           旧実装が空欄のまま（is_popout=1 のみ）で動かなかった主因はこれ。
             ・https://syanao-coder.github.io → embed_domain=syanao-coder.github.io  ✅
             ・http://localhost:PORT         → embed_domain=localhost              ✅
             ・file:///...                    → ホスト名が存在せず埋め込み不可      ❌
           file:// の場合は iframe を出さず案内文を表示する。

           ■ 再生位置との同期
           YouTubeの視聴ページは、チャットiframeへ
             postMessage('{"yt-player-video-progress": 秒数}')
           を定期的に投げることでリプレイチャットを追従させている。
           同じ手法をここでも使う（非公式仕様のため将来変わる可能性あり。
           ずれた場合は チャット欄の 🔄 で再読込すれば現在位置から再開する）。
           ============================================================ */

        let chatVisible = {};        // cardId → bool（表示中か）
        let chatRatio = {};          // cardId → 0.15〜0.70（枠に占めるチャットの割合）
        let chatLoadedVideoId = {};  // cardId → 現在読み込み中のキー（videoId|mode）
        let chatMode = {};           // cardId → 'replay'（アーカイブ） | 'live'（配信中）
        let chatModeManual = {};     // cardId → true（ユーザーが📼/🔴で手動切替した）
        const CHAT_MODE_DEFAULT = 'replay';
        /* ★アーカイブ(リプレイ)チャットの扱い ─ 実測で確定した仕様
           公式ドキュメントの記載は「During a live stream, you can embed Live Chat」で、
           対応URLは live_chat?v=<ID>&embed_domain=<host> の1形式のみ。
             ・live_chat?v=<配信中ID>   → ✅ 表示される（実機確認済み）
             ・live_chat?v=<終了済みID> → 「このライブストリームではチャットは無効です」
             ・live_chat_replay?v=<ID>  → 「Something went wrong」
           replay側は v= ではなく continuation トークンで駆動されるため。
           重要: この「Something went wrong」はiframe内に描画されている＝
           embed_domain によるフレーム許可自体は通っている。
           つまり正しい continuation さえ渡せば表示できる見込みが高い。

           continuation は watchページのHTML内 ytInitialData に埋まっているが、
           ブラウザのJSから直接 fetch するとCORSで弾かれる。
           → アドオン(B側)の background.js に取りに行かせる。
             manifest には既に https://*.youtube.com/* があるため権限追加は不要。 */
        let chatInfoCache = {};            // videoId → { isLive, continuation }（アドオンの回答＝正解）
        let chatContinuationCache = {};    // videoId → continuationトークン
        let chatContinuationPending = {};  // requestId → { cardId, videoId }
        let chatContinuationInflight = {}; // videoId → requestId（多重要求の抑止）
        let chatContinuationFailed = {};   // videoId → 失敗理由（再試行までは案内を出す）
        const CHAT_CONTINUATION_TIMEOUT_MS = 10000;
        const CHAT_RATIO_DEFAULT = 0.30;
        const CHAT_RATIO_MIN = 0.15;
        const CHAT_RATIO_MAX = 0.70;

        function generateChatPaneHTML(cardId) {
            return '<div class="chat-splitter" id="splitter_' + cardId + '" title="ドラッグでチャット欄の幅を変更"></div>' +
                '<div class="chat-container" id="chatContainer_' + cardId + '">' +
                    '<div class="chat-head">' +
                        '<span class="chat-head-title" id="chatHeadTitle_' + cardId + '">💬 チャット</span>' +
                        '<button id="chatModeBtn_' + cardId + '" onclick="toggleChatMode(\'' + cardId + '\')" title="アーカイブ(リプレイ) / 配信中(ライブ) を切り替え">📼</button>' +
                        '<button onclick="reloadChat(\'' + cardId + '\')" title="現在の再生位置でチャットを読み込み直す">🔄</button>' +
                        '<button onclick="openChatPopout(\'' + cardId + '\')" title="チャットを別ウィンドウで開く">⧉</button>' +
                        '<button onclick="toggleChatVisibility(\'' + cardId + '\')" title="チャット欄を閉じる">✕</button>' +
                    '</div>' +
                    '<div class="chat-body" id="chatBody_' + cardId + '">' +
                        '<iframe id="chatIframe_' + cardId + '" allow="autoplay"></iframe>' +
                        '<div class="chat-note" id="chatNote_' + cardId + '"></div>' +
                    '</div>' +
                '</div>';
        }

        // 埋め込みに使えるホスト名。file:// では空文字が返る（＝埋め込み不可）。
        function getChatEmbedDomain() {
            return window.location.hostname || '';
        }

        // この枠で現在チャットを出せる videoId。プレイリストは再生中の動画IDを使う。
        function getChatVideoId(cardId) {
            const yt = ytPlayers[cardId];
            if (yt && typeof yt.getVideoData === 'function') {
                try {
                    const d = yt.getVideoData();
                    if (d && d.video_id) return d.video_id;
                } catch (e) {}
            }
            const key = cardVideoKeys[cardId];
            if (key && key.indexOf('list:') !== 0) return key;
            return null;
        }

        function getChatMode(cardId) {
            return chatMode[cardId] || CHAT_MODE_DEFAULT;
        }

        /* 配信『中』かアーカイブかを判定して、使うエンドポイントを自動で決める。
           getProgressState() は非公式APIだが isLive を持っており、
           IFrame Player API で最も確実にライブ判定できる手段。
           取得できない環境では replay（アーカイブ）へ倒す。 */
        function detectChatMode(cardId) {
            const yt = ytPlayers[cardId];
            if (yt) {
                try {
                    const p = (typeof yt.getProgressState === 'function') ? yt.getProgressState() : null;
                    if (p && typeof p.isLive === 'boolean') return p.isLive ? 'live' : 'replay';
                } catch (e) {}
                try {
                    const d = (typeof yt.getVideoData === 'function') ? yt.getVideoData() : null;
                    if (d && typeof d.isLive === 'boolean') return d.isLive ? 'live' : 'replay';
                } catch (e) {}
            }
            return CHAT_MODE_DEFAULT;
        }

        /* ★エンドポイントは2種類ある。ここを取り違えると
           「このライブストリームではチャットは無効です」と表示される。
             ・live_chat        … 配信『中』のライブチャット（公式ドキュメント記載の形式）
             ・live_chat_replay … 配信終了後のアーカイブに残るチャットリプレイ
           このアプリは主にアーカイブの同時視聴に使うため replay を既定にする。 */
        function buildLiveChatUrl(videoId, mode) {
            const endpoint = (mode === 'live') ? 'live_chat' : 'live_chat_replay';
            return 'https://www.youtube.com/' + endpoint
                + '?v=' + encodeURIComponent(videoId)
                + '&embed_domain=' + encodeURIComponent(getChatEmbedDomain())
                + '&dark_theme=1';
        }

        /* 📼/🔴 の切り替え。
           iframeの中身はクロスオリジンで読めないため、
           「チャットが無効と出た＝エンドポイント違い」を自動判定できない。
           そのため手動で切り替えられるようにしておく。 */
        function toggleChatMode(cardId) {
            chatMode[cardId] = (getChatMode(cardId) === 'replay') ? 'live' : 'replay';
            chatModeManual[cardId] = true;   // 以降この動画では自動判定を上書きしない
            chatLoadedVideoId[cardId] = null;
            updateChatContent(cardId, true);
            saveChatState();
        }

        function updateChatModeButton(cardId) {
            const btn = document.getElementById('chatModeBtn_' + cardId);
            if (!btn) return;
            const live = getChatMode(cardId) === 'live';
            btn.innerText = live ? '🔴' : '📼';
            btn.title = live
                ? '現在: 配信中(ライブ)チャット ／ クリックでアーカイブ用に切替'
                : '現在: アーカイブ(リプレイ)チャット ／ クリックで配信中用に切替';
        }

        function showChatNote(cardId, html) {
            const iframe = document.getElementById('chatIframe_' + cardId);
            const note = document.getElementById('chatNote_' + cardId);
            if (iframe) { iframe.src = 'about:blank'; iframe.style.display = 'none'; }
            if (note) { note.innerHTML = html; note.style.display = 'flex'; }
            chatLoadedVideoId[cardId] = null;
        }

        /* チャットiframeの内容を（必要なら）更新する。
           呼び出し元: 動画ロード完了時 / プレイリスト送り / トグルON / 🔄 */
        /* ------------------------------------------------------------
           チャット内容の確定

           ★モード判定はA側の推測に頼らない。
             IFrame Player API の getProgressState().isLive は
             「ライブ配信のアーカイブ」でも true を返すことがあり、
             その結果アーカイブに live_chat を使ってしまい
             「このライブストリームではチャットは無効です」に戻ってしまう。

           そこでアドオンにwatchページを取りに行かせ、
             ytInitialPlayerResponse.videoDetails.isLive
               … 今まさに配信中のときだけ true（アーカイブは false）
           を正解として使う。continuation も同時に受け取る。
           ------------------------------------------------------------ */
        function updateChatContent(cardId, force) {
            if (!chatVisible[cardId]) return;
            const iframe = document.getElementById('chatIframe_' + cardId);
            const note = document.getElementById('chatNote_' + cardId);
            if (!iframe || !note) return;

            if (!getChatEmbedDomain()) {
                showChatNote(cardId,
                    '<b>file:// では表示できません</b>' +
                    '<span>YouTubeのチャット埋め込みは親ページのドメイン指定（embed_domain）が必須です。<br>' +
                    'ローカルサーバー（http://localhost/…）または GitHub Pages 経由で開いてください。</span>');
                return;
            }

            const videoId = getChatVideoId(cardId);
            if (!videoId) {
                showChatNote(cardId,
                    '<b>チャットを表示できません</b>' +
                    '<span>この枠にYouTube動画が読み込まれていません。<br>' +
                    'ローカル動画にはチャットがありません。</span>');
                return;
            }

            // 動画が変わったら手動指定を解除する
            const prevVideoId = chatLoadedVideoId[cardId] ? String(chatLoadedVideoId[cardId]).split('|')[0] : null;
            if (prevVideoId !== videoId) chatModeManual[cardId] = false;

            const info = chatInfoCache[videoId];

            // まだ問い合わせていない → アドオンへ取りに行かせる（手動指定時は待たない）
            if (!info && !chatModeManual[cardId] && !chatContinuationFailed[videoId]) {
                showChatNote(cardId,
                    '<b>チャット情報を取得しています…</b>' +
                    '<span>アドオン経由でYouTubeから<br>配信状態とチャットの位置情報を取得しています。</span>');
                requestChatContinuation(cardId, videoId);
                return;
            }

            // モードの確定: 手動指定 > アドオンの回答 > ローカル推測
            let mode;
            if (chatModeManual[cardId]) {
                mode = getChatMode(cardId);
            } else if (info) {
                mode = info.isLive ? 'live' : 'replay';
                chatMode[cardId] = mode;
            } else {
                mode = detectChatMode(cardId);
                chatMode[cardId] = mode;
            }

            const loadKey = videoId + '|' + mode;
            if (!force && chatLoadedVideoId[cardId] === loadKey) return;

            updateChatModeButton(cardId);
            const titleEl0 = document.getElementById('chatHeadTitle_' + cardId);
            if (titleEl0) titleEl0.innerText = (mode === 'live') ? '💬 ライブ' : '💬 リプレイ';

            if (mode === 'replay') {
                const cont = (info && info.continuation) || chatContinuationCache[videoId];
                if (!cont) {
                    showChatFallbackNote(cardId,
                        chatContinuationFailed[videoId] ||
                        'この動画にはチャットリプレイがありません（通常動画／チャット無効／メンバー限定の可能性）');
                    return;
                }
                note.innerHTML = ''; note.style.display = 'none';
                iframe.style.display = 'block';
                // リプレイは親からの再生位置通知が届くまで本文が動かないため、
                // 読み込み完了直後に1回押し込んでおく（以後はtickごとのpumpが継続）。
                iframe.onload = function () { setTimeout(pumpChatProgress, 300); };
                iframe.src = buildReplayChatUrl(cont);
                chatLoadedVideoId[cardId] = loadKey;
                return;
            }

            note.innerHTML = '';
            note.style.display = 'none';
            iframe.style.display = 'block';
            iframe.src = buildLiveChatUrl(videoId, mode);
            chatLoadedVideoId[cardId] = loadKey;
        }

        /* ★continuation を encodeURIComponent してはいけない。
           ytInitialData 内のトークンは既にURLエンコード済みで格納されており
           （末尾の '=' が '%3D' の形で入っている）、再エンコードすると
           '%253D' となってYouTube側が受け取る値が壊れる。
           その結果、チャットUIの外枠だけ描画され本文が永久に出ない、
           という分かりにくい症状になる。
           念のため「まだエンコードされていないトークン」の場合だけ
           エンコードするよう判定を入れておく。 */
        function encodeContinuation(token) {
            return /%[0-9A-Fa-f]{2}/.test(token) ? token : encodeURIComponent(token);
        }

        function buildReplayChatUrl(continuation) {
            return 'https://www.youtube.com/live_chat_replay'
                + '?continuation=' + encodeContinuation(continuation)
                + '&embed_domain=' + encodeURIComponent(getChatEmbedDomain())
                + '&dark_theme=1';
        }

        /* アドオンへ continuation の取得を依頼する。
           同じ動画への多重要求は inflight で抑止する（レイアウト更新のたびに
           updateChatContent が呼ばれるため、抑止しないと要求が連打される）。 */
        function requestChatContinuation(cardId, videoId) {
            if (chatContinuationInflight[videoId]) return;
            const requestId = 'cont_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
            chatContinuationInflight[videoId] = requestId;
            chatContinuationPending[requestId] = { cardId: cardId, videoId: videoId };

            window.postMessage({ type: 'CHAT_CONTINUATION_REQUEST', videoId: videoId, requestId: requestId }, '*');

            setTimeout(function () {
                if (!chatContinuationPending[requestId]) return; // 応答済み
                delete chatContinuationPending[requestId];
                delete chatContinuationInflight[videoId];
                chatContinuationFailed[videoId] = 'アドオンから応答がありませんでした（アドオン未導入／未更新の可能性）';
                if (chatVisible[cardId]) showChatFallbackNote(cardId, chatContinuationFailed[videoId]);
            }, CHAT_CONTINUATION_TIMEOUT_MS);
        }

        function handleChatContinuationResult(requestId, continuation, error, isLive) {
            const pending = chatContinuationPending[requestId];
            if (!pending) return; // タイムアウト済み or 無関係
            delete chatContinuationPending[requestId];
            delete chatContinuationInflight[pending.videoId];

            console.log('[チャット] 情報取得:', pending.videoId,
                        'isLive=' + isLive,
                        continuation ? ('continuation長=' + String(continuation).length +
                                        ' 末尾=' + String(continuation).slice(-8))
                                     : ('continuationなし: ' + (error || '')));

            if (isLive === true || continuation) {
                chatInfoCache[pending.videoId] = {
                    isLive: isLive === true,
                    continuation: continuation || null
                };
                if (continuation) chatContinuationCache[pending.videoId] = continuation;
                delete chatContinuationFailed[pending.videoId];
                chatLoadedVideoId[pending.cardId] = null;
                updateChatContent(pending.cardId, true);
            } else {
                chatContinuationFailed[pending.videoId] = error || 'この動画にチャットリプレイが見つかりませんでした';
                if (chatVisible[pending.cardId]) {
                    showChatFallbackNote(pending.cardId, chatContinuationFailed[pending.videoId]);
                }
            }
        }

        // 取得できなかったときの案内。watchページへの逃げ道を必ず添える。
        function showChatFallbackNote(cardId, reason) {
            showChatNote(cardId,
                '<b>チャットを枠内に表示できません</b>' +
                '<span>' + String(reason || '').replace(/</g, '&lt;') + '</span>' +
                '<button onclick="openWatchPageAt(\'' + cardId + '\')">YouTubeを別窓で開く（現在位置）</button>' +
                '<span class="sub">配信中の動画なのにこの表示が出る場合は<br>' +
                'ヘッダーの 📼 を押して 🔴（ライブ）へ切り替えてください。<br>' +
                '🔄 で再取得できます。</span>');
        }

        // 🔄: 現在の再生位置から読み直す（ズレたとき用）
        function reloadChat(cardId) {
            const vid = getChatVideoId(cardId);
            if (vid) {
                delete chatInfoCache[vid];
                delete chatContinuationCache[vid];
                delete chatContinuationFailed[vid];
                delete chatContinuationInflight[vid];
            }
            chatLoadedVideoId[cardId] = null;
            updateChatContent(cardId, true);
        }

        /* アーカイブ用の逃げ道: watchページを『現在の再生位置』で別窓に開く。
           watchページ内であればチャットリプレイが正規の手順で動作する。 */
        function openWatchPageAt(cardId) {
            const videoId = getChatVideoId(cardId);
            if (!videoId) { alert('この枠にはYouTube動画が読み込まれていません。'); return; }
            let sec = 0;
            const yt = ytPlayers[cardId];
            if (yt && typeof yt.getCurrentTime === 'function') {
                try { sec = Math.floor(yt.getCurrentTime() || 0); } catch (e) {}
            }
            window.open('https://www.youtube.com/watch?v=' + encodeURIComponent(videoId) + '&t=' + sec + 's',
                'yt_watch_' + cardId, 'width=1000,height=760');
        }

        // ⧉: 枠が狭いときの逃げ道として、公式のポップアウトチャットを別窓で開く
        function openChatPopout(cardId) {
            const videoId = getChatVideoId(cardId);
            if (!videoId) { alert('この枠にはYouTube動画が読み込まれていません。'); return; }
            // ★リプレイのポップアウトも同じ理由で成立しないため、watchページを開く。
            if (getChatMode(cardId) !== 'live') { openWatchPageAt(cardId); return; }
            window.open('https://www.youtube.com/live_chat?v=' + encodeURIComponent(videoId) + '&is_popout=1',
                'yt_chat_' + cardId, 'width=420,height=720');
        }

        // チャット欄の表示/非表示をトグル
        function toggleChatVisibility(cardId) {
            const willShow = !chatVisible[cardId];
            chatVisible[cardId] = willShow;
            if (!willShow) {
                const iframe = document.getElementById('chatIframe_' + cardId);
                if (iframe) iframe.src = 'about:blank';   // 裏で読み込み続けないよう停止
                chatLoadedVideoId[cardId] = null;
            }
            applyChatLayoutForCard(cardId);
            if (willShow) updateChatContent(cardId);
            updateToggleAllChatsBtn();
            saveChatState();
        }

        /* 全枠のチャットを一括で開閉する。
           1枠でも閉じていれば「全部開く」、全部開いていれば「全部閉じる」。 */
        function toggleAllChats() {
            const willShow = activeCardIds.some(id => !chatVisible[id]);
            activeCardIds.forEach(id => {
                if (!!chatVisible[id] === willShow) return; // 既に目的の状態
                chatVisible[id] = willShow;
                if (!willShow) {
                    const f = document.getElementById('chatIframe_' + id);
                    if (f) f.src = 'about:blank';
                    chatLoadedVideoId[id] = null;
                }
                applyChatLayoutForCard(id);
            });
            updateToggleAllChatsBtn();
            saveChatState();
        }

        function updateToggleAllChatsBtn() {
            const btn = document.getElementById('toggleAllChatsBtn');
            if (!btn) return;
            const anyClosed = activeCardIds.some(id => !chatVisible[id]);
            btn.innerText = anyClosed ? '全枠のチャットを表示' : '全枠のチャットを隠す';
        }

        // 枠を空にする / ローカル動画へ差し替える等でチャットを畳む
        function closeChat(cardId) {
            chatVisible[cardId] = false;
            chatLoadedVideoId[cardId] = null;
            const iframe = document.getElementById('chatIframe_' + cardId);
            if (iframe) iframe.src = 'about:blank';
            applyChatLayoutForCard(cardId);
            saveChatState();
        }

        function clearChatState(cardId) {
            delete chatVisible[cardId];
            delete chatRatio[cardId];
            delete chatLoadedVideoId[cardId];
            delete chatMode[cardId];
            delete chatModeManual[cardId];
            saveChatState();
        }

        function saveChatState() {
            try {
                localStorage.setItem('sync_chat_visible_map', JSON.stringify(chatVisible));
                localStorage.setItem('sync_chat_ratio_map', JSON.stringify(chatRatio));
                localStorage.setItem('sync_chat_mode_map', JSON.stringify(chatMode));
            } catch (e) {}
        }
        function loadChatState() {
            try { chatVisible = JSON.parse(localStorage.getItem('sync_chat_visible_map')) || {}; }
            catch (e) { chatVisible = {}; }
            try { chatRatio = JSON.parse(localStorage.getItem('sync_chat_ratio_map')) || {}; }
            catch (e) { chatRatio = {}; }
            try { chatMode = JSON.parse(localStorage.getItem('sync_chat_mode_map')) || {}; }
            catch (e) { chatMode = {}; }
        }

        /* リプレイチャットを動画の再生位置へ追従させる。
           チャットを開いている枠だけに、1秒間隔で現在位置を通知する。 */
        function pumpChatProgress() {
            activeCardIds.forEach(function (cardId) {
                if (!chatVisible[cardId]) return;
                const yt = ytPlayers[cardId];
                if (!yt || typeof yt.getCurrentTime !== 'function') return;

                // プレイリストで次の動画へ進んだ場合はチャットも差し替える
                const nowId = getChatVideoId(cardId);
                const loaded = chatLoadedVideoId[cardId];
                if (nowId && loaded && loaded.split('|')[0] !== nowId) {
                    updateChatContent(cardId, true);
                    return;
                }

                // 再生位置の追従はリプレイ専用。配信中のライブチャットは常に最新なので不要。
                if (getChatMode(cardId) !== 'replay') return;

                const iframe = document.getElementById('chatIframe_' + cardId);
                if (!iframe || !iframe.contentWindow || iframe.style.display === 'none') return;
                let t = 0;
                try { t = yt.getCurrentTime() || 0; } catch (e) { return; }

                /* ターゲットオリジンは '*' にする。
                   'https://www.youtube.com' 決め打ちだと、YouTube側が
                   www無し等へ内部リダイレクトした場合に送信自体が失敗する。
                   受信側のオリジン検証は別途YouTubeが行うため、'*' でも
                   こちらから情報が漏れる相手は当該iframeのみ。 */
                try {
                    iframe.contentWindow.postMessage(
                        JSON.stringify({ 'yt-player-video-progress': t }), '*');
                    // 再生/停止の状態も併せて通知する（リプレイの進行判定に使われる）
                    let st = -1;
                    try { st = yt.getPlayerState(); } catch (e) {}
                    if (st >= 0) {
                        iframe.contentWindow.postMessage(
                            JSON.stringify({ 'yt-player-state-change': st }), '*');
                    }
                    if (CHAT_DEBUG && (chatDebugCount[cardId] || 0) < 5) {
                        chatDebugCount[cardId] = (chatDebugCount[cardId] || 0) + 1;
                        console.log('[チャット] 進行通知 →', cardId, 't=' + t.toFixed(1), 'state=' + st);
                    }
                } catch (e) {
                    if (CHAT_DEBUG) console.warn('[チャット] 進行通知の送信に失敗:', e);
                }
            });
        }

        /* ------------------------------------------------------------
           診断モード。コンソールで chatDebug(true) と打つと、
             ・こちらから送っている進行通知
             ・チャットiframeから返ってくるメッセージ（あれば）
           の両方が見えるようになる。

           リプレイ本文が流れない場合、原因は次のどちらかに絞られる:
             (a) こちらの送信が出ていない        → 「進行通知 →」が出ない
             (b) 送信は出ているが無視されている  → 出ているのに本文が動かない
           (b) の場合、最も疑わしいのは postMessage のオリジン検証。
           embed_domain には scheme と port を含められないため、
           http://127.0.0.1:8080 から開くと YouTube 側が期待する
           https://127.0.0.1 と一致せず、通知が捨てられている可能性がある。
           その場合は GitHub Pages 経由（オリジンが完全一致する）で動く。
           ------------------------------------------------------------ */
        let CHAT_DEBUG = false;
        let chatDebugCount = {};
        function chatDebug(on) {
            CHAT_DEBUG = (on !== false);
            chatDebugCount = {};
            console.log('[チャット] 診断モード:', CHAT_DEBUG ? 'ON' : 'OFF',
                        '/ このページのorigin =', window.location.origin,
                        '/ embed_domain =', getChatEmbedDomain());
            return CHAT_DEBUG;
        }

        // チャットiframeからの返信を観測する（双方向に通信できているかの確認用）
        window.addEventListener('message', function (e) {
            if (!CHAT_DEBUG) return;
            if (typeof e.origin === 'string' && e.origin.indexOf('youtube.com') >= 0) {
                console.log('[チャット] iframeから受信:', e.origin,
                            String(typeof e.data === 'string' ? e.data : JSON.stringify(e.data)).slice(0, 200));
            }
        });

        function isChatOnRight() {
            const el = document.getElementById('chatPosition');
            return !el || el.value === 'right';
        }

        /* 1枠ぶんのチャット欄レイアウトを確定させる。
           表示/非表示・配置方向・幅(高さ)の比率をここに集約し、
           他の関数が chatContainer.style を直接いじらないようにする。 */
        function applyChatLayoutForCard(cardId) {
            const wrapper = document.getElementById('wrapper_' + cardId);
            const splitter = document.getElementById('splitter_' + cardId);
            const chat = document.getElementById('chatContainer_' + cardId);
            const btn = document.getElementById('chatToggleBtn_' + cardId);
            if (!wrapper || !splitter || !chat) return;

            const visible = !!chatVisible[cardId];
            const onRight = isChatOnRight();
            let ratio = chatRatio[cardId] || CHAT_RATIO_DEFAULT;
            ratio = Math.max(CHAT_RATIO_MIN, Math.min(CHAT_RATIO_MAX, ratio));
            chatRatio[cardId] = ratio;

            wrapper.style.flexDirection = onRight ? 'row' : 'column';

            if (btn) btn.classList.toggle('active', visible);
            updateChatModeButton(cardId);

            if (!visible) {
                chat.style.display = 'none';
                splitter.style.display = 'none';
                return;
            }

            chat.style.display = 'flex';
            splitter.style.display = 'block';

            if (onRight) {
                splitter.style.width = '4px';  splitter.style.height = 'auto';
                splitter.style.cursor = 'col-resize';
                chat.style.width = (ratio * 100) + '%';
                chat.style.height = 'auto';
            } else {
                splitter.style.width = 'auto'; splitter.style.height = '4px';
                splitter.style.cursor = 'row-resize';
                chat.style.width = 'auto';
                chat.style.height = (ratio * 100) + '%';
            }

            // 表示状態なら中身も確定させる（同じ動画なら再読込はされない）
            try { updateChatContent(cardId); } catch (e) {}
        }

        function updateChatLayout() {
            activeCardIds.forEach(applyChatLayoutForCard);
            updateToggleAllChatsBtn();
        }

        /* スプリッターのドラッグ。
           px ではなく「枠に対する比率」で保持するため、
           枠数変更やウィンドウリサイズをしても見た目の割合が保たれる。 */
        function setupChatSplitters() {
            let isDragging = false, currentSplitter = null, currentCardId = null, isHorizontal = true;

            function beginDrag(target, clientX, clientY, e) {
                if (!target.classList || !target.classList.contains('chat-splitter')) return;
                isDragging = true;
                currentSplitter = target;
                currentCardId = target.id.replace('splitter_', '');
                isHorizontal = isChatOnRight();
                currentSplitter.classList.add('dragging');
                // ドラッグ中はiframeがマウスイベントを奪うので無効化する
                document.querySelectorAll('.player-container-wrapper iframe').forEach(f => f.style.pointerEvents = 'none');
                if (e) e.preventDefault();
            }

            function moveDrag(clientX, clientY) {
                if (!isDragging || !currentCardId) return;
                const wrapper = document.getElementById('wrapper_' + currentCardId);
                if (!wrapper) return;
                const rect = wrapper.getBoundingClientRect();
                let ratio;
                if (isHorizontal) {
                    if (!rect.width) return;
                    ratio = (rect.right - clientX) / rect.width;
                } else {
                    if (!rect.height) return;
                    ratio = (rect.bottom - clientY) / rect.height;
                }
                chatRatio[currentCardId] = Math.max(CHAT_RATIO_MIN, Math.min(CHAT_RATIO_MAX, ratio));
                applyChatLayoutForCard(currentCardId);
            }

            function endDrag() {
                if (!isDragging) return;
                isDragging = false;
                if (currentSplitter) currentSplitter.classList.remove('dragging');
                document.querySelectorAll('.player-container-wrapper iframe').forEach(f => f.style.pointerEvents = 'auto');
                saveChatState();
                currentSplitter = null; currentCardId = null;
            }

            document.addEventListener('mousedown', (e) => beginDrag(e.target, e.clientX, e.clientY, e));
            document.addEventListener('mousemove', (e) => moveDrag(e.clientX, e.clientY));
            document.addEventListener('mouseup', endDrag);

            document.addEventListener('touchstart', (e) => {
                const t = e.touches[0];
                if (t) beginDrag(e.target, t.clientX, t.clientY, e);
            }, { passive: false });
            document.addEventListener('touchmove', (e) => {
                const t = e.touches[0];
                if (isDragging && t) { moveDrag(t.clientX, t.clientY); e.preventDefault(); }
            }, { passive: false });
            document.addEventListener('touchend', endDrag);
        }

        /* ============================================================
           一括シーク時のズレ解消（v2.4.3）

           ■ 直した問題
           従来の applySeekToAll() は3経路へシークを投げっぱなしにしていた。
           再生中に一括シークすると、各動画が別々のタイミングで再開する。

           ■ 実測（2026-07-25 / Firefox / GitHub Pages）
           | 経路         | 停止→再開 | シーク後の再生開始     |
           | ローカル動画 |   0〜2ms  | シーク自体に最大2000ms |
           | YouTube      |  10〜12ms | 295ms（幅4ms・固定）   |
           | 外部動画     |   0〜1ms  | 片道約5ms              |

           ローカル動画の遅さはキーフレーム間隔30秒によるデコード時間。
           ファイル側の性質なのでコードでは短縮できない。よって「待つ」。
           YouTube は内部を読めないが値が安定しているので定数で先行させる。

           ■ 併せて判明したこと
           YouTube はシーク後に何秒待っても再生開始が295msから縮まらない
           （停止中はバッファリングしないため）。待機で吸収する方式は無効で、
           定数先行が唯一の手段。
           ============================================================ */

        /* 実測由来の定数。回線やPCが変わったら再測定すること。 */
        const YT_PLAY_LEAD_MS        = 295;   // YouTube: playVideo() から実再生まで
        const EXT_PLAY_LEAD_MS       = 5;     // 外部動画: A→B の片道遅延
        const SEEK_SETTLE_TIMEOUT_MS = 3000;  // これを超えたら待たずに強行再開

        let seekSettleToken = 0;   // 連打時に古い待機を無効化するための世代番号

        /* ローカル動画のシーク完了を待つ。

           ⚠️ 'playing' イベントで判定してはいけない。
           currentTime への代入によるシークは非同期に進むため、代入直後の
           play() は「落ちる前の readyState」を見て即座に playing を発火させ、
           シーク未完了のまま「完了」と誤判定する。
           'seeked' + readyState>=3 の両方で判定すること。

           差分が微小でシークが発生しない場合は seeked が飛ばないため、
           ポーリングを併用して取りこぼしを防ぐ。 */
        function waitLocalSeeked(video, timeoutMs) {
            return new Promise(resolve => {
                let done = false;
                const finish = (ok) => {
                    if (done) return;
                    done = true;
                    clearTimeout(tm); clearInterval(iv);
                    video.removeEventListener('seeked', onSeeked);
                    resolve(ok);
                };
                const onSeeked = () => { if (video.readyState >= 3) finish(true); };
                video.addEventListener('seeked', onSeeked);
                // 呼び出し側がシークを発行する前にこの関数を呼ぶ前提のため、
                // 初回チェックは即時に行わず必ず1tick待つ（誤検知防止）。
                const iv = setInterval(() => {
                    if (!video.seeking && video.readyState >= 3) finish(true);
                }, 25);
                const tm = setTimeout(() => finish(false), timeoutMs);
            });
        }

        /* 待機中であることをユーザーへ示す。カウントダウン用オーバーレイを流用。 */
        function showSeekWaitOverlay(show) {
            const overlay = document.getElementById('countdownOverlay');
            if (!overlay) return;
            if (show) {
                overlay.innerText = '準備中…';
                overlay.style.color = '#00ffcc';
                overlay.style.display = 'block';
            } else {
                overlay.style.display = 'none';
                overlay.style.color = '#ff4757';
            }
        }

        /* 経路ごとの遅延を打ち消して、実再生の瞬間を揃える。
           YouTube を基準（0ms）に置き、速い経路ほど後ろへずらす。 */
        function staggeredResume() {
            Object.values(ytPlayers).forEach(p => {
                if (p && typeof p.playVideo === 'function') p.playVideo();
            });
            setTimeout(() => {
                broadcastSyncCommand('play');
            }, Math.max(0, YT_PLAY_LEAD_MS - EXT_PLAY_LEAD_MS));
            setTimeout(() => {
                document.querySelectorAll('.custom-local-video').forEach(v => v.play().catch(() => {}));
            }, YT_PLAY_LEAD_MS);
        }

        function applySeekToAll(diff, broadcastToAddon, excludeCardId = null) {
            globalCurrentTime = Math.max(0, globalCurrentTime + diff);
            updateTimerDisplay();

            const wasPlaying = isPlayingRequest;
            const myToken = ++seekSettleToken;

            // ① 再生中なら全経路をいったん止める。ズレの発生源を断つ。
            //    isPlayingRequest は落とさない（ボタン表示は「一括停止」のまま）。
            if (wasPlaying) pauseAllPlayersOnly();

            // ② 待機はシーク発行より先に仕掛ける。
            //    後から addEventListener すると seeked を取り逃す可能性がある。
            const waiters = [];
            if (wasPlaying) {
                document.querySelectorAll('.custom-local-video').forEach(v => {
                    const id = v.id.replace('localVideo_', '');
                    if (id === excludeCardId) return;
                    if (!v.src || v.src === window.location.href) return;
                    waiters.push(waitLocalSeeked(v, SEEK_SETTLE_TIMEOUT_MS));
                });
            }

            // ③ 3経路へシークを発行（ここは従来どおり）
            if (broadcastToAddon) broadcastSyncCommand('seek', diff);
            document.querySelectorAll('.custom-local-video').forEach(v => {
                const id = v.id.replace('localVideo_', '');
                if (id !== excludeCardId) v.currentTime = Math.max(0, v.currentTime + diff);
            });
            Object.entries(ytPlayers).forEach(([id, player]) => {
                if (id !== excludeCardId && player && typeof player.getCurrentTime === 'function') {
                    player.seekTo(Math.max(0, player.getCurrentTime() + diff), true);
                }
            });

            // 停止中のシークは揃える必要がない（次の一括再生で揃う）
            if (!wasPlaying) return;

            // ④ 全ローカル動画が整うまで待ってから、経路別オフセットで再開
            if (!waiters.length) { staggeredResume(); return; }

            showSeekWaitOverlay(true);
            Promise.all(waiters).then(results => {
                showSeekWaitOverlay(false);
                if (myToken !== seekSettleToken) return;   // 連打で追い越された
                if (!isPlayingRequest) return;             // 待機中に停止操作が入った
                if (results.some(ok => !ok)) {
                    console.warn('【コントローラー】シーク完了待ちがタイムアウトしました（' +
                                 SEEK_SETTLE_TIMEOUT_MS + 'ms）。そのまま再開します。');
                }
                staggeredResume();
            });
        }
        function skipPlayer(cardId, seconds) {
            const yt = ytPlayers[cardId];
            const lv = document.getElementById('localVideo_' + cardId);
            if (yt && typeof yt.getCurrentTime === 'function') yt.seekTo(Math.max(0, yt.getCurrentTime() + seconds), true);
            else if (lv) lv.currentTime = Math.max(0, lv.currentTime + seconds);
        }
        function changePlaybackSpeed(val) {
            currentPlaybackSpeed = Math.min(2.0, Math.max(0.25, currentPlaybackSpeed + val));
            currentPlaybackSpeed = parseFloat(currentPlaybackSpeed.toFixed(1)); 
            document.getElementById('speedDisplay').innerText = currentPlaybackSpeed.toFixed(1);
            applyPlaybackSpeed(); saveSettings();
        }
        function applyPlaybackSpeed() {
            document.querySelectorAll('.custom-local-video').forEach(v => v.playbackRate = currentPlaybackSpeed);
            Object.values(ytPlayers).forEach(player => {
                if (player && typeof player.setPlaybackRate === 'function') player.setPlaybackRate(currentPlaybackSpeed);
            });
            broadcastSyncCommand('speed', currentPlaybackSpeed);
        }

        function togglePlayPauseAll() {
            if (isPlayingRequest) pauseAll();
            else {
                // 「全枠ロード済み」かつ「このラインナップで初回」の再生時のみ自動バックアップ
                tryAutoSaveOnFirstPlay();
                const isDelayEnabled = document.getElementById('enableDelaySync').checked;
                if (isDelayEnabled) startDelayCountdown(); else playAll();
            }
        }
        function startDelayCountdown() {
            cancelCountdown();
            isPlayingRequest = true; 
            const playPauseBtn = document.getElementById('playPauseBtn');
            playPauseBtn.innerText = '⏸ カウント中止'; playPauseBtn.classList.remove('primary'); playPauseBtn.classList.add('playing-state');
            const overlay = document.getElementById('countdownOverlay');
            overlay.style.display = 'block';
            let count = parseInt(document.getElementById('delaySec').value, 10) || 3;
            overlay.innerText = count;
            countdownInterval = setInterval(() => {
                count--;
                if (count > 0) {
                    overlay.innerText = count; overlay.style.animation = 'none'; overlay.offsetHeight; overlay.style.animation = '';
                } else if (count === 0) {
                    overlay.innerText = 'START!'; overlay.style.color = '#00ffcc'; overlay.style.textShadow = '0 0 35px rgba(0,0,0,0.95), 0 0 15px #00ffcc';
                    const pBtn = document.getElementById('playPauseBtn');
                    pBtn.innerText = '⏸ 一括停止';
                    playAllPlayersOnly(); 
                    countdownTimer = setTimeout(() => {
                        overlay.style.display = 'none'; overlay.style.color = '#ff4757'; overlay.style.textShadow = '0 0 35px rgba(0, 0, 0, 0.95), 0 0 15px #ff4757';
                    }, 800);
                    clearInterval(countdownInterval); countdownInterval = null;
                }
            }, 1000);
        }
        function cancelCountdown() {
            if (countdownInterval) { clearInterval(countdownInterval); countdownInterval = null; }
            clearTimeout(countdownTimer);
            const overlay = document.getElementById('countdownOverlay');
            overlay.style.display = 'none'; overlay.style.color = '#ff4757';
        }
        function playAll() {
            isPlayingRequest = true;
            const btn = document.getElementById('playPauseBtn');
            btn.innerText = '⏸ 一括停止'; btn.classList.remove('primary'); btn.classList.add('playing-state');
            playAllPlayersOnly();
        }
        function pauseAll() {
            isPlayingRequest = false;
            cancelCountdown();
            const btn = document.getElementById('playPauseBtn');
            btn.innerText = '▶ 一括再生'; btn.classList.add('primary'); btn.classList.remove('playing-state');
            pauseAllPlayersOnly();
        }
        function playAllPlayersOnly() {
            broadcastSyncCommand('play');
            document.querySelectorAll('.custom-local-video').forEach(v => v.play().catch(e=>{}));
            Object.entries(ytPlayers).forEach(([id, player]) => {
                if (player && typeof player.playVideo === 'function') player.playVideo();
            });
        }
        function pauseAllPlayersOnly() {
            broadcastSyncCommand('pause');
            document.querySelectorAll('.custom-local-video').forEach(v => v.pause());
            Object.values(ytPlayers).forEach(player => {
                if (player && typeof player.pauseVideo === 'function') player.pauseVideo();
            });
        }
        function skipAll(seconds) { applySeekToAll(seconds, true, null); }
        function changeMasterVolume(value) {
            document.querySelectorAll('.custom-local-video').forEach(v => {
                v.volume = Math.max(0, Math.min(1, value / 100));
                // cardIdは 'card_3' のようにアンダースコアを含むため split('_')[1] では 'card' になってしまう。
                // prefixを除去する方式に修正。
                const cardId = v.id.replace('localVideo_', '');
                const localVolInput = document.getElementById('localVolume_' + cardId);
                if (localVolInput) localVolInput.value = value;
                const icon = document.getElementById('localVolIcon_' + cardId);
                if (icon) icon.innerText = v.volume === 0 ? '🔇' : (v.volume < 0.5 ? '🔉' : '🔊');
            });
            Object.values(ytPlayers).forEach(player => {
                if (player && typeof player.setVolume === 'function') player.setVolume(value);
            });
        }

        /* ------------------------------------------------------------
           タイマーのティック処理
           「時間同調の基準（マスター）」の種別に応じて globalCurrentTime を更新する。

           ・local_<cardId> : そのローカル動画の再生位置をそのまま反映（壁時計は使わない）
           ・internal       : 実経過時間 × 再生速度 を加算（再生中のみ）
           ・external       : アドオンへ定期的に requestTime を送り、timeReport の返答で更新

           【設計上の注意】
           この処理が書き換えるのは #mainTimer のテキストのみで、
           <select> の option や DOM構造には一切触れない。
           過去に発生していた「ポーリングによるちらつき・プルダウンが閉じる」不具合は
           DOMプロパティの再書き込みが原因だったため、ここでは再発しない。

           setInterval + performance.now() の差分方式を採用している。
           バックグラウンドタブでタイマーが間引かれても、実経過時間から算出するため
           ズレが蓄積しない（requestAnimationFrame は非表示タブで停止するため不採用）。
           ------------------------------------------------------------ */
        let timerTickHandle = null;
        const TIMER_TICK_MS = 250;
        // 外部配信サイトへの時間問い合わせ間隔（250ms × 2 = 500ms ごと）
        const EXTERNAL_POLL_TICKS = 2;
        let externalPollCounter = 0;

        function syncGlobalTimeFromMaster() {
            const now = performance.now();
            const elapsedSec = (now - lastTimeUpdate) / 1000;
            lastTimeUpdate = now;

            const mode = getCurrentMasterType();

            if (mode.startsWith('local_')) {
                const video = document.getElementById('localVideo_' + mode.replace('local_', ''));
                if (video) {
                    globalCurrentTime = video.currentTime;
                    globalDuration = isFinite(video.duration) ? video.duration : 0;
                }
            } else if (mode === 'internal') {
                globalDuration = 0;
                // カウントダウン中は isPlayingRequest が true でも実際には未再生のため進めない
                if (isPlayingRequest && !countdownInterval) {
                    globalCurrentTime += elapsedSec * currentPlaybackSpeed;
                }
            } else if (mode === 'external') {
                // 外部配信サイトが基準の場合、アドオン側（content_video.js）は
                // requestTime を受け取ったときしか timeReport を送らない。
                // そのため、ここから定期的に現在時間を要求し続ける。
                //
                // ポーリング方式にしている利点:
                //   ・A側の「一括再生」だけでなく、配信サイト側で直接再生した場合も追従する
                //   ・配信サイト側で一時停止すれば報告値が止まるため、タイマーも自然に停止する
                //   ・B側（アドオン）の改修が不要（requestTime / timeReport は実装済み）
                globalDuration = 0; // 外部動画の総再生時間は取得できないため常に0
                externalPollCounter++;
                if (externalPollCounter >= EXTERNAL_POLL_TICKS) {
                    externalPollCounter = 0;
                    broadcastSyncCommand('requestTime');
                }
            }
            // globalCurrentTime の実際の更新は timeReport 受信ハンドラ側で行われる

            /* リプレイチャットを各枠の再生位置へ追従させる。
               YouTubeの視聴ページは高頻度で進行を通知しているため毎tick送る。 */
            try { pumpChatProgress(); } catch (e) {}

            updateTimerDisplay();
        }

        function startTimerTick() {
            if (timerTickHandle) return;
            lastTimeUpdate = performance.now();
            timerTickHandle = setInterval(syncGlobalTimeFromMaster, TIMER_TICK_MS);
        }

        function updateTimerDisplay() {
            if (!isEditingTimer) {
                const cur = formatTime(globalCurrentTime);
                const dur = formatTime(globalDuration);
                document.getElementById('mainTimer').innerText = globalDuration > 0 ? cur + ' / ' + dur : cur;
            }
        }

        function editTimer() {
            isEditingTimer = true;
            const display = document.getElementById('mainTimer');
            const input = document.getElementById('timerInput');
            input.value = display.innerText.split(' / ')[0];
            display.style.display = 'none'; input.style.display = 'inline-block'; input.focus();
        }
        function finishEditTimer() {
            if (!isEditingTimer) return;
            isEditingTimer = false;
            const display = document.getElementById('mainTimer');
            const input = document.getElementById('timerInput');
            const parts = input.value.split(':').reverse();
            let sec = 0;
            if (parts[0]) sec += parseFloat(parts[0]) || 0;
            if (parts[1]) sec += (parseFloat(parts[1]) || 0) * 60;
            if (parts[2]) sec += (parseFloat(parts[2]) || 0) * 3600;
            globalCurrentTime = Math.max(0, sec);
            broadcastSyncCommand('seekTo', globalCurrentTime);
            document.querySelectorAll('.custom-local-video').forEach(v => { v.currentTime = globalCurrentTime; });
            Object.entries(ytPlayers).forEach(([id, player]) => {
                if (player && typeof player.seekTo === 'function') player.seekTo(globalCurrentTime, true);
            });
            display.style.display = 'inline-block'; input.style.display = 'none'; updateTimerDisplay();
        }
        function resetGlobalTimer() {
            globalCurrentTime = 0;
            broadcastSyncCommand('seekTo', 0);
            document.querySelectorAll('.custom-local-video').forEach(v => { v.currentTime = 0; });
            Object.entries(ytPlayers).forEach(([id, player]) => {
                if (player && typeof player.seekTo === 'function') player.seekTo(0, true);
            });
            updateTimerDisplay();
        }
        function requestExternalTime() { broadcastSyncCommand('requestTime'); }

        function toggleControllerLock() {
            isControllerLocked = !isControllerLocked;
            const btn = document.getElementById('lockControllerBtn');
            btn.innerText = isControllerLocked ? '🔒' : '🔓';
            saveSettings();
            if (isControllerLocked) showController(); else hideController();
        }
        function showController() {
            const controller = document.getElementById('overlayController');
            const mainView = document.getElementById('mainView');
            controller.classList.add('active'); mainView.classList.add('controller-active'); 
        }
        function hideController() {
            if (isControllerLocked) return;
            const controller = document.getElementById('overlayController');
            const mainView = document.getElementById('mainView');
            controller.classList.remove('active'); mainView.classList.remove('controller-active'); 
        }
        function setupHoverController() {
            const controller = document.getElementById('overlayController');
            let hideTimer;
            document.addEventListener('mousemove', (e) => {
                if (e.clientY > window.innerHeight - 80) { showController(); clearTimeout(hideTimer); } 
                else { clearTimeout(hideTimer); hideTimer = setTimeout(() => { if (!controller.matches(':hover')) hideController(); }, 1500); }
            });
            controller.addEventListener('mouseenter', () => { showController(); clearTimeout(hideTimer); });
            controller.addEventListener('mouseleave', () => { clearTimeout(hideTimer); hideTimer = setTimeout(() => { hideController(); }, 1000); });
        }

        function saveSettings() {
            localStorage.setItem('sync_layout2_dir', document.getElementById('layout2Dir').value);
            const colsEl = document.getElementById('layoutCols');
            if (colsEl) localStorage.setItem('sync_layout_cols', colsEl.value);
            localStorage.setItem('sync_player_count', playerCount); 
            localStorage.setItem('sync_ui_size', document.getElementById('uiSizeSelect').value);
            localStorage.setItem('sync_chat_position', document.getElementById('chatPosition').value);
            localStorage.setItem('sync_skip_sec_back', document.getElementById('skipSecBack').value); 
            localStorage.setItem('sync_skip_sec_forward', document.getElementById('skipSecForward').value); 
            localStorage.setItem('sync_enable_delay_sync', document.getElementById('enableDelaySync').checked);
            localStorage.setItem('sync_delay_sec', document.getElementById('delaySec').value);
            localStorage.setItem('sync_playback_speed', currentPlaybackSpeed);
            localStorage.setItem('sync_master_volume', document.getElementById('masterVolume').value);
            localStorage.setItem('sync_controller_lock', isControllerLocked);
            localStorage.setItem('sync_confirm_reset', document.getElementById('confirmReset').checked);
            localStorage.setItem('sync_confirm_delete', document.getElementById('confirmDelete').checked);
            localStorage.setItem('sync_master_mode', getCurrentMasterType());
        }
        function loadSavedSettings() {
            loadChatState(); // チャットの表示状態・幅の比率・モードを復元
            if (localStorage.getItem('sync_layout2_dir')) setSelectValueSafe('layout2Dir', localStorage.getItem('sync_layout2_dir'), 'horizontal');
            if (localStorage.getItem('sync_layout_cols')) setSelectValueSafe('layoutCols', localStorage.getItem('sync_layout_cols'), 'auto');
            if (localStorage.getItem('sync_player_count')) {
                playerCount = parseInt(localStorage.getItem('sync_player_count'), 10) || 2;
                updatePlayerCountDisplay();
            }
            if (localStorage.getItem('sync_ui_size')) {
                const size = localStorage.getItem('sync_ui_size');
                document.getElementById('uiSizeSelect').value = size; document.documentElement.setAttribute('data-ui-size', size);
            }
            if (localStorage.getItem('sync_chat_position')) document.getElementById('chatPosition').value = localStorage.getItem('sync_chat_position');
            if (localStorage.getItem('sync_skip_sec_back')) document.getElementById('skipSecBack').value = localStorage.getItem('sync_skip_sec_back');
            if (localStorage.getItem('sync_skip_sec_forward')) document.getElementById('skipSecForward').value = localStorage.getItem('sync_skip_sec_forward');
            if (localStorage.getItem('sync_enable_delay_sync') !== null) document.getElementById('enableDelaySync').checked = localStorage.getItem('sync_enable_delay_sync') === 'true';
            if (localStorage.getItem('sync_delay_sec')) document.getElementById('delaySec').value = localStorage.getItem('sync_delay_sec');
            if (localStorage.getItem('sync_playback_speed')) {
                currentPlaybackSpeed = parseFloat(localStorage.getItem('sync_playback_speed')) || 1.0;
                document.getElementById('speedDisplay').innerText = currentPlaybackSpeed.toFixed(1);
            }
            if (localStorage.getItem('sync_master_volume')) document.getElementById('masterVolume').value = localStorage.getItem('sync_master_volume');
            if (localStorage.getItem('sync_controller_lock') === 'true') {
                isControllerLocked = true;
                const btn = document.getElementById('lockControllerBtn');
                if (btn) btn.innerText = '🔒';
                showController();
            }
            if (localStorage.getItem('sync_confirm_reset') !== null) document.getElementById('confirmReset').checked = localStorage.getItem('sync_confirm_reset') === 'true';
            if (localStorage.getItem('sync_confirm_delete') !== null) document.getElementById('confirmDelete').checked = localStorage.getItem('sync_confirm_delete') === 'true';
            toggleDelaySettingView();
            setTimeout(() => {
                const savedMaster = localStorage.getItem('sync_master_mode');
                if (savedMaster) {
                    const select = document.getElementById('syncMasterSelect');
                    if (select && select.querySelector('option[value="' + savedMaster + '"]')) select.value = savedMaster;
                }
                updateMasterOptions();
            }, 300);
        }
        function clearAllSettings() {
            if (confirm('すべての設定と保存URLをリセットしますか？')) { localStorage.clear(); location.reload(); }
        }
</script>
</body>
</html>
