<!DOCTYPE html>

<head>

<title>統合テスト用紙 ─ v2.8.5 ピン留め時のレイアウト崩れ</title>

<!-- ============================================================================
     統合テスト用紙 v3.0.0 ─ 手順書と回答欄を1枚にしたHTML（開発基盤）

     🔴 ローカル専用。GitHub Pages には置かない。
     🔴 controller.html と同じポートに置かない（本体の「全設定をリセット」は
        localStorage.clear() なので、同一オリジンだと下書きが巻き添えで消える）。
     🔴 このファイルは本体を一切参照しない。単体で開いて使う。

     次回の使い方: FORM_META と STEPS だけを差し替える。
                   CSS・描画・自己診断・コピー・下書き・3つの照合は毎回そのまま。
     ========================================================================= -->

<script>
/* ===========================================================================
   ▼▼▼ ここから: 毎回差し替える定義 ▼▼▼

   STEPS は上から順に描画する配列。要素は3種類。
     節見出し … { sec, html }
     手順     … { ttl, rows, note, copy, start, ans }
                 rows は [やること, これで何をしたいか] の2列
                 start は「押したあとログに出るはずの開始行」（チェック欄が1つ増える）
                 copy は 🔴 文字列だけ。配列にしない（1項目1ボタンを型で強制する）
     回答のみ … { ans } だけ

   ans のキー
     id        … 🔴 手順の見出し番号と同じにする
     type      … 'suite' | 'paste' | 'radio' | 'check' | 'text' | 'shot'
     expectIds … 🔴 type:'suite' のとき、その欄に揃っているべきテストIDの配列
     options   … 「未実施」「測れなかった（理由は自由記入へ）」は自動で足される
     secret    … true で「ある / ない」の radio に強制
     optional  … true で未記入として数えない
   =========================================================================== */

var FORM_META = {
    defVersion: '2026-09-13.v286b',
    work: 'v2.8.6 再測 ─ ビューポート基準の測定の修正（debug_suite v1.8.2）',
    base: '本体 index.html v2.8.6 / manifest.json v2.8.6 / debug_suite.js v1.8.2 / 統合テスト用紙 v3.0.0',
    expectApp: '2.8.6',
    expectSuite: '1.8.2',
    staleHours: 24,
    note: '🔴 <b>本体（index.html / manifest.json）は前回のまま、差し替えるのは '
        + '<code>debug_suite.js</code> の1本だけです。</b>'
        + '前回（suite 1.8.1）は D-Y1 / D-Y5 / D-Y6 の3本が「判定不能」で終わりました。'
        + '本体が壊れていたのではなく、<b>測定手段の側の作りが誤っていた</b>ためです。'
        + 'それを直した版で、同じ一括をもう一度だけ回します。'
        + '押すボタンは 🐞 デバッグパネルの中の1つだけ（T1）。'
        + '🔴 <b>測定のあいだ、ブラウザのウィンドウの大きさを変えないでください。</b>'
};

var STEPS = [

/* ============================ 節1: 準備 ============================ */
{ sec: '節1  準備（差し替えるのは1本だけ）', html:
    '<b>何が起きていたか</b>: はみ出しを画面基準で測る仕組みが「本当に反応するか」を'
    + '確かめる自己診断で、<b>末尾の枠を 300px 下へずらす</b>という作りにしていました。'
    + 'ところが<b>ピン留めしたあとの末尾の枠は左上へ移動している</b>ため、'
    + '300px 下げても画面の下端に届かず、「反応しない」と判定されていました。'
    + '<br>（実測: ピン枠の下端 644px ＋ 300px ＝ 944px に対して画面の高さは 954px。'
    + '3枠のときだけ通ったのは、ピン枠が 907px と高く偶然下端を越えたためです）'
    + '<br><b>直し方</b>: ずらす対象を<b>「そのとき最も下にある枠」</b>に変え、'
    + 'ずらす量も固定をやめて<b>「画面の下端を100px超える量」を毎回計算</b>するようにしました。'
    + '<br>⚪ <b>本体の判定はすべて合格していました。</b>'
    + '案A（<code>min-height: 0</code>）が効いていることも D-Y8 で確認済みです'
    + '（外すと画面外へ 353px はみ出し、戻すと 0）。'
},

{
    ttl: 'TS　debug_suite.js だけを差し替えて、版数が揃ったことを確かめる',
    rows: [
        ['<code>debug_suite.js</code>（v1.8.2）を <b>index.html と同じフォルダ</b>へ上書きする',
         '今回の差し替えはこの1本だけ'],
        ['⚠️ <code>index.html</code> と <code>manifest.json</code> は<b>触らない</b>（2.8.6 のまま）',
         '本体は前回のまま。アドオンの再読み込みも不要'],
        ['コントローラーのURLに <code>?debug=1&amp;v=286b</code> を付けて開き直す',
         'ブラウザのキャッシュで古い debug_suite.js が読まれるのを避けるため'],
        ['🐞 デバッグ を押し、見出しが <code>[suite 1.8.2 / app 2.8.6]</code> であることを見る',
         '🔴 ここが 1.8.1 のままなら、キャッシュが残っている。測定が丸ごと無駄になる'],
        ['<b>「🗑 ログを消す」を1回押す</b>',
         '⚠️ 前回の実行結果が残っていると、出力に今回要求していないIDが混ざる'],
        ['🔴 <b>この時点でウィンドウの大きさを決め、以降は変えない</b>',
         '枠の矩形を見る判定なので、途中で変えると全部ずれる'],
        ['下のチェック欄で、済んだものすべてにチェックを入れる', '抜けをその場で捕まえるため']
    ],
    ans: {
        id: 'TS', type: 'check',
        label: '準備した内容（当てはまるものすべて）',
        options: [
            'debug_suite.js を上書きした（v1.8.2）',
            'index.html と manifest.json は触っていない',
            'パネルの見出しが [suite 1.8.2 / app 2.8.6] だった',
            '「🗑 ログを消す」を押した',
            'ウィンドウの大きさを決めた（以降は変えない）'
        ]
    }
},

{
    ttl: 'TW　いま使っているウィンドウの大きさを書く',
    rows: [
        ['🐞 デバッグ パネルの見出しの下、または出力の1行目に出ている'
            + '<b>「画面: 横×縦」</b>の値を<b>そのまま</b>書き写す',
         '🔴 前回は用紙に 1386x910、測定側に 1362x954 と食い違いが出た。'
            + '⚠️ ウィンドウ枠の大きさではなく、<b>パネルに出ている数字</b>を写すこと'],
        ['⚠️ 分からなければ「測れなかった」でよい（T1 の出力にも同じ値が入る）',

    ],

        id: 'TW', type: 'text',
        label: '測定中のウィンドウの大きさ（🐞 パネルの「画面:」の値をそのまま）',
        help: '前回の測定側の実測値は 1362x954 でした。'
    }
},

/* ============================ 節2: 本命 ============================ */
{ sec: '節2  🔴 本命 ─ 同じ一括をもう一度回す（自動判定）', html:
    '前回と同じ「📐 D-Y レイアウト一括」を回します。'
    + '<b>見るのは、前回 ❌ だった positive control が ⚪ に変わり、'
    + 'D-Y1 / D-Y5 / D-Y6 が「判定不能」から「合格」になること</b>です。'
    + '<br>⚠️ <b>判定の内容そのものは前回から変えていません。</b>'
    + '変えたのは「測定手段が反応することの確かめ方」だけです。'
    + '<br>🔴 <b>枠の追加・削除・ピンの付け外し・列数の変更は、すべてテストのコードが自動で行います。</b>'
},

{
    ttl: 'T1　📐 D-Y レイアウト一括 を実行する',
    rows: [
        ['🐞 デバッグ を押してパネルを開く', 'ボタンを出すため'],
        ['<b>「📐 D-Y レイアウト一括（Y1→Y2→Y3→Y4→Y5→Y6→Y7→Y8）」を1回だけ</b>押す',
         '8本を1回の実行で揃える。報告書の数値を1回の測定に揃えるため'],
        ['ログに <code>=== 📐 D-Y レイアウト一括 開始（</code> で始まる行が出たことを確認し、'
            + '下のチェックを入れる', '押したのに始まっていない状態をその場で捕まえるため'],
        ['そのまま<b>6〜11分</b>待つ。⚠️ 途中で枠・設定・ウィンドウの大きさを触らない',
         '枠の位置と大きさが判定そのものだから'],
        ['🔴 <b>待っているあいだ、マウスを動かさないでください（画面の上に置いたままにしない）</b>',
         '枠にカーソルが乗るとヘッダーが出て、画面の下端に寄ると一括コントローラーが出る。'
            + 'どちらも測っている高さが変わる'],
        ['⚠️ 途中で枠数が増減し、縦1列や2列に並び替わる。D-Y4 では動画が3本読み込まれる。'
            + '<b>いずれもテストのコードの動作で、異常ではない</b>',
         '驚いて途中で止めてしまわないため'],
        ['<code>=== 📐 D-Y レイアウト一括 完了 ===</code> が出たら、'
            + '<b>📋 報告書用にコピー</b> を押す', '出力をクリップボードへ入れるため'],
        ['下の貼り付け欄に貼る（Ctrl+V）', '受け取り側が判定するため']
    ],
    note: '🔴 <b>D-Y4 は保存URLを一時的に書き換えますが、終了時に自動で元へ戻します。</b>'
        + '<br>⚠️ D-Y7 と D-Y8 は「グリッド列数」を 1列 / 2列へ一時的に変えますが、'
        + '終了時に元の設定へ戻します。'
        + '<br>⚠️ 測定後、画面の枠には D-Y4 が読み込んだ動画が残ります。'
        + '<b>ページを再読み込みすると元の構成に戻ります。</b>',
    start: '=== 📐 D-Y レイアウト一括 開始（',
    ans: {
        id: 'T1', type: 'suite',
        label: '「📐 D-Y レイアウト一括」の出力',
        expectIds: ['D-Y1', 'D-Y2', 'D-Y3', 'D-Y4', 'D-Y5', 'D-Y6', 'D-Y7', 'D-Y8']
    }
},

/* ============================ 節3: 記録 ============================ */
{ sec: '節3  記録（1問だけ）', html:
    '目視は前回すべて済んでいるので繰り返しません（T4・T5・T6 はいずれも期待どおりでした）。'
},

{
    ttl: 'T2　前回と同じ環境で測ったか',
    rows: [
        ['前回（2026-09-13 の1回目）と<b>同じブラウザ・同じウィンドウの大きさ</b>で測ったかを答える',
         '🔴 矩形の数値は画面の大きさで変わる。違う環境なら前回と数値を比べられない'],
        ['違う場合は、何が違うかを自由記入へ書く', '受け取り側が数値の比較可否を判断できるように']
    ],
    ans: {
        id: 'T2', type: 'radio',
        label: '前回（Floorp 12.17.2@155.0 / 画面 1362x954）と同じ環境でしたか',
        options: [
            '同じブラウザ・同じウィンドウの大きさで測った',
            '同じブラウザだが、ウィンドウの大きさは変えた',
            '別のブラウザで測った（自由記入へ）'
        ]
    }
}

];

/* ▲▲▲ ここまで: 毎回差し替える定義 ▲▲▲ */
</script>

<body>

<header>
    <h1 id="hTitle">統合テスト用紙</h1>
    <div class="meta" id="hMeta"></div>
    <div><span id="blankCount">未記入 －件</span></div>
</header>

<main>
    <div class="note" id="hNote"></div>
    <div id="form"></div>
</main>

<div id="scratch" aria-hidden="true"></div>

<footer>
    <span id="status"></span>
    <button type="button" class="sub" id="btnClear">🗑 下書きを消す</button>
    <button type="button" class="sub" id="btnDownload">⬇ .md を保存</button>
    <button type="button" id="btnCopy">📋 報告書用にコピー</button>
</footer>

<script>
(function () {
    'use strict';

    /* エンジンの版数。項目定義の版数（FORM_META.defVersion）とは別系統。 */
    var FORM_ENGINE_VERSION = '3.0.0';

    /* 選択肢に必ず足すもの。空欄と「答えられなかった」を区別するために要る。 */
    var EXTRA_CHOICES = ['未実施', '測れなかった（理由は自由記入へ）'];
    var SECRET_CHOICES = ['ある', 'ない'];

    var LS_KEY = 'test_form_draft';

    var answers = {};
    var freeText = '';
    var restoredAt = '';

    /* ------------------------------------------------------------------ */
    /* 項目の正規化（純関数。自己診断からも呼ぶ）                          */
    /* ------------------------------------------------------------------ */

    function normalize(it) {
        var o = {
            id: String(it.id),
            type: String(it.type || 'text'),
            label: String(it.label || ''),
            help: it.help ? String(it.help) : '',
            secret: !!it.secret,
            optional: !!it.optional,
            options: (it.options || []).slice(),
            expectIds: (it.expectIds || []).slice(),
            noSkip: !!it.noSkip
        };
        /* 🔴 secret は type が何であっても「ある / ない」の radio に落とす。 */
        if (o.secret) {
            o.type = 'radio';
            o.options = SECRET_CHOICES.slice();
            o.noSkip = true;
        }
        if ((o.type === 'radio' || o.type === 'check') && !o.noSkip) {
            EXTRA_CHOICES.forEach(function (c) {
                if (o.options.indexOf(c) < 0) o.options.push(c);
            });
        }
        return o;
    }

    /* STEPS を、描画用の並び（節見出し / 手順 / 回答欄）へ展開する。
       🔴 画面の並び ＝ 手順の順 ＝ 出力の順。節でまとめ直さない。 */
    var ITEMS = [];      /* 回答欄だけを順に並べたもの */
    var BLOCKS = [];     /* 描画の単位 */

    (function buildBlocks() {
        STEPS.forEach(function (st) {
            if (st.sec) { BLOCKS.push({ kind: 'sec', sec: st.sec, html: st.html || '' }); return; }

            if (st.ttl) {
                /* 🔴 copy は配列にしない。1項目1ボタンを型で強制する。 */
                if (Object.prototype.toString.call(st.copy) === '[object Array]') {
                    alert('項目定義の誤り: copy は配列にできません（1項目1ボタン）。見出し: ' + st.ttl);
                    st.copy = st.copy[0];
                }
                BLOCKS.push({
                    kind: 'step', ttl: st.ttl, rows: st.rows || [],
                    note: st.note || '', copy: st.copy || ''
                });
            }

            /* 押したあと「ログに開始行が出たか」のチェック（同じ項目の中に必ず1つ置く）。 */
            if (st.start && st.ans && st.ans.id) {
                var sit = normalize({
                    id: st.ans.id + '-log', type: 'check',
                    label: 'ボタンを押したあと、ログに開始行が出ましたか',
                    help: '出るはずの行の先頭: ' + st.start,
                    options: ['この開始行がログに出た'],
                    noSkip: false
                });
                ITEMS.push(sit);
                BLOCKS.push({ kind: 'ans', item: sit });
            }

            if (st.ans) {
                var it = normalize(st.ans);
                ITEMS.push(it);
                BLOCKS.push({ kind: 'ans', item: it });
            }
        });
    })();

    (function () {
        var seen = {}, dup = [];
        ITEMS.forEach(function (it) {
            if (seen[it.id]) dup.push(it.id);
            seen[it.id] = true;
        });
        if (dup.length) alert('項目定義に重複した id があります: ' + dup.join(', '));
    })();

    /* ------------------------------------------------------------------ */
    /* 🔴 3つの照合（v3.0.0 の新設）                                        */
    /*    いずれも debug_suite.js の出力に既に入っている情報を読むだけ。     */
    /* ------------------------------------------------------------------ */

    /* ① 要求したテストIDが揃っているか。
       🔴 抽出は出力の一覧表の行頭から取る。ログの文言からは拾わない。 */
    function matchIds(text, expectIds) {
        var found = {}, list = [];
        var re = /^\|\s*(D-[A-Za-z]+\d*)\s/gm;
        var m;
        while ((m = re.exec(String(text))) !== null) {
            if (!found[m[1]]) { found[m[1]] = true; list.push(m[1]); }
        }
        var missing = (expectIds || []).filter(function (id) { return !found[id]; });
        var extra = list.filter(function (id) { return (expectIds || []).indexOf(id) < 0; });
        return { ok: missing.length === 0, found: list, missing: missing, extra: extra };
    }

    /* ② 版数が期待どおりか。 */
    function matchVersions(text) {
        var s = String(text);
        var suite = (s.match(/debug_suite:\s*`([^`]+)`/) || [])[1] || null;
        var app = (s.match(/APP_VERSION:\s*`([^`]+)`/) || [])[1] || null;
        var badge = (s.match(/版数バッジ:\s*`([^`]*)`/) || [])[1];
        if (badge === undefined) badge = null;
        var suiteOk = (suite === FORM_META.expectSuite);
        var appOk = (app === FORM_META.expectApp);
        return {
            ok: suiteOk && appOk,
            suite: suite, app: app, badge: badge,
            suiteOk: suiteOk, appOk: appOk
        };
    }

    /* ③ 出力の実行日時が古すぎないか（前のラウンドの出力を貼り直す事故）。 */
    function matchStamp(text, nowMs) {
        var m = String(text).match(/実行日時:\s*([0-9T:.\-]+Z)/);
        if (!m) return { ok: false, stamp: null, hours: null, reason: '実行日時が見つからない' };
        var t = Date.parse(m[1]);
        if (!isFinite(t)) return { ok: false, stamp: m[1], hours: null, reason: '日時を解釈できない' };
        var hours = ((nowMs || Date.now()) - t) / 3600000;
        return {
            ok: hours <= FORM_META.staleHours,
            stamp: m[1], hours: Math.round(hours * 100) / 100, reason: ''
        };
    }

    function runMatches(it, text) {
        if (it.type !== 'suite' || !String(text).trim()) return null;
        return {
            ids: matchIds(text, it.expectIds),
            ver: matchVersions(text),
            stamp: matchStamp(text)
        };
    }

    function it_expectLen(r) {
        return r.ids.found.length - r.ids.extra.length;
    }

    function matchLines(r) {
        var L = [], ok = true;
        if (!r.ids.ok) {
            ok = false;
            L.push('❌ 要求したテストIDが足りません: ' + r.ids.missing.join(' , '));
        } else {
            L.push('⚪ 要求したテストIDはすべて揃っています（' + (it_expectLen(r)) + '件）');
        }
        if (r.ids.extra.length) L.push('（この回で要求していないIDも入っています: ' + r.ids.extra.join(' , ') + '）');

        if (!r.ver.ok) {
            ok = false;
            L.push('❌ 版数が期待と違います: debug_suite = ' + r.ver.suite
                + '（期待 ' + FORM_META.expectSuite + '） / APP_VERSION = ' + r.ver.app
                + '（期待 ' + FORM_META.expectApp + '）');
        } else {
            L.push('⚪ 版数は期待どおりです（suite ' + r.ver.suite + ' / app ' + r.ver.app + '）');
        }
        if (r.ver.badge !== null) L.push('（版数バッジの実測: ' + r.ver.badge + '）');

        if (!r.stamp.ok) {
            ok = false;
            L.push('❌ 出力の実行日時が古すぎます'
                + (r.stamp.stamp ? '（' + r.stamp.stamp + ' / ' + r.stamp.hours + '時間前）'
                                 : '（' + r.stamp.reason + '）')
                + ' ─ 前のラウンドの出力を貼っていないか確かめてください');
        } else {
            L.push('⚪ 実行日時は ' + r.stamp.hours + ' 時間前です');
        }
        return { ok: ok, lines: L };
    }

    /* ------------------------------------------------------------------ */
    /* 未記入の判定                                                        */
    /* ------------------------------------------------------------------ */

    function ans(id) {
        if (!answers[id]) answers[id] = { choice: '', checks: [], text: '', done: false, memo: '' };
        return answers[id];
    }

    function isBlank(it) {
        if (it.optional) return false;
        var a = ans(it.id);
        switch (it.type) {
            case 'radio': return !a.choice;
            case 'check': return !(a.checks && a.checks.length);
            case 'shot':  return !a.done;
            default:      return !String(a.text || '').trim();
        }
    }

    function blankItems() { return ITEMS.filter(isBlank); }

    /* ------------------------------------------------------------------ */
    /* 描画                                                                */
    /* ------------------------------------------------------------------ */

    function el(tag, cls, text) {
        var e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text !== undefined) e.textContent = text;
        return e;
    }

    function render() {
        document.getElementById('hTitle').textContent = '統合テスト用紙 ─ ' + FORM_META.work;
        document.getElementById('hMeta').textContent =
            '用紙 ' + FORM_ENGINE_VERSION + ' / 項目定義 ' + FORM_META.defVersion
            + ' / 基点: ' + FORM_META.base;
        document.getElementById('hNote').textContent = (FORM_META.note || '')
            + ' 埋め終わったら「📋 報告書用にコピー」を押してください。';

        var host = document.getElementById('form');
        host.innerHTML = '';

        BLOCKS.forEach(function (b) {
            if (b.kind === 'sec') {
                var s = el('div', 'sec');
                var h2 = el('h2', null, b.sec);
                s.appendChild(h2);
                if (b.html) {
                    var d = el('div', 'secbody');
                    d.innerHTML = b.html;
                    s.appendChild(d);
                }
                host.appendChild(s);
                return;
            }
            if (b.kind === 'step') {
                host.appendChild(renderStep(b));
                return;
            }
            host.appendChild(renderItem(b.item));
        });

        /* 🔴 自由記入欄は必ず末尾に置く。
           用紙の枠に収まらない観察が捨てられるのが様式化の最大の危険である。 */
        var box = el('div', 'item');
        box.id = 'item_FREE';
        var h = el('div');
        h.appendChild(el('span', 'id', '自由'));
        h.appendChild(el('span', 'label', '枠に収まらなかった観察・気づいたこと・疑問'));
        box.appendChild(h);
        box.appendChild(el('p', 'help',
            '空でも構いません。「おかしいと思ったが項目が無かった」ことがあれば書いてください。'));
        var ta = el('textarea', 'paste');
        ta.style.height = '200px';
        ta.style.maxHeight = '200px';
        ta.style.whiteSpace = 'pre-wrap';
        ta.value = freeText;
        ta.addEventListener('input', function () { freeText = ta.value; save(); });
        box.appendChild(ta);
        host.appendChild(box);

        updateBlank();
    }

    function renderStep(b) {
        var wrap = el('div', 'step');
        wrap.appendChild(el('h3', null, b.ttl));

        if (b.rows.length) {
            var tb = document.createElement('table');
            tb.className = 'rows';
            var thead = document.createElement('tr');
            thead.appendChild(el('th', null, 'やること'));
            thead.appendChild(el('th', null, 'これで何をしたいか'));
            tb.appendChild(thead);
            b.rows.forEach(function (r) {
                var tr = document.createElement('tr');
                var td1 = document.createElement('td');
                td1.innerHTML = String(r[0]);
                var td2 = document.createElement('td');
                td2.innerHTML = String(r[1] === undefined ? '' : r[1]);
                tr.appendChild(td1); tr.appendChild(td2);
                tb.appendChild(tr);
            });
            wrap.appendChild(tb);
        }
        if (b.note) {
            var n = el('div', 'warn-note');
            n.innerHTML = b.note;
            wrap.appendChild(n);
        }
        if (b.copy) {
            /* 🔴 1項目1ボタン。配列で持てる作りにしない。 */
            var cb = el('button', 'copybtn', '📋 上のコードをコピー');
            cb.type = 'button';
            cb.addEventListener('click', function () { copyText(b.copy); });
            wrap.appendChild(cb);
        }
        return wrap;
    }

    function renderItem(it) {
        var wrap = el('div', 'item');
        wrap.id = 'item_' + it.id;
        wrap.setAttribute('data-type', it.type);

        var head = el('div');
        head.appendChild(el('span', 'id', it.id));
        head.appendChild(el('span', 'label', it.label));
        wrap.appendChild(head);

        if (it.help) wrap.appendChild(el('p', 'help', it.help));
        if (it.secret) {
            wrap.appendChild(el('p', 'secret-warn',
                '🔴 認証情報の項目です。値を書く欄はありません。'));
        }

        var a = ans(it.id);

        if (it.type === 'radio' || it.type === 'check') {
            var choices = el('div', 'choices');
            var gname = 'g_' + it.id;
            it.options.forEach(function (opt, i) {
                var l = el('label', 'choice');
                var inp = document.createElement('input');
                inp.type = (it.type === 'radio') ? 'radio' : 'checkbox';
                inp.name = gname; inp.value = opt; inp.id = gname + '_' + i;
                inp.checked = (it.type === 'radio')
                    ? (a.choice === opt) : (a.checks.indexOf(opt) >= 0);
                inp.addEventListener('change', function () {
                    if (it.type === 'radio') {
                        a.choice = inp.checked ? opt : '';
                    } else {
                        var k = a.checks.indexOf(opt);
                        if (inp.checked && k < 0) a.checks.push(opt);
                        if (!inp.checked && k >= 0) a.checks.splice(k, 1);
                    }
                    save(); updateBlank();
                });
                l.appendChild(inp);
                l.appendChild(document.createTextNode(' ' + opt));
                choices.appendChild(l);
            });
            wrap.appendChild(choices);

        } else if (it.type === 'text') {
            var inp2 = document.createElement('input');
            inp2.type = 'text';
            inp2.value = a.text || '';
            inp2.addEventListener('input', function () { a.text = inp2.value; save(); updateBlank(); });
            wrap.appendChild(inp2);

        } else if (it.type === 'paste' || it.type === 'suite') {
            var ta2 = el('textarea', 'paste');
            ta2.placeholder = (it.type === 'suite')
                ? '「📋 報告書用にコピー」の出力を、そのまま貼り付けてください。'
                : '長文をそのまま貼り付けてください（欄の高さは固定です）。';
            ta2.value = a.text || '';
            var len = el('p', 'len', '');
            var mbox = el('div', 'match');
            mbox.style.display = 'none';
            var upd = function () {
                len.textContent = String(ta2.value.length).replace(/\B(?=(\d{3})+(?!\d))/g, ',') + ' 文字';
                showMatch(it, ta2.value, mbox);
            };
            ta2.addEventListener('input', function () { a.text = ta2.value; upd(); save(); updateBlank(); });
            upd();
            wrap.appendChild(ta2);
            wrap.appendChild(len);
            wrap.appendChild(mbox);

        } else if (it.type === 'shot') {
            /* 🔴 画像を一切扱わない。ファイル名の日時で対応づける。 */
            wrap.appendChild(el('p', 'shot-warn',
                '⚠️ Cookie の値・トークン・パスワードが写らない撮り方をしてください。'));
            var l3 = el('label', 'choice');
            var chk2 = document.createElement('input');
            chk2.type = 'checkbox';
            chk2.checked = !!a.done;
            chk2.addEventListener('change', function () { a.done = chk2.checked; save(); updateBlank(); });
            l3.appendChild(chk2);
            l3.appendChild(document.createTextNode(' スクリーンショットを撮った'));
            wrap.appendChild(l3);

            var memo = document.createElement('input');
            memo.type = 'text';
            memo.placeholder = 'ファイル名か日時（省略可）';
            memo.value = a.memo || '';
            memo.addEventListener('input', function () { a.memo = memo.value; save(); });
            wrap.appendChild(memo);
        }

        return wrap;
    }

    function showMatch(it, text, box) {
        var r = runMatches(it, text);
        if (!r) { box.style.display = 'none'; box.textContent = ''; return; }
        var v = matchLines(r);
        box.className = 'match ' + (v.ok ? 'ok' : 'ng');
        box.innerHTML = '';
        v.lines.forEach(function (line) { box.appendChild(el('div', null, line)); });
        box.style.display = 'block';
    }

    function updateBlank() {
        var blanks = blankItems();
        ITEMS.forEach(function (it) {
            var e = document.getElementById('item_' + it.id);
            if (!e) return;
            if (isBlank(it)) e.classList.add('blank'); else e.classList.remove('blank');
        });
        var c = document.getElementById('blankCount');
        c.textContent = '未記入 ' + blanks.length + '件 / 全' + ITEMS.length + '項目';
        c.className = blanks.length ? 'ng' : 'ok';
    }

    /* ------------------------------------------------------------------ */
    /* 🔴 自己診断 ─ 機械で観測できることを自動で集める                    */
    /* ------------------------------------------------------------------ */

    function chk(list, name, actual, expected) {
        var ok = String(actual) === String(expected);
        list.push({ name: name, actual: String(actual), expected: String(expected), ok: ok });
    }

    function runSelfCheck(bodyText) {
        var r = [];

        /* 1. 定義から描画できているか */
        var rendered = document.querySelectorAll('#form .item[data-type]').length;
        chk(r, '項目定義の数だけ描画されている', rendered, ITEMS.length);

        /* 2. 宣言した種別ごとに、想定した入力要素が出ているか */
        var typeNg = [];
        ITEMS.forEach(function (it) {
            var e = document.getElementById('item_' + it.id);
            if (!e) { typeNg.push(it.id + ':描画なし'); return; }
            var ok;
            if (it.type === 'radio') ok = e.querySelectorAll('input[type=radio]').length >= 2;
            else if (it.type === 'check') ok = e.querySelectorAll('input[type=checkbox]').length >= 1;
            else if (it.type === 'text') ok = !!e.querySelector('input[type=text]');
            else if (it.type === 'paste' || it.type === 'suite') ok = !!e.querySelector('textarea.paste');
            else if (it.type === 'shot') ok = !!e.querySelector('input[type=checkbox]')
                && e.querySelectorAll('textarea').length === 0;
            else ok = false;
            if (!ok) typeNg.push(it.id + ':' + it.type);
        });
        chk(r, '宣言した種別どおりの入力欄が出ている',
            typeNg.length ? typeNg.join(' / ') : 'すべて一致', 'すべて一致');

        /* 3. 画像を扱う要素が無いこと */
        var imgish = document.querySelectorAll('#form input[type=file], #form img, #form canvas').length;
        chk(r, '用紙に画像を扱う要素が無い', imgish, 0);

        /* 4. 実行ボタンが1項目に1つを超えていないこと（型で強制した結果の確認） */
        var multi = [];
        Array.prototype.forEach.call(document.querySelectorAll('#form .step'), function (s) {
            var n = s.querySelectorAll('button').length;
            if (n > 1) multi.push((s.querySelector('h3') || {}).textContent + ':' + n + '個');
        });
        chk(r, '1つの手順にボタンが2つ以上並んでいない',
            multi.length ? multi.join(' / ') : 'なし', 'なし');

        /* 5. secret の強制（純関数で確認する） */
        var s = normalize({ id: 'X', type: 'paste', secret: true, label: 'x' });
        chk(r, 'secret 指定は「ある / ない」の radio に強制される',
            s.type + ':' + s.options.join(','), 'radio:ある,ない');

        /* 6. 選択肢の自動追加 */
        var n2 = normalize({ id: 'Y', type: 'radio', label: 'y', options: ['A'] });
        chk(r, '選択肢に「未実施」「測れなかった」が自動で足される',
            n2.options.join(','), 'A,未実施,測れなかった（理由は自由記入へ）');

        /* 7. 長文で高さが変わらないこと（実際に1万文字を入れて測る） */
        var scratch = document.getElementById('scratch');
        var probe = document.createElement('textarea');
        probe.className = 'paste';
        scratch.appendChild(probe);
        var h0 = probe.offsetHeight;
        probe.value = new Array(10001).join('あ');
        var h1 = probe.offsetHeight;
        scratch.removeChild(probe);
        chk(r, '1万文字を入れても貼り付け欄の高さが変わらない', h1 + 'px', h0 + 'px');

        var maxH = 0, maxLen = 0;
        Array.prototype.forEach.call(document.querySelectorAll('#form textarea.paste'), function (t) {
            if (t.offsetHeight > maxH) maxH = t.offsetHeight;
            if (t.value.length > maxLen) maxLen = t.value.length;
        });
        r.push({ name: '画面上の貼り付け欄の最大の高さ / 最大の文字数',
                 actual: maxH + 'px / ' + maxLen + '文字', expected: '（参考値）', ok: null });
        r.push({ name: '横スクロールの有無（scrollWidth / clientWidth）',
                 actual: document.documentElement.scrollWidth + ' / '
                     + document.documentElement.clientWidth,
                 expected: '（参考値）', ok: null });

        /* 8. 未記入の検出と赤枠の一致 */
        var blanks = blankItems().length;
        var painted = document.querySelectorAll('#form .item.blank').length;
        chk(r, '未記入の件数と赤枠の数が一致する', painted, blanks);
        chk(r, '上部の件数表示が実際の未記入と一致する',
            document.getElementById('blankCount').textContent,
            '未記入 ' + blanks + '件 / 全' + ITEMS.length + '項目');

        /* 9. 下書きの往復 */
        var round = 'NG';
        try {
            var k = LS_KEY + ':probe';
            localStorage.setItem(k, 'ok');
            round = (localStorage.getItem(k) === 'ok') ? 'OK' : 'NG';
            localStorage.removeItem(k);
        } catch (e) { round = 'NG(' + (e && e.message) + ')'; }
        chk(r, '下書きの保存と読み直しができる', round, 'OK');
        r.push({ name: '下書きを復元して開いた記録',
                 actual: restoredAt || '（この画面では復元していない）',
                 expected: '（参考値）', ok: null });

        /* 10. 🔴 3つの照合そのものの positive control。
               判定手段を新設したら、それが反応する条件を1つ用意する。 */
        var fake = '| D-Z9 ダミー | ⚪ | 1/1 | なし |';
        var pcIds = matchIds(fake, ['D-Z9', 'D-NOPE1']);
        chk(r, '［PC］照合①が欠けているIDを名指しできる', pcIds.missing.join(','), 'D-NOPE1');
        chk(r, '［PC］照合①が揃っていれば通る', matchIds(fake, ['D-Z9']).ok, true);
        var pcVer = matchVersions('- debug_suite: `9.9.9` / APP_VERSION: `0.0.0`');
        chk(r, '［PC］照合②が版数違いを検出できる', pcVer.ok, false);
        var pcVer2 = matchVersions('- debug_suite: `' + FORM_META.expectSuite
            + '` / APP_VERSION: `' + FORM_META.expectApp + '`');
        chk(r, '［PC］照合②が期待どおりの版数を通す', pcVer2.ok, true);
        var pcOld = matchStamp('- 実行日時: 2000-01-01T00:00:00.000Z');
        chk(r, '［PC］照合③が古い出力を検出できる', pcOld.ok, false);
        var pcNew = matchStamp('- 実行日時: ' + new Date().toISOString());
        chk(r, '［PC］照合③がいまの出力を通す', pcNew.ok, true);

        /* 11. 実際に貼られた出力の照合結果 */
        ITEMS.forEach(function (it) {
            if (it.type !== 'suite') return;
            var a = ans(it.id);
            var m = runMatches(it, a.text || '');
            if (!m) {
                r.push({ name: it.id + ' の照合', actual: '（未記入のため実施せず）',
                         expected: '（参考値）', ok: null });
                return;
            }
            var v = matchLines(m);
            r.push({ name: it.id + ' の照合（ID / 版数 / 実行日時）',
                     actual: v.lines.join(' ／ '), expected: 'すべて ⚪ であること', ok: v.ok });
        });

        /* 12. 出力の構成（自分自身を参照しないよう、組み立て済みの本文を調べる） */
        chk(r, '出力に「テスト結果」の節がある', bodyText.indexOf('## 2. テスト結果') >= 0, true);
        chk(r, '出力の並びが項目定義の順と一致する', orderOk(bodyText), true);
        chk(r, '未記入は「（未記入）」と書かれる',
            blanks === 0 ? true : (bodyText.indexOf('（未記入）') >= 0), true);

        return r;
    }

    function orderOk(bodyText) {
        var pos = -1;
        for (var i = 0; i < ITEMS.length; i++) {
            var p = bodyText.indexOf('### ' + ITEMS[i].id + ' ');
            if (p < 0 || p < pos) return false;
            pos = p;
        }
        return true;
    }

    /* ------------------------------------------------------------------ */
    /* 下書き                                                              */
    /* ------------------------------------------------------------------ */

    function draftKey() { return LS_KEY + ':' + FORM_META.defVersion; }

    var saveTimer = null;
    function save() {
        if (saveTimer) clearTimeout(saveTimer);
        saveTimer = setTimeout(function () {
            try {
                localStorage.setItem(draftKey(), JSON.stringify({
                    engine: FORM_ENGINE_VERSION, def: FORM_META.defVersion,
                    at: new Date().toISOString(), answers: answers, freeText: freeText
                }));
                setStatus('下書き保存 ' + new Date().toLocaleTimeString());
            } catch (e) { setStatus('下書きの保存に失敗: ' + (e && e.message)); }
        }, 250);
    }

    function load() {
        var raw = null;
        try { raw = localStorage.getItem(draftKey()); } catch (e) { return; }
        if (!raw) return;
        var d = null;
        try { d = JSON.parse(raw); } catch (e) { return; }
        if (!d) return;
        answers = d.answers || {};
        freeText = String(d.freeText || '');
        restoredAt = String(d.at || '不明');
        setStatus('下書きを復元しました（' + restoredAt + '）');
    }

    function setStatus(s) { document.getElementById('status').textContent = s; }

    /* ------------------------------------------------------------------ */
    /* 出力                                                                */
    /* ------------------------------------------------------------------ */

    function valueText(it) {
        var a = ans(it.id);
        if (isBlank(it)) return '（未記入）';
        switch (it.type) {
            case 'radio': return a.choice;
            case 'check': return a.checks.join(' / ');
            case 'shot':  return 'スクリーンショットあり（ファイル名の日時で対応）'
                + (a.memo ? ' ─ ' + a.memo : '');
            default: return a.text;
        }
    }

    function isLong(it) { return it.type === 'paste' || it.type === 'suite'; }

    /* 🔴 節2（テスト結果）を先に組み立てる。自己診断はこの本文を見て判定する。 */
    function buildBody() {
        var L = [];
        L.push('## 2. テスト結果（用紙の並び順）');
        L.push('');
        ITEMS.forEach(function (it) {
            L.push('### ' + it.id + ' ' + it.label);
            L.push('');
            if (isLong(it)) {
                if (isBlank(it)) {
                    L.push('（未記入）');
                } else {
                    /* 🔴 貼り付けた本文が ``` を含む（debug_suite の出力は ```json を持つ）。
                       囲みは本文中の最長の連続バッククォートより1つ長くする。 */
                    var t = ans(it.id).text;
                    L.push(fence(t));
                    L.push(t);
                    L.push(fence(t));
                }
            } else {
                L.push(valueText(it));
            }
            L.push('');
        });
        return L.join('\n');
    }

    function buildMarkdown() {
        var body = buildBody();
        var diag = runSelfCheck(body);
        var blanks = blankItems();

        var L = [];
        L.push('# 統合テスト用紙 出力 ─ ' + FORM_META.work);
        L.push('');
        L.push('- 用紙: `' + FORM_ENGINE_VERSION + '` / 項目定義: `' + FORM_META.defVersion + '`');
        L.push('- 基点コード: ' + FORM_META.base);
        L.push('- 期待した版数: APP_VERSION `' + FORM_META.expectApp
            + '` / debug_suite `' + FORM_META.expectSuite + '`');
        L.push('- 提出日時: ' + new Date().toISOString());
        L.push('- 画面: ' + window.innerWidth + ' x ' + window.innerHeight);
        L.push('- **未記入: ' + blanks.length + '件**'
            + (blanks.length ? '（' + blanks.map(function (b) { return b.id; }).join(', ') + '）' : ''));
        L.push('');
        L.push('## 1. 用紙の自己診断（自動収集・人の入力なし）');
        L.push('');
        L.push('| 確認項目 | 実測 | 期待 | 判定 |');
        L.push('| :--- | :--- | :--- | :--: |');
        diag.forEach(function (d) {
            L.push('| ' + md(d.name) + ' | ' + md(d.actual) + ' | ' + md(d.expected) + ' | '
                + (d.ok === null ? '─' : (d.ok ? '⚪' : '❌')) + ' |');
        });
        L.push('');
        L.push(body);
        L.push('## 3. 自由記入（枠に収まらなかった観察）');
        L.push('');
        L.push(String(freeText).trim() ? String(freeText).trim() : '（記入なし）');
        L.push('');
        return L.join('\n');
    }

    function fence(text) {
        var m = String(text).match(/`{3,}/g) || [];
        var max = 2;
        m.forEach(function (x) { if (x.length > max) max = x.length; });
        return new Array(max + 2).join('`');
    }

    function md(s) { return String(s).replace(/\|/g, '\\|').replace(/\n/g, ' '); }

    /* 🔴 未記入や照合の失敗があるときに黙って出さない。ただし提出は止めない。 */
    function confirmBeforeOut() {
        var msgs = [];
        var blanks = blankItems();
        if (blanks.length) {
            msgs.push('未記入が ' + blanks.length + '件あります。');
            msgs.push(blanks.map(function (b) { return '  ' + b.id + '  ' + b.label; }).join('\n'));
            msgs.push('実施していないものは、選択肢の「未実施」を選ぶか、その旨を書いてください。');
        }
        var bad = [];
        ITEMS.forEach(function (it) {
            if (it.type !== 'suite') return;
            var m = runMatches(it, ans(it.id).text || '');
            if (!m) return;
            var v = matchLines(m);
            if (!v.ok) bad.push('  ' + it.id + ' … ' + v.lines.filter(function (x) {
                return x.indexOf('❌') === 0;
            }).join(' / '));
        });
        if (bad.length) {
            msgs.push('');
            msgs.push('照合で警告が出ています:');
            msgs.push(bad.join('\n'));
        }
        if (!msgs.length) return true;
        return window.confirm(msgs.join('\n') + '\n\nこのまま出力しますか？');
    }

    function copyText(text) {
        var done = function (ok) {
            setStatus(ok ? 'クリップボードへコピーしました。' : 'コピーに失敗しました。');
            if (!ok) alert('コピーに失敗しました。「⬇ .md を保存」を使ってください。');
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(function () { done(true); },
                function () { done(fallbackCopy(text)); });
        } else { done(fallbackCopy(text)); }
    }

    /* display:none にすると選択できずコピーに失敗する。画面外へ逃がす。 */
    function fallbackCopy(text) {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed'; ta.style.left = '-9999px'; ta.style.top = '0';
        document.body.appendChild(ta);
        ta.focus(); ta.select();
        var ok = false;
        try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
        document.body.removeChild(ta);
        return ok;
    }

    function download(text) {
        var blob = new Blob([text], { type: 'text/markdown;charset=utf-8' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'test_' + FORM_META.defVersion + '_'
            + new Date().toISOString().replace(/[:.]/g, '-') + '.md';
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
        setStatus('.md を保存しました。');
    }

    /* ------------------------------------------------------------------ */

    document.getElementById('btnCopy').addEventListener('click', function () {
        if (!confirmBeforeOut()) return;
        copyText(buildMarkdown());
    });
    document.getElementById('btnDownload').addEventListener('click', function () {
        if (!confirmBeforeOut()) return;
        download(buildMarkdown());
    });
    document.getElementById('btnClear').addEventListener('click', function () {
        if (!window.confirm('下書きを消して、すべての回答を空にします。よろしいですか？')) return;
        try { localStorage.removeItem(draftKey()); } catch (e) { }
        answers = {}; freeText = ''; restoredAt = '';
        render();
        setStatus('下書きを消しました。');
    });

    load();
    var had = Object.keys(answers).length > 0 || !!freeText;
    render();
    if (!had) setStatus('用紙 ' + FORM_ENGINE_VERSION + ' / 項目定義 ' + FORM_META.defVersion);
})();
</script>
</body>
</html>
